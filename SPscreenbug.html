<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon & Space Power Same Position Loop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top-Right corner positioning */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 220px; 
            height: 150px; /* Adjust this to match your image aspect ratios */
        }

        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: block;
            overflow: hidden;
        }

        /* --- FIXED: Both images sit perfectly on top of each other --- */
        .bug-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            display: block;
            pointer-events: none;
            will-change: transform, opacity;
        }

        /* --- Master 24-Second Timeline Activation --- */
        .looping-active #spacetoon-logo {
            animation: spacetoonMasterLoop 24s ease-in-out infinite;
        }

        .looping-active #spacepower-logo {
            animation: spacePowerSubLoop 24s ease-in-out infinite;
        }

        /* --- Dynamic Clipped Shine Layer --- */
        .bug-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0; 
            width: 100%;
            height: 100%;
            pointer-events: none;
            
            background: linear-gradient(
                115deg,
                transparent 30%,
                rgba(255, 255, 255, 0.75) 50%,
                transparent 70%
            );
            background-size: 200% 100%;
            background-position: var(--shine-pos, 150%) 0;

            /* Changes dynamically via JS to match the active logo's shape */
            -webkit-mask-image: var(--current-mask, url('Stoon3D.png'));
            mask-image: var(--current-mask, url('Stoon3D.png'));
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
        }

        /* --- Spacetoon Timeline (Visible: 0s - 5s, then fades out) --- */
        @keyframes spacetoonMasterLoop {
            0% {
                opacity: 0;
                transform: scale(0) rotate(25deg) translateX(50px) translateZ(0);
            }
            2.5% { 
                transform: scale(1.08) rotate(-5deg) translateX(-5px) translateZ(0);
            }
            4.1% { /* Locked in at 1s */
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateX(0) translateZ(0);
            }
            16.6% { /* Starts fading out right before 5s to hand over to Space Power */
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateX(0) translateZ(0);
            }
            20.8%, 100% {
                opacity: 0;
                transform: scale(0.8) rotate(-10deg) translateZ(0);
            }
        }

        /* --- Space Power Timeline (Visible: 5s - 20s, then exits) --- */
        @keyframes spacePowerSubLoop {
            0%, 16.6% { /* Hidden completely for the first 4 seconds */
                opacity: 0;
                transform: scale(0.8) rotate(10deg) translateZ(0);
            }
            20.8% { /* Appears flawlessly at the 5-second mark in the EXACT same position */
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateZ(0);
            }
            83.3% { /* Stays on screen for 15 seconds (until the 20s mark) */
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateZ(0);
            }
            87.5%, 100% { /* Smooth spin out exit at 21s */
                opacity: 0;
                transform: scale(0) rotate(15deg) translateX(40px) translateZ(0);
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper" id="wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" id="spacetoon-logo" class="bug-image">
            <img src="SpacePower.png" alt="Space Power Logo" id="spacepower-logo" class="bug-image">
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const wrapper = document.getElementById('wrapper');
        
        let shineInterval;
        let timelineTimeout1, timelineTimeout2;
        let masterInterval;
        
        const targetFPS = 25; 
        const frameDuration = 1000 / targetFPS; 

        function triggerSingleShine(logoFileName) {
            // Dynamically updates the clipping mask to match whichever logo is currently showing
            wrapper.style.setProperty('--current-mask', `url('${logoFileName}')`);

            let currentPos = 150;
            const endPos = -50;
            const shineDuration = 1200; 
            const totalFrames = shineDuration / frameDuration; 
            const stepIncrement = (endPos - currentPos) / totalFrames;

            if (shineInterval) clearInterval(shineInterval);

            shineInterval = setInterval(() => {
                currentPos += stepIncrement;
                if (currentPos <= endPos) {
                    clearInterval(shineInterval);
                } else {
                    wrapper.style.setProperty('--shine-pos', `${currentPos}%`);
                }
            }, frameDuration);
        }

        function runBroadcastTimeline() {
            clearAllTimeouts();

            // 1. Shine on Spacetoon at 1 second mark
            timelineTimeout1 = setTimeout(() => {
                triggerSingleShine('Stoon3D.png');
            }, 1000);

            // 2. Shine on Space Power at 6 second mark (1s after it appears)
            timelineTimeout2 = setTimeout(() => {
                triggerSingleShine('SpacePower.png');
            }, 6000);
        }

        function clearAllTimeouts() {
            clearTimeout(timelineTimeout1);
            clearTimeout(timelineTimeout2);
        }

        function startScreenbug() {
            stopScreenbug(); 

            container.classList.add('looping-active');
            runBroadcastTimeline();
            masterInterval = setInterval(runBroadcastTimeline, 24000);
        }

        function stopScreenbug() {
            container.classList.remove('looping-active');
            if (shineInterval) clearInterval(shineInterval);
            if (masterInterval) clearInterval(masterInterval);
            clearAllTimeouts();
            wrapper.style.setProperty('--shine-pos', '150%');
        }

        window.addEventListener('DOMContentLoaded', () => {
            startScreenbug();
        });

        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                startScreenbug();
            } else {
                stopScreenbug();
            }
        });
    </script>
</body>
</html>
