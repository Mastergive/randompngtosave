<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon & Space Power Same Position Loop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top-Right corner positioning */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 220px; 
            height: 150px; 
        }

        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: block;
            overflow: hidden;
        }

        .bug-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            display: block;
            pointer-events: none;
            will-change: transform, opacity;
        }

        /* --- Master 24-Second Timeline Activation --- */
        .looping-active #spacetoon-logo {
            animation: spacetoonMasterLoop 24s ease-in-out infinite;
        }

        .looping-active #spacepower-logo {
            animation: spacePowerSubLoop 24s ease-in-out infinite;
        }

        /* --- Dynamic Clipped Shine Layer --- */
        .bug-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0; 
            width: 100%;
            height: 100%;
            pointer-events: none;
            
            /* --- FIXED: The gradient color mix is now a dynamic CSS variable --- */
            background: var(--shine-gradient, linear-gradient(
                115deg,
                transparent 30%,
                rgba(255, 255, 255, 0.75) 50%,
                transparent 70
            ));
            background-size: 200% 100%;
            background-position: var(--shine-pos, 150%) 0;

            -webkit-mask-image: var(--current-mask, url('Stoon3D.png'));
            mask-image: var(--current-mask, url('Stoon3D.png'));
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
        }

        /* --- Spacetoon Timeline (Visible: 0s - 5s) --- */
        @keyframes spacetoonMasterLoop {
            0% {
                opacity: 0;
                transform: scale(0) rotate(25deg) translateX(50px) translateZ(0);
            }
            2.5% { 
                transform: scale(1.08) rotate(-5deg) translateX(-5px) translateZ(0);
            }
            4.1% { 
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateX(0) translateZ(0);
            }
            16.6% { 
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateX(0) translateZ(0);
            }
            20.8%, 100% {
                opacity: 0;
                transform: scale(0.8) rotate(-10deg) translateZ(0);
            }
        }

        /* --- Space Power Timeline (Visible: 5s - 20s) --- */
        @keyframes spacePowerSubLoop {
            0%, 16.6% { 
                opacity: 0;
                transform: scale(0.8) rotate(10deg) translateZ(0);
            }
            20.8% { 
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateZ(0);
            }
            83.3% { 
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateZ(0);
            }
            87.5%, 100% { 
                opacity: 0;
                transform: scale(0) rotate(15deg) translateX(40px) translateZ(0);
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper" id="wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" id="spacetoon-logo" class="bug-image">
            <img src="SpacePower.png" alt="Space Power Logo" id="spacepower-logo" class="bug-image">
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const wrapper = document.getElementById('wrapper');
        
        let shineInterval;
        let timelineTimeout1, timelineTimeout2;
        let masterInterval;
        
        const targetFPS = 25; 
        const frameDuration = 1000 / targetFPS; 

        // --- Profiles for the different look of the shine streams ---
        const shineProfiles = {
            'Stoon3D.png': {
                mask: "url('Stoon3D.png')",
                // Classic vibrant bright white gleam
                gradient: "linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.75) 50%, transparent 70%)"
            },
            'SpacePower.png': {
                mask: "url('SpacePower.png')",
                // Toned down translucent icy soft blue tint so it blends beautifully with white/blue graphics
                gradient: "linear-gradient(115deg, transparent 30%, rgba(180, 220, 255, 0.4) 50%, transparent 70%)"
            }
        };

        function triggerSingleShine(logoKey) {
            const profile = shineProfiles[logoKey];
            
            // Set mask outline shape and specific light mixture
            wrapper.style.setProperty('--current-mask', profile.mask);
            wrapper.style.setProperty('--shine-gradient', profile.gradient);

            let currentPos = 150;
            const endPos = -50;
            const shineDuration = 1200; 
            const totalFrames = shineDuration / frameDuration; 
            const stepIncrement = (endPos - currentPos) / totalFrames;

            if (shineInterval) clearInterval(shineInterval);

            shineInterval = setInterval(() => {
                currentPos += stepIncrement;
                if (currentPos <= endPos) {
                    clearInterval(shineInterval);
                } else {
                    wrapper.style.setProperty('--shine-pos', `${currentPos}%`);
                }
            }, frameDuration);
        }

        function runBroadcastTimeline() {
            clearAllTimeouts();

            // 1. Vibrant sharp white shine across Spacetoon at 1s
            timelineTimeout1 = setTimeout(() => {
                triggerSingleShine('Stoon3D.png');
            }, 1000);

            // 2. Soft, low-opacity ice-blue blend shine across Space Power at 6s
            timelineTimeout2 = setTimeout(() => {
                triggerSingleShine('SpacePower.png');
            }, 6000);
        }

        function clearAllTimeouts() {
            clearTimeout(timelineTimeout1);
            clearTimeout(timelineTimeout2);
        }

        function startScreenbug() {
            stopScreenbug(); 

            container.classList.add('looping-active');
            runBroadcastTimeline();
            masterInterval = setInterval(runBroadcastTimeline, 24000);
        }

        function stopScreenbug() {
            container.classList.remove('looping-active');
            if (shineInterval) clearInterval(shineInterval);
            if (masterInterval) clearInterval(masterInterval);
            clearAllTimeouts();
            wrapper.style.setProperty('--shine-pos', '150%');
        }

        window.addEventListener('DOMContentLoaded', () => {
            startScreenbug();
        });

        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                startScreenbug();
            } else {
                stopScreenbug();
            }
        });
    </script>
</body>
</html>
