<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon 2018 Space Power Block Screenbug</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top-Right corner positioning matching standard 2018 broadcast */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 180px; /* Aligned with standard bug width */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* --- Main Spacetoon Logo Container --- */
        .bug-wrapper {
            position: relative;
            width: 100%;
            height: auto;
            overflow: hidden;
        }

        .bug-image {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
        }

        /* Active class handles the infinite loop of the main Spacetoon icon */
        .looping-active .bug-image {
            animation: spacetoonMasterLoop 10s ease-in-out infinite;
        }

        /* --- Space Power Sub-text Banner --- */
        .sub-banner {
            width: 75%; /* Smaller, resting neatly under the main emblem */
            height: auto;
            margin-top: 8px;
            display: block;
            opacity: 0;
            will-change: transform, opacity;
        }

        /* Space power subtitle timing: pops in right after Spacetoon settles */
        .looping-active .sub-banner {
            animation: spacePowerSubLoop 10s ease-in-out infinite;
        }

        /* --- Fixed Alpha Channel Shine strictly inside Spacetoon Logo --- */
        .bug-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0; 
            width: 100%;
            height: 100%;
            pointer-events: none;
            
            background: linear-gradient(
                115deg,
                transparent 30%,
                rgba(255, 255, 255, 0.75) 50%,
                transparent 70%
            );
            background-size: 200% 100%;
            background-position: var(--shine-pos, 150%) 0;

            -webkit-mask-image: url('Stoon3D.png');
            mask-image: url('Stoon3D.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
        }

        /* --- Main Spacetoon Entrance & Exit Sequence --- */
        @keyframes spacetoonMasterLoop {
            0% {
                opacity: 0;
                transform: scale(0) rotate(25deg) translateX(50px) translateZ(0);
            }
            6% {
                transform: scale(1.08) rotate(-5deg) translateX(-5px) translateZ(0);
            }
            10% {
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateX(0) translateZ(0);
            }
            85% {
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateX(0) translateZ(0);
            }
            89% {
                opacity: 0.7;
                transform: scale(0.9, 1.05) rotate(-3deg) translateX(-15px) translateZ(0);
            }
            95%, 100% {
                opacity: 0;
                transform: scale(0) rotate(15deg) translateX(40px) translateZ(0);
            }
        }

        /* --- Space Power Sub-Text Sequence --- */
        @keyframes spacePowerSubLoop {
            0%, 12% {
                opacity: 0;
                transform: translateY(-10px) scale(0.8);
            }
            18% { /* Smoothly slides down and fades in right after Spacetoon settles */
                opacity: 0.9;
                transform: translateY(0) scale(1);
            }
            82% {
                opacity: 0.9;
                transform: translateY(0) scale(1);
            }
            86%, 100% { /* Leaves slightly before the main logo retreats */
                opacity: 0;
                transform: translateY(-5px) scale(0.8);
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper" id="wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
        </div>
        
        <img src="SpacePower.png" alt="Space Power" class="sub-banner">
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const wrapper = document.getElementById('wrapper');
        
        let shineInterval;
        let masterLoopInterval;
        const targetFPS = 25; 
        const frameDuration = 1000 / targetFPS; 

        function triggerSingleShine() {
            let currentPos = 150;
            const endPos = -50;
            const shineDuration = 1200; 
            const totalFrames = shineDuration / frameDuration; 
            const stepIncrement = (endPos - currentPos) / totalFrames;

            if (shineInterval) clearInterval(shineInterval);

            shineInterval = setInterval(() => {
                currentPos += stepIncrement;
                if (currentPos <= endPos) {
                    clearInterval(shineInterval);
                } else {
                    wrapper.style.setProperty('--shine-pos', `${currentPos}%`);
                }
            }, frameDuration);
        }

        function startScreenbug() {
            stopScreenbug(); 

            container.classList.add('looping-active');

            // Matches when Spacetoon locks into place
            setTimeout(triggerSingleShine, 1000);

            masterLoopInterval = setInterval(() => {
                setTimeout(triggerSingleShine, 1000); 
            }, 10000);
        }

        function stopScreenbug() {
            container.classList.remove('looping-active');
            if (shineInterval) clearInterval(shineInterval);
            if (masterLoopInterval) clearInterval(masterLoopInterval);
            wrapper.style.setProperty('--shine-pos', '150%');
        }

        window.addEventListener('DOMContentLoaded', () => {
            startScreenbug();
        });

        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                startScreenbug();
            } else {
                stopScreenbug();
            }
        });
    </script>
</body>
</html>
