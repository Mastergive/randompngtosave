<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محطة سبيستون القديمة</title>
<link rel="icon" href="https://upload.wikimedia.org/wikipedia/ar/archive/1/10/20220105065429%21شعار_سبيستون.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12151f;--panel:#1b2030;--line:#2b3247;--yellow:#ffc20e;--text:#f1f3f8;--mute:#9aa3b8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;line-height:1.5}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:2px}

header{background:var(--panel);border-bottom:3px solid var(--yellow);padding:14px 20px;text-align:center}
.logo{width:120px;display:block;margin:0 auto}
nav{display:flex;justify-content:center;gap:22px;margin-top:8px;font-weight:600}
nav a{text-decoration:none;color:var(--mute);padding:2px 0;border-bottom:2px solid transparent}
nav a:hover{color:var(--text);border-bottom-color:var(--yellow)}
.planets{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;margin-top:12px}
.planets div{width:70px;text-align:center;font-size:.8rem;color:var(--mute)}
.planets img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto 2px}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"player chat" "game chat";gap:16px;max-width:1240px;margin:0 auto;padding:18px;align-items:start}
.player{grid-area:player}.chat{grid-area:chat}.game{grid-area:game}
h2{margin:0 0 10px;font-size:1.15rem;font-weight:700}

.screen{position:relative;max-width:720px;margin:0 auto;aspect-ratio:4/3;background:#000;border:2px solid var(--line);border-radius:6px;overflow:hidden}
.screen video,.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.screen video{object-fit:contain}
[hidden]{display:none!important}
.badge{position:absolute;top:10px;inset-inline-start:10px;z-index:3;padding:1px 12px;border-radius:4px;font-size:.9rem;font-weight:700;background:rgba(0,0,0,.75);color:var(--mute)}
.badge[data-s=live]{background:#c4161c;color:#fff}
.unmute{position:absolute;top:10px;inset-inline-end:10px;z-index:3;border:0;border-radius:4px;padding:3px 14px;font-weight:700;background:var(--yellow);color:#000;cursor:pointer}
.off{position:absolute;inset:0;z-index:2;display:grid;place-content:center;text-align:center;padding:20px;background:var(--panel);color:var(--mute)}
.off strong{color:var(--text);font-size:1.3rem}
.servers{display:flex;gap:8px;justify-content:center;margin-top:10px}
.servers button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:5px 18px;border-radius:4px;font-weight:600;cursor:pointer}
.servers button[aria-pressed=true]{background:var(--yellow);border-color:var(--yellow);color:#000}

.chat{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;height:min(640px,80vh);overflow:hidden;position:sticky;top:12px}
.chat h2{padding:12px 14px 0}
.chat iframe{flex:1;border:0;width:100%;background:#fff}
.chat p{margin:auto;padding:20px;text-align:center;color:var(--mute)}

.game{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;text-align:center}
.box{position:relative;width:100%;max-width:400px;aspect-ratio:4/3;margin:0 auto;border:2px solid var(--line)}
#snakeGame{width:100%;height:100%;display:block;background:#0b0e16}
.ov{position:absolute;inset:0;z-index:5;background:rgba(18,21,31,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.btn{background:var(--yellow);color:#000;border:0;padding:8px 22px;font-size:1rem;font-weight:700;border-radius:4px;cursor:pointer}
.pad{display:none;grid-template-columns:repeat(3,1fr);gap:6px;width:150px;margin:12px auto 0}
.pad button{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:10px;border-radius:4px;cursor:pointer}

footer{text-align:center;padding:18px;color:var(--mute);font-size:.85rem}

@media(max-width:900px){
 .wrap{grid-template-columns:1fr;grid-template-areas:"player" "chat" "game";padding:12px}
 .chat{position:static;height:480px}
 .pad{display:grid}
}
</style>
</head>
<body>

<header>
 <img class="logo" src="https://upload.wikimedia.org/wikipedia/ar/archive/1/10/20220105065429%21شعار_سبيستون.png" alt="سبيستون">
 <nav>
  <a href="#live">البث المباشر</a>
  <a href="#games">لعبة</a>
  <a href="https://spacetoonold.netlify.app/message" target="_blank" rel="noopener">أرسل رسالة</a>
 </nav>
 <div class="planets">
  <div><img src="https://github.com/Mastergive/randompngtosave/blob/main/Action_planet-Photoroom.png?raw=true" alt="">أكشن</div>
  <div><img src="https://github.com/Mastergive/randompngtosave/blob/main/Adventure-Photoroom.png?raw=true" alt="">علوم</div>
  <div><img src="https://github.com/Mastergive/randompngtosave/blob/main/Sports-Photoroom.png?raw=true" alt="">رياضة</div>
  <div><img src="https://github.com/Mastergive/randompngtosave/blob/main/Planet_Bon_Bon_New.png?raw=true" alt="">بون بون</div>
  <div><img src="https://github.com/Mastergive/randompngtosave/blob/main/%D9%83%D9%88%D9%83%D8%A8_%D9%83%D9%88%D9%82%D9%8A%D8%AF%D9%8A%D8%A7-Photoroom.png?raw=true" alt="">كوميديا</div>
  <div><img src="https://github.com/Mastergive/randompngtosave/blob/main/%D9%83%D9%88%D9%83%D8%A8_%D8%B2%D9%85%D8%B1%D8%AF%D8%A9-Photoroom.png?raw=true" alt="">زمردة</div>
 </div>
</header>

<div class="wrap">
 <section class="player" id="live">
  <h2>البث المباشر</h2>
  <div class="screen">
   <video id="v" controls autoplay muted playsinline></video>
   <iframe id="od" title="Odysee" allowfullscreen hidden></iframe>
   <div class="badge" id="badge" data-s="connecting">جاري الاتصال</div>
   <button class="unmute" id="unmute" type="button">تشغيل الصوت</button>
   <div class="off" id="off" hidden><strong>البث متوقف حالياً</strong><span>تتم إعادة المحاولة تلقائياً. يمكنك تجربة السيرفر 2.</span></div>
  </div>
  <div class="servers">
   <button type="button" aria-pressed="true" data-n="0">السيرفر 1</button>
   <button type="button" aria-pressed="false" data-n="1">السيرفر 2 (Odysee)</button>
  </div>
 </section>

 <aside class="chat" id="chat"><h2>الدردشة</h2></aside>

 <section class="game" id="games">
  <h2>لعبة الثعبان</h2>
  <div class="box">
   <div id="gameOverlay" class="ov"><button class="btn" onclick="startGame()">ابدأ اللعبة</button></div>
   <canvas id="snakeGame" width="400" height="300"></canvas>
  </div>
  <p style="margin:10px 0 0">النقاط: <b id="score" style="color:var(--yellow)">0</b></p>
  <div class="pad" dir="ltr">
   <span></span><button onclick="triggerKey(38)" aria-label="أعلى">&#9650;</button><span></span>
   <button onclick="triggerKey(37)" aria-label="يسار">&#9664;</button><span></span><button onclick="triggerKey(39)" aria-label="يمين">&#9654;</button>
   <span></span><button onclick="triggerKey(40)" aria-label="أسفل">&#9660;</button><span></span>
  </div>
 </section>
</div>

<footer>محطة سبيستون القديمة</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
/* ===== الإعدادات ===== */
const CONFIG = {
  // رابط MediaMTX المحلي: http://<IP>:8888/<path>/index.m3u8
  STREAM_URL: "http://192.168.100.45:8888/stoonold/index.m3u8",
  // رابط Odysee (السيرفر 2)
  ODYSEE_URL: "https://odysee.com/$/embed/@SpacetoonOld:d/SToon-Old:d?r=8K9b5FpWexD8q7xXpB8v9xW2xM3xL4xN",
  // رابط الدردشة (iframe src) من Cbox أو WidgetBot أو غيرهما. اتركه فارغاً لإخفائها.
  CHAT_URL: ""
};
/* ===================== */

const $ = s => document.querySelector(s);
const video = $("#v"), od = $("#od");
let hls = null, timer = null;

/* الدردشة */
const chat = $("#chat");
if (CONFIG.CHAT_URL) {
  const f = document.createElement("iframe");
  f.src = CONFIG.CHAT_URL; f.title = "الدردشة";
  chat.appendChild(f);
} else {
  chat.insertAdjacentHTML("beforeend", "<p>الدردشة غير مفعّلة حالياً.</p>");
}

/* البث */
function srcUrl() {
  return new URLSearchParams(location.search).get("src") || CONFIG.STREAM_URL;
}
function setState(s) {
  const b = $("#badge");
  b.dataset.s = s;
  b.textContent = { connecting: "جاري الاتصال", live: "مباشر", off: "متوقف" }[s];
  $("#off").hidden = s !== "off";
}
function stopHls() { if (hls) { hls.destroy(); hls = null; } clearTimeout(timer); }
function retry() { stopHls(); setState("off"); timer = setTimeout(startHls, 5000); }
function startHls() {
  stopHls(); setState("connecting");
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode: true, liveSyncDurationCount: 3, backBufferLength: 30 });
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (e, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
      retry();
    });
    hls.loadSource(srcUrl());
    hls.attachMedia(video);
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = srcUrl(); video.onerror = retry; video.play().catch(() => {});
  } else { setState("off"); }
}
video.addEventListener("playing", () => setState("live"));
video.addEventListener("volumechange", () => { $("#unmute").hidden = !video.muted; });
$("#unmute").onclick = () => { video.muted = false; video.volume = 1; video.play().catch(() => {}); };

/* تبديل السيرفر */
document.querySelectorAll(".servers button").forEach(b => b.onclick = () => {
  const n = +b.dataset.n;
  document.querySelectorAll(".servers button").forEach(x => x.setAttribute("aria-pressed", x === b));
  const own = n === 0;
  video.hidden = !own; od.hidden = own;
  $("#badge").hidden = !own; $("#unmute").hidden = !own || !video.muted;
  if (own) { startHls(); }
  else {
    stopHls(); video.pause(); $("#off").hidden = true;
    if (!od.getAttribute("src")) od.src = CONFIG.ODYSEE_URL;
  }
});
startHls();

/* اللعبة */
const canvas = $("#snakeGame"), ctx = canvas.getContext("2d"), overlay = $("#gameOverlay");
let score, snake, dx, dy, nextDx, nextDy, gameRunning = false, food = { x: 0, y: 0 }, gameInterval;

function startGame() {
  overlay.style.display = "none"; gameRunning = true; score = 0;
  snake = [{ x: 200, y: 150 }, { x: 190, y: 150 }, { x: 180, y: 150 }];
  dx = 10; dy = 0; nextDx = 10; nextDy = 0;
  $("#score").textContent = score;
  createFood();
  clearInterval(gameInterval);
  gameInterval = setInterval(gameStep, 100);
}
function gameStep() {
  if (!gameRunning) return;
  dx = nextDx; dy = nextDy;
  if (didGameEnd()) {
    gameRunning = false; clearInterval(gameInterval);
    overlay.style.display = "flex";
    overlay.innerHTML = '<b>انتهت اللعبة</b><button class="btn" onclick="startGame()">حاول مجدداً</button>';
    return;
  }
  ctx.fillStyle = "#0b0e16"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#e5484d"; ctx.fillRect(food.x, food.y, 10, 10);
  const head = { x: snake[0].x + dx, y: snake[0].y + dy };
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) { score += 10; $("#score").textContent = score; createFood(); }
  else snake.pop();
  snake.forEach((p, i) => { ctx.fillStyle = i ? "#3ba776" : "#ffc20e"; ctx.fillRect(p.x, p.y, 10, 10); });
}
function didGameEnd() {
  const h = snake[0];
  if (h.x < 0 || h.x >= canvas.width || h.y < 0 || h.y >= canvas.height) return true;
  return snake.slice(1).some(p => p.x === h.x && p.y === h.y);
}
function createFood() {
  do {
    food.x = Math.floor(Math.random() * (canvas.width / 10)) * 10;
    food.y = Math.floor(Math.random() * (canvas.height / 10)) * 10;
  } while (snake.some(p => p.x === food.x && p.y === food.y));
}
function handleDirection(k) {
  if (k === 37 && dx !== 10) { nextDx = -10; nextDy = 0; }
  if (k === 38 && dy !== 10) { nextDx = 0; nextDy = -10; }
  if (k === 39 && dx !== -10) { nextDx = 10; nextDy = 0; }
  if (k === 40 && dy !== -10) { nextDx = 0; nextDy = 10; }
}
document.addEventListener("keydown", e => {
  if (gameRunning && [37, 38, 39, 40].includes(e.keyCode)) { e.preventDefault(); handleDirection(e.keyCode); }
});
function triggerKey(c) { if (gameRunning) handleDirection(c); }
</script>
</body>
</html>
