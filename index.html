<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع سبيستون - جيل الطيبين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/ar/archive/1/10/20220105065429%21شعار_سبيستون.png" type="image/x-icon">
    <style>
        :root {
            --st-blue-dark: #1e3a8a;
            --st-blue-light: #3b82f6;
            --st-yellow: #facc15;
            --st-purple: #6d28d9;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #004aad;
            background-image: radial-gradient(circle, #0056cc 10%, #003380 90%);
            color: white;
            overflow-x: hidden;
        }

        /* Header & Planets Bar */
        .top-header {
            background: linear-gradient(to bottom, #7a288a, #4a148c);
            padding: 15px;
            border-bottom: 5px solid var(--st-yellow);
            text-align: center;
        }

        .planets-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            flex-wrap: wrap;
            border-radius: 20px;
            margin: 10px auto;
            max-width: 95%;
        }

        .planet-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s;
            width: 85px;
        }

        .planet-item:hover { transform: scale(1.1); }

        .planet-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        .planet-name {
            font-size: 0.8rem;
            font-weight: 900;
            margin-top: 5px;
            text-shadow: 2px 2px 4px #000;
        }

        /* Main Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 220px 1fr 250px;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .sidebar {
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 15px;
            height: fit-content;
        }

        .ad-box {
            width: 100%;
            height: 350px;
            background: #111;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 2px solid var(--st-yellow);
            overflow: hidden;
        }

        .ad-box img { width: 100%; height: 100%; object-fit: cover; }

        .content-area {
            background: rgba(37, 99, 235, 0.8);
            border: 6px solid #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 20px;
        }

        /* تحديث الحاوية لتثبيت أبعاد الأنمي الكلاسيكي 4:3 */
        .video-wrapper {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border: 3px solid var(--st-yellow);
        }

        .video-js.vjs-4-3-retro {
            aspect-ratio: 4 / 3 !important;
            width: 100% !important;
            height: auto !important;
        }

        /* Social Icons */
        .social-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .social-icon {
            width: 45px; height: 45px;
            background: white; color: #333;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 1.2rem;
            transition: 0.3s;
        }

        .social-icon.yt { color: #ff0000; }
        .social-icon:hover { transform: translateY(-5px); background: var(--st-yellow); }

        /* Games Styling */
        .game-window {
            margin-top: 35px;
            background: #111;
            border: 4px solid var(--st-yellow);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .game-container-box {
            position: relative;
            display: inline-block;
            width: 400px;
            height: 300px;
        }

        .game-overlay {
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            position: absolute; top:0; left:0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 10px;
        }

        canvas { background: #000; display: block; border-radius: 10px; }

        .btn-play {
            background: var(--st-yellow); color: black;
            border: none; padding: 12px 30px;
            font-size: 1.2rem; font-weight: bold;
            border-radius: 50px; cursor: pointer;
            transition: 0.2s;
        }
        .btn-play:hover { transform: scale(1.05); }

        footer {
            text-align: center; padding: 25px;
            background: #111; margin-top: 50px;
            border-top: 4px solid var(--st-yellow);
        }

        @media (max-width: 1000px) {
            .main-grid { grid-template-columns: 1fr; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

<div class="top-header">
    <img src="https://upload.wikimedia.org/wikipedia/ar/archive/1/10/20220105065429%21شعار_سبيستون.png" alt="Logo" width="150">
    
    <div class="planets-bar">
        <div class="planet-item">
            <img src="https://github.com/Mastergive/randompngtosave/blob/main/Action_planet-Photoroom.png?raw=true" onerror="this.src='https://via.placeholder.com/70?text=Action'" class="planet-img">
            <span class="planet-name">أكشن</span>
        </div>
        <div class="planet-item">
            <img src="https://github.com/Mastergive/randompngtosave/blob/main/Adventure-Photoroom.png?raw=true" onerror="this.src='https://via.placeholder.com/70?text=Adventure'" class="planet-img">
            <span class="planet-name">مغامرات</span>
        </div>
        <div class="planet-item">
            <img src="https://github.com/Mastergive/randompngtosave/blob/main/Sports-Photoroom.png?raw=true" onerror="this.src='https://via.placeholder.com/70?text=Sports'" class="planet-img">
            <span class="planet-name">رياضة</span>
        </div>
        <div class="planet-item">
            <img src="https://github.com/Mastergive/randompngtosave/blob/main/Planet_Bon_Bon_New.png?raw=true" onerror="this.src='https://via.placeholder.com/70?text=Bonbon'" class="planet-img">
            <span class="planet-name">بون بون</span>
        </div>
        <div class="planet-item">
            <img src="https://github.com/Mastergive/randompngtosave/blob/main/%D9%83%D9%88%D9%83%D8%A8_%D9%83%D9%88%D9%85%D9%8A%D8%AF%D9%8A%D8%A7-Photoroom.png?raw=true" onerror="this.src='https://via.placeholder.com/70?text=Comedy'" class="planet-img">
            <span class="planet-name">كوميديا</span>
        </div>
        <div class="planet-item">
            <img src="https://github.com/Mastergive/randompngtosave/blob/main/%D9%83%D9%88%D9%83%D8%A8_%D8%B2%D9%85%D8%B1%D8%AF%D8%A9-Photoroom.png?raw=true" onerror="this.src='https://via.placeholder.com/70?text=Zomoroda'" class="planet-img">
            <span class="planet-name">زمردة</span>
        </div>
    </div>
</div>

<div class="main-grid">
    <aside class="sidebar">
        <h3 style="color:var(--st-yellow)"><i class="fas fa-download"></i> مركز التحميل</h3>
        <div class="ad-box">
            <img src="https://m.media-amazon.com/images/I/81L7-oO7uHL._AC_SL1500_.jpg" alt="Spider-Man Ad">
        </div>
        <ul style="list-style: none; padding: 0; font-weight: bold;">
            <li style="margin: 10px 0;"><a href="#" style="color: var(--st-yellow); text-decoration: none;">🏠 الرئيسية</a></li>
            <li style="margin: 10px 0;"><a href="#" style="color: white; text-decoration: none;">🎮 مركز الألعاب</a></li>
        </ul>
    </aside>

    <main class="content-area">
        <h2 style="text-align: center; color: var(--st-yellow); text-shadow: 2px 2px black;">
            <i class="fas fa-broadcast-tower"></i> البث المباشر - شباب المستقبل (4:3)
        </h2>
        
        <div class="video-wrapper">
            <video id="spacetoon-live-player" class="video-js vjs-default-skin vjs-4-3-retro" controls autoplay preload="auto" muted>
                <source src="https://gjbtzxxvod.localto.net/live/spacetoon/index.m3u8" type="application/x-mpegURL">
                <p class="vjs-no-js">لمشاهدة البث المباشر، يرجى تفعيل جافا سكريبت أو استخدام متصفح يدعم فيديو HTML5.</p>
            </video>
        </div>

        <div class="social-bar">
            <a href="https://www.youtube.com/user/spacetoononline" target="_blank" class="social-icon yt"><i class="fab fa-youtube"></i></a>
            <a href="https://facebook.com/spacetoon" target="_blank" class="social-icon yt"><i class="fab fa-facebook-f"></i></a>
        </div>

        <div class="game-window">
            <h3 style="color: var(--st-yellow)">🎮 لعبة كوكب مغامرات 🐍</h3>
            <div class="game-container-box">
                <div id="gameOverlay" class="game-overlay">
                    <button class="btn-play" onclick="startGame()">إضغط للعب الآن</button>
                </div>
                <canvas id="snakeGame" width="400" height="300"></canvas>
            </div>
            <p>النقاط: <span id="score" style="color:var(--st-yellow); font-size:1.5rem">0</span></p>
        </div>
    </main>

    <aside class="sidebar">
        <h3 style="color:var(--st-yellow)"><i class="fas fa-newspaper"></i> آخر الأخبار</h3>
        <p>✨ عودة المحقق كونان بجزء جديد!</p>
        <iframe width="100%" height="160" src="https://www.youtube.com/embed/cP6DhogDqEg" frameborder="0" allowfullscreen style="border-radius: 8px;"></iframe>
    </aside>
</div>

<footer>
    <p>© جميع الحقوق محفوظة لقناة سبيستون - هورايزون تي في</p>
</footer>

<script src="https://vjs.zencdn.net/7.20.3/video.js"></script>

<script>
    // إصلاح شامل وترقية للعبة الثعبان
    const canvas = document.getElementById("snakeGame");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("gameOverlay");
    
    let score, snake, dx, dy, nextDx, nextDy, gameRunning = false;
    let food = {x: 0, y: 0};
    let gameInterval;

    function startGame() {
        overlay.style.display = "none";
        gameRunning = true;
        score = 0;
        // يبدأ الثعبان من المنتصف بحجم 3 مربعات لتجنب الخسارة الفورية
        snake = [
            {x: 200, y: 150},
            {x: 190, y: 150},
            {x: 180, y: 150}
        ];
        dx = 10; dy = 0;
        nextDx = 10; nextDy = 0; // نظام حجز الحركة لتفادي ضغط الأزرار السريع الخاطئ
        document.getElementById('score').innerHTML = score;
        createFood();
        
        if(gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameStep, 100);
    }

    function gameStep() {
        if (!gameRunning) return;

        // تحديث الاتجاه الفعلي بناءً على المدخلات الأخيرة المحجوزة
        dx = nextDx;
        dy = nextDy;

        if (didGameEnd()) {
            gameRunning = false;
            clearInterval(gameInterval);
            overlay.style.display = "flex";
            overlay.innerHTML = `<h2 style="color:#ef4444; margin-bottom:15px;">خسرت!</h2><button class="btn-play" onclick="startGame()">حاول مرة أخرى</button>`;
            return;
        }

        clearCanvas();
        drawFood();
        advanceSnake();
        drawSnake();
    }

    function clearCanvas() { 
        ctx.fillStyle = "black"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height); 
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            // لون مميز للرأس ولون آخر للجسد
            ctx.fillStyle = index === 0 ? "#facc15" : "#eab308";
            ctx.fillRect(part.x, part.y, 10, 10);
            ctx.strokeStyle = "#111";
            ctx.strokeRect(part.x, part.y, 10, 10);
        });
    }

    function advanceSnake() {
        const head = {x: snake[0].x + dx, y: snake[0].y + dy};
        snake.unshift(head);
        
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById('score').innerHTML = score;
            createFood();
        } else { 
            snake.pop(); 
        }
    }

    function didGameEnd() {
        const head = snake[0];
        // فحص الاصطدام بالجدران بدقة متناهية (الحدود من 0 إلى العرض/الارتفاع ناقص حجم المربع)
        if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
            return true;
        }
        // فحص الاصطدام بالجسد نفسه
        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) return true;
        }
        return false;
    }

    function createFood() {
        // توليد الطعام بشكل عشوائي تماماً داخل مساحة اللعب وتفادي ظهوره فوق جسد الثعبان
        let foodOnSnake = true;
        while(foodOnSnake) {
            food.x = Math.floor(Math.random() * (canvas.width / 10)) * 10;
            food.y = Math.floor(Math.random() * (canvas.height / 10)) * 10;
            foodOnSnake = snake.some(part => part.x === food.x && part.y === food.y);
        }
    }

    function drawFood() { 
        ctx.fillStyle = "#ef4444"; 
        ctx.fillRect(food.x, food.y, 10, 10); 
    }

    // إصلاح التحكم بالكيبورد ومنع انتحار الثعبان بالرجوع العكسي
    document.addEventListener("keydown", (e) => {
        if (!gameRunning) return;
        
        const keyPressed = e.keyCode;
        const GOING_LEFT = dx === -10;
        const GOING_RIGHT = dx === 10;
        const GOING_UP = dy === -10;
        const GOING_DOWN = dy === 10;

        // منع التمرير الافتراضي للمتصفح عند الضغط على الأسهم لعدم تحرك الصفحة
        if([37, 38, 39, 40].includes(keyPressed)) {
            e.preventDefault();
        }

        if (keyPressed === 37 && !GOING_RIGHT) { nextDx = -10; nextDy = 0; }
        if (keyPressed === 38 && !GOING_DOWN) { nextDx = 0; nextDy = -10; }
        if (keyPressed === 39 && !GOING_LEFT)  { nextDx = 10; nextDy = 0; }
        if (keyPressed === 40 && !GOING_UP)   { nextDx = 0; nextDy = 10; }
    });
</script>
</body>
</html>
