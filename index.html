<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع سبيستون - جيل الطيبين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- مكتبات المشغلات (CSS) -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/ar/archive/1/10/20220105065429%21شعار_سبيستون.png" type="image/x-icon">
    <style>
        :root {
            --st-blue-dark: #1e3a8a;
            --st-blue-light: #3b82f6;
            --st-yellow: #facc15;
            --st-purple: #6d28d9;
            --st-pink: #ec4899;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #004aad;
            background-image: radial-gradient(circle, #0056cc 10%, #003380 90%);
            color: white;
            overflow-x: hidden;
        }

        /* Header & Planets Bar */
        .top-header {
            background: linear-gradient(to bottom, #7a288a, #4a148c);
            padding: 15px;
            border-bottom: 5px solid var(--st-yellow);
            text-align: center;
        }

        .planets-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            flex-wrap: wrap;
            border-radius: 20px;
            margin: 10px auto;
            max-width: 95%;
        }

        .planet-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s, filter 0.3s;
            width: 85px;
        }

        .planet-item:hover { transform: scale(1.1); filter: brightness(1.2); }
        .planet-item:active { transform: scale(0.95); }

        .planet-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        .planet-name {
            font-size: 0.8rem;
            font-weight: 900;
            margin-top: 5px;
            text-shadow: 2px 2px 4px #000;
        }

        /* Layout المطور - متجاوب بالكامل للكمبيوتر والموبايل تلقائياً */
        .main-grid {
            display: grid;
            grid-template-columns: 240px 1fr 260px;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .sidebar {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 15px;
            height: fit-content;
        }

        .ad-box {
            width: 100%;
            height: 280px;
            background: #111;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 2px solid var(--st-yellow);
            overflow: hidden;
        }

        .ad-box img { width: 100%; height: 100%; object-fit: cover; }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            font-weight: bold;
        }

        .sidebar-menu li {
            margin: 12px 0;
        }

        .sidebar-menu a {
            display: block;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }

        .sidebar-menu a:hover {
            background: var(--st-yellow);
            color: black;
            transform: translateX(-5px);
        }

        .content-area {
            background: rgba(37, 99, 235, 0.85);
            border: 6px solid #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 20px;
        }

        /* اختيار المشغل والتحكم */
        .player-selector-zone {
            text-align: center;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 10px;
        }

        .player-select {
            font-family: 'Cairo', sans-serif;
            background: #111;
            color: var(--st-yellow);
            border: 2px solid var(--st-yellow);
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            outline: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* أبعاد 4:3 كلاسيكية ثابتة آمنة */
        .video-wrapper {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border: 4px solid var(--st-yellow);
            background: black;
            aspect-ratio: 4 / 3;
            position: relative;
        }

        /* محاذاة كل أنواع المشغلات داخل الحاوية */
        .native-4-3-player, .video-js, .plyr {
            width: 100% !important;
            height: 100% !important;
            aspect-ratio: 4 / 3 !important;
            object-fit: contain;
        }

        /* Social Icons */
        .social-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .social-icon {
            width: 45px; height: 45px;
            background: white; color: #333;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 1.2rem;
            transition: 0.3s;
        }

        .social-icon.yt { color: #ff0000; }
        .social-icon.fb { color: #1877f2; }
        .social-icon:hover { transform: translateY(-5px); background: var(--st-yellow); color: black; }

        /* الألعاب والتحكم اللمسي للموبايل */
        .game-window {
            margin-top: 35px;
            background: #111;
            border: 4px solid var(--st-yellow);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .game-container-box {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 4 / 3;
        }

        #snakeGame {
            width: 100%;
            height: 100%;
            background: #000;
            display: block;
            border-radius: 10px;
        }

        .game-overlay {
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            position: absolute; top:0; left:0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 10px;
        }

        .btn-play {
            background: var(--st-yellow); color: black;
            border: none; padding: 12px 30px;
            font-size: 1.2rem; font-weight: bold;
            border-radius: 50px; cursor: pointer;
            transition: 0.2s;
            font-family: 'Cairo', sans-serif;
        }
        .btn-play:hover { transform: scale(1.05); }

        /* أزرار لمسية تظهر فقط على الموبايل للتحكم في اللعبة */
        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 180px;
            margin: 15px auto 0 auto;
        }

        .touch-btn {
            background: #222;
            border: 2px solid var(--st-yellow);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            user-select: none;
        }
        .touch-btn:active { background: var(--st-yellow); color: black; }

        footer {
            text-align: center; padding: 25px;
            background: #111; margin-top: 50px;
            border-top: 4px solid var(--st-yellow);
        }

        /* Responsive Mobile Layout Rule (تخصيص كامل للهواتف الذكية والأجهزة اللوحية) */
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr; /* دمج الأعمدة في مسار عمودي واحد */
                padding: 10px;
                gap: 15px;
            }
            
            .sidebar {
                order: 3; /* إنزال الشريط الجانبي الأيسر للأسفل */
            }
            
            .sidebar-news {
                order: 2; /* وضع الأخبار تحت المشغل مباشرة */
            }

            .content-area {
                order: 1; /* المشغل والبث في القمة دائماً */
                padding: 12px;
                border-width: 4px;
            }

            .planets-bar {
                gap: 8px;
                padding: 10px;
            }

            .planet-item {
                width: 65px;
            }

            .planet-img {
                width: 50px;
                height: 50px;
            }

            .planet-name {
                font-size: 0.7rem;
            }

            .player-selector-zone label {
                display: block;
                margin-bottom: 8px;
                font-size: 0.9rem;
            }

            /* إظهار أزرار الموبايل للعبة الثعبان تلقائياً هنا */
            .mobile-controls {
                display: grid;
            }
        }
    </style>
</head>
<body>

<div class="top-header">
    <img src="https://upload.wikimedia.org/wikipedia/ar/archive/1/10/20220105065429%21شعار_سبيستون.png" alt="Logo" width="130" style="cursor: pointer;" onclick="location.reload();">
    
    <div class="planets-bar">
        <div class="planet-item" onclick="filterPlanet('action')">
            <img src="https://github.com/Mastergive/randompngtosave/blob/main/Action_planet-Photoroom.png?raw=true" onerror="this.src='https://via.placeholder.com/70?text=Action'" class="planet-img">
            <span class="planet-name">أكشن</span>
        </div>
        <div class="planet-item" onclick="filterPlanet('adventure')">
            <img src="https://github.com/Mastergive/randompngtosave/blob/main/Adventure-Photoroom.png?raw=true" onerror="this.src='https://via.placeholder.com/70?text=Adventure'" class="planet-img">
            <span class="planet-name">مغامرات</span>
        </div>
        <div class="planet-item" onclick="filterPlanet('sports')">
            <img src="https://github.com/Mastergive/randompngtosave/blob/main/Sports-Photoroom.png?raw=true" onerror="this.src='https://via.placeholder.com/70?text=Sports'" class="planet-img">
            <span class="planet-name">رياضة</span>
        </div>
        <div class="planet-item" onclick="filterPlanet('bonbon')">
            <img src="https://github.com/Mastergive/randompngtosave/blob/main/Planet_Bon_Bon_New.png?raw=true" onerror="this.src='https://via.placeholder.com/70?text=Bonbon'" class="planet-img">
            <span class="planet-name">بون بون</span>
        </div>
        <div class="planet-item" onclick="filterPlanet('comedy')">
            <img src="https://github.com/Mastergive/randompngtosave/blob/main/%D9%83%D9%88%D9%8%D8%A8_%D9%83%D9%8Field_%D9%83%D9%88%D9%85%D9%8A%D8%A4%D9%8A%D8%A7-Photoroom.png?raw=true" onerror="this.src='https://via.placeholder.com/70?text=Comedy'" class="planet-img">
            <span class="planet-name">كوميديا</span>
        </div>
        <div class="planet-item" onclick="filterPlanet('zomoroda')">
            <img src="https://github.com/Mastergive/randompngtosave/blob/main/%D9%83%D9%88%D9%8%D8%A8_%D8%B2%D9%85%D8%B1%D8%AF%D8%A9-Photoroom.png?raw=true" onerror="this.src='https://via.placeholder.com/70?text=Zomoroda'" class="planet-img">
            <span class="planet-name">زمردة</span>
        </div>
    </div>
</div>

<div class="main-grid">
    <!-- الشريط الجانبي الأيمن -->
    <aside class="sidebar">
        <h3 style="color:var(--st-yellow); margin-top:0;"><i class="fas fa-download"></i> مركز التحميل</h3>
        <div class="ad-box">
            <img src="https://m.media-amazon.com/images/I/81L7-oO7uHL._AC_SL1500_.jpg" alt="Spider-Man Ad">
        </div>
        <ul class="sidebar-menu">
            <li><a href="#" onclick="alert('أهلاً بك في الصفحة الرئيسية!'); return false;">🏠 الرئيسية</a></li>
            <li><a href="#games" onclick="document.querySelector('.game-window').scrollIntoView({behavior: 'smooth'}); return false;">🎮 مركز الألعاب</a></li>
        </ul>
    </aside>

    <!-- منطقة المحتوى البث والمشغل -->
    <main class="content-area">
        <h2 style="text-align: center; color: var(--st-yellow); text-shadow: 2px 2px black; font-size: 1.5rem; margin-top: 0;">
            <i class="fas fa-broadcast-tower"></i> البث المباشر - جيل الطيبين (4:3)
        </h2>

        <div class="player-selector-zone">
            <label for="playerSelect" style="font-weight: bold;">اختر مشغل البث البديل: </label>
            <select id="playerSelect" class="player-select" onchange="switchPlayer(this.value)">
                <option value="vjs">Video.js (المشغل الأساسي)</option>
                <option value="hlsjs">Hls.js + HTML5 (سريع ومباشر)</option>
                <option value="plyr">Plyr Player (واجهة حديثة)</option>
            </select>
        </div>
        
        <div class="video-wrapper" id="playerContainer">
            <!-- يتم حقن كود المشغلات هنا تلقائياً -->
        </div>

        <div class="social-bar">
            <a href="https://www.youtube.com/user/spacetoononline" target="_blank" class="social-icon yt"><i class="fab fa-youtube"></i></a>
            <a href="https://facebook.com/spacetoon" target="_blank" class="social-icon fb"><i class="fab fa-facebook-f"></i></a>
        </div>

        <!-- منطقة الألعاب -->
        <div class="game-window" id="games">
            <h3 style="color: var(--st-yellow); margin-top:0;">🎮 لعبة كوكب مغامرات 🐍</h3>
            <div class="game-container-box">
                <div id="gameOverlay" class="game-overlay">
                    <button class="btn-play" onclick="startGame()">إضغط للعب الآن</button>
                </div>
                <canvas id="snakeGame" width="400" height="300"></canvas>
            </div>
            <p style="margin: 10px 0 0 0;">النقاط: <span id="score" style="color:var(--st-yellow); font-size:1.5rem; font-weight: bold;">0</span></p>
            
            <!-- أزرار اللمس للموبايل (مخفية بالكمبيوتر وتظهر تلقائياً بالموبايل) -->
            <div class="mobile-controls">
                <div></div>
                <button class="touch-btn" onclick="triggerKey(38)"><i class="fas fa-chevron-up"></i></button>
                <div></div>
                <button class="touch-btn" onclick="triggerKey(37)"><i class="fas fa-chevron-right"></i></button>
                <button class="touch-btn" style="background:#444; border-color:#fff;"><i class="fas fa-circle"></i></button>
                <button class="touch-btn" onclick="triggerKey(39)"><i class="fas fa-chevron-left"></i></button>
                <div></div>
                <button class="touch-btn" onclick="triggerKey(40)"><i class="fas fa-chevron-down"></i></button>
                <div></div>
            </div>
        </div>
    </main>

    <!-- الشريط الجانبي الأيسر (الأخبار) -->
    <aside class="sidebar sidebar-news">
        <h3 style="color:var(--st-yellow); margin-top:0;"><i class="fas fa-newspaper"></i> آخر الأخبار</h3>
        <p style="font-size: 0.95rem; line-height: 1.6;">✨ سبيستون كافيه يفتتح أبوابه رسمياً لجيل الطيبين لاستعادة ذكريات الطفولة!</p>
        <iframe width="100%" height="160" src="https://www.youtube.com/embed/cP6DhogDqEg" frameborder="0" allowfullscreen style="border-radius: 8px; border: 2px solid rgba(255,255,255,0.2);"></iframe>
    </aside>
</div>

<footer>
    <p>© جميع الحقوق محفوظة لقناة سبيستون - هورايزون تي في</p>
</footer>

<!-- جلب مكاتب التشغيل الأساسية -->
<script src="https://vjs.zencdn.net/7.20.3/video.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
    // رابط البث النهائي الموحد الخاص بك
    const streamUrl = 'https://gjbtzxxvod.localto.net/live/spacetoonold/index.m3u8';
    
    // متغيرات تتبع الكائنات لمنع تدمير الذاكرة وتصادم المشغلات
    let mtxVjsPlayer = null;
    let mtxHlsInstance = null;
    let mtxPlyrInstance = null;

    function cleanExistingPlayers() {
        // تدمير مشغل Video.js بالكامل ونظافة الكود
        if (mtxVjsPlayer) {
            mtxVjsPlayer.dispose();
            mtxVjsPlayer = null;
        }
        // تدمير أي نسخة مفعلة من Hls.js
        if (mtxHlsInstance) {
            mtxHlsInstance.destroy();
            mtxHlsInstance = null;
        }
        // تدمير مشغل Plyr
        if (mtxPlyrInstance) {
            mtxPlyrInstance.destroy();
            mtxPlyrInstance = null;
        }
        
        const container = document.getElementById('playerContainer');
        container.innerHTML = ""; 
    }

    // متحكم التبديل الذكي والمضمون بدون كراش
    function switchPlayer(playerType) {
        cleanExistingPlayers();
        const container = document.getElementById('playerContainer');

        if (playerType === 'vjs') {
            container.innerHTML = `
                <video id="spacetoon-vjs" class="video-js vjs-default-skin" controls autoplay preload="auto" muted playsinline>
                    <source src="${streamUrl}" type="application/x-mpegURL">
                </video>
            `;
            mtxVjsPlayer = videojs('spacetoon-vjs', {
                autoplay: 'muted',
                controls: true,
                preload: 'auto'
            });

        } else if (playerType === 'hlsjs') {
            container.innerHTML = `<video id="spacetoon-hlsjs" class="native-4-3-player" controls autoplay muted playsinline></video>`;
            const video = document.getElementById('spacetoon-hlsjs');

            if (Hls.isSupported()) {
                mtxHlsInstance = new Hls({ maxBufferLength: 10, enableWorker: true });
                mtxHlsInstance.loadSource(streamUrl);
                mtxHlsInstance.attachMedia(video);
                mtxHlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(e=>console.log(e)); });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => { video.play(); });
            }

        } else if (playerType === 'plyr') {
            container.innerHTML = `<video id="spacetoon-plyr" controls autoplay muted playsinline></video>`;
            const video = document.getElementById('spacetoon-plyr');

            if (Hls.isSupported()) {
                mtxHlsInstance = new Hls();
                mtxHlsInstance.loadSource(streamUrl);
                mtxHlsInstance.attachMedia(video);
            } else {
                video.src = streamUrl;
            }

            mtxPlyrInstance = new Plyr(video, {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                ratio: '4:3'
            });
            
            video.play().catch(e => console.log("Autoplay blocked or waiting: ", e));
        }
    }

    // تفاعل أزرار الكواكب عند النقر عليها
    function filterPlanet(planetKey) {
        alert("لقد دخلت الآن إلى كوكب " + planetKey + "! سيتم تحديث جدول العروض قريباً.");
    }

    // بدء تشغيل الموقع تلقائياً بأمان عالي
    document.addEventListener("DOMContentLoaded", () => {
        switchPlayer('vjs');
    });

    // ==========================================
    // كود لعبة الثعبان المتجاوب للموبايل والكمبيوتر
    // ==========================================
    const canvas = document.getElementById("snakeGame");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("gameOverlay");
    
    let score, snake, dx, dy, nextDx, nextDy, gameRunning = false;
    let food = {x: 0, y: 0};
    let gameInterval;

    function startGame() {
        overlay.style.display = "none";
        gameRunning = true;
        score = 0;
        snake = [
            {x: 200, y: 150},
            {x: 190, y: 150},
            {x: 180, y: 150}
        ];
        dx = 10; dy = 0;
        nextDx = 10; nextDy = 0; 
        document.getElementById('score').innerHTML = score;
        createFood();
        
        if(gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameStep, 100);
    }

    function gameStep() {
        if (!gameRunning) return;

        dx = nextDx;
        dy = nextDy;

        if (didGameEnd()) {
            gameRunning = false;
            clearInterval(gameInterval);
            overlay.style.display = "flex";
            overlay.innerHTML = `<h2 style="color:#ef4444; margin: 0 0 15px 0;">خسرت!</h2><button class="btn-play" onclick="startGame()">حاول مرة أخرى</button>`;
            return;
        }

        clearCanvas();
        drawFood();
        advanceSnake();
        drawSnake();
    }

    function clearCanvas() { 
        ctx.fillStyle = "black"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height); 
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? "#facc15" : "#eab308";
            ctx.fillRect(part.x, part.y, 10, 10);
            ctx.strokeStyle = "#111";
            ctx.strokeRect(part.x, part.y, 10, 10);
        });
    }

    function advanceSnake() {
        const head = {x: snake[0].x + dx, y: snake[0].y + dy};
        snake.unshift(head);
        
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById('score').innerHTML = score;
            createFood();
        } else { 
            snake.pop(); 
        }
    }

    function didGameEnd() {
        const head = snake[0];
        if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
            return true;
        }
        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) return true;
        }
        return false;
    }

    function createFood() {
        let foodOnSnake = true;
        while(foodOnSnake) {
            food.x = Math.floor(Math.random() * (canvas.width / 10)) * 10;
            food.y = Math.floor(Math.random() * (canvas.height / 10)) * 10;
            foodOnSnake = snake.some(part => part.x === food.x && part.y === food.y);
        }
    }

    function drawFood() { 
        ctx.fillStyle = "#ef4444"; 
        ctx.fillRect(food.x, food.y, 10, 10); 
    }

    // معالجة التحكم عبر لوحة المفاتيح (للكمبيوتر)
    function handleDirection(keyCode) {
        const GOING_LEFT = dx === -10;
        const GOING_RIGHT = dx === 10;
        const GOING_UP = dy === -10;
        const GOING_DOWN = dy === 10;

        if (keyCode === 37 && !GOING_RIGHT) { nextDx = -10; nextDy = 0; }
        if (keyCode === 38 && !GOING_DOWN) { nextDx = 0; nextDy = -10; }
        if (keyCode === 39 && !GOING_LEFT)  { nextDx = 10; nextDy = 0; }
        if (keyCode === 40 && !GOING_UP)   { nextDx = 0; nextDy = 10; }
    }

    document.addEventListener("keydown", (e) => {
        if (!gameRunning) return;
        if([37, 38, 39, 40].includes(e.keyCode)) {
            e.preventDefault(); // منع الصفحة من الاهتزاز أو النزول لأسفل أثناء اللعب
            handleDirection(e.keyCode);
        }
    });

    // دالة محاكاة النقر بالأزرار اللمسية (للموبايل)
    function triggerKey(code) {
        if (!gameRunning) return;
        handleDirection(code);
    }
</script>
</body>
