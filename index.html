<!DOCTYPE html>
<html lang="ar" dir="rtl" data-th="dark" data-ui="glass">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#090a14;--tx:#f4f5ff;--mu:#a3a8cc;--ac:#ffc400;--acx:#1a1300;--lv:#ff3d63;--sf:#151833;--sb:#2a2f5e;--bf:none;--pl:64%;--ga:22%;--gb:38%;--pcx:#10122a;--sh:none;--blob:1}
[data-th=light]{color-scheme:light;--bg:#eceffb;--tx:#14162b;--mu:#565c86;--ac:#f0a800;--lv:#e8264f;--sf:#fff;--sb:#d3d8ef;--pl:42%;--ga:90%;--gb:74%;--pcx:#fff}
[data-ui=glass]{--sf:rgba(26,30,68,.42);--sb:rgba(255,255,255,.18);--bf:blur(22px) saturate(1.7);--sh:inset 0 1px 0 rgba(255,255,255,.28),0 10px 34px rgba(0,0,0,.28)}
[data-ui=glass][data-th=light]{--sf:rgba(255,255,255,.5);--sb:rgba(255,255,255,.85);--sh:inset 0 1px 0 #fff,0 10px 34px rgba(60,70,140,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Cairo,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;opacity:var(--blob);
 background:radial-gradient(40% 35% at 12% 18%,hsl(172 80% 50%/.3),transparent),radial-gradient(35% 35% at 88% 8%,hsl(325 85% 58%/.26),transparent),radial-gradient(45% 40% at 72% 92%,hsl(255 85% 62%/.3),transparent)}
[data-ui=classic]{--blob:0}
[data-th=light][data-ui=glass]{--blob:.7}
h1,h2,h3,.dp{font-family:"Baloo Bhaijaan 2",Cairo,sans-serif;margin:0;line-height:1.2}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
bdi{unicode-bidi:isolate}
.gl{background:var(--sf);border:1px solid var(--sb);-webkit-backdrop-filter:var(--bf);backdrop-filter:var(--bf);box-shadow:var(--sh)}
[hsl],.pc{--pc:hsl(var(--h) 82% var(--pl))}

.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 24px;border-width:0 0 1px}
.bar img{height:36px}.bar h1{font-size:1.5rem;font-weight:800}
.onair{display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:99px;background:var(--lv);color:#fff;font:700 .8rem "Baloo Bhaijaan 2",sans-serif}
.onair i{width:7px;height:7px;border-radius:50%;background:#fff;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.onair i{animation:none}}
.sp{flex:1}.clock{color:var(--mu);font-weight:600}
.ctl{display:flex;gap:6px}
.ctl button{min-width:38px;height:34px;padding:0 12px;border-radius:99px;font-weight:600;background:var(--sf);border:1px solid var(--sb)}
.ctl button:hover{border-color:var(--ac)}

.wrap{max-width:1380px;margin:0 auto;padding:22px 24px 40px;display:grid;grid-template-columns:minmax(0,1fr) 370px;grid-template-areas:"stage chat" "now chat" "fy fy" "gd gd" "pn pn";gap:20px}
.stage{grid-area:stage}.now{grid-area:now}.chat{grid-area:chat}.fy{grid-area:fy}.gdw{grid-area:gd}.pn{grid-area:pn}
.screen{position:relative;aspect-ratio:16/9;background:#000;border-radius:20px;overflow:hidden;border:1px solid var(--sb);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.screen video,.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain}
.tag{position:absolute;top:12px;inset-inline-start:12px;z-index:3;padding:0 10px;border-radius:6px;background:#000b;color:#fff;font:700 .85rem "Baloo Bhaijaan 2",sans-serif}
.tag[data-s=live]{background:var(--lv)}
.unm{position:absolute;top:12px;inset-inline-end:12px;z-index:3;padding:2px 14px;border-radius:99px;background:var(--ac);color:var(--acx);font-weight:600}
.off{position:absolute;inset:0;z-index:2;display:grid;place-content:center;gap:4px;text-align:center;padding:20px;background:#12142a;color:#a3a8cc}
.off b{font:700 1.5rem "Baloo Bhaijaan 2",sans-serif;color:#fff}

.now{--pc:hsl(var(--h) 82% var(--pl));display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:16px 18px;border-radius:20px}
.art{width:92px;height:92px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 55% var(--ga)),hsl(var(--h) 75% var(--gb)));font:800 2.4rem "Baloo Bhaijaan 2",sans-serif;color:#fff}
.art img{width:76%;height:76%;object-fit:contain}
.chipp{display:inline-block;padding:0 12px;border-radius:99px;background:var(--pc);color:var(--pcx);font-weight:700;font-size:.82rem}
.now h2{font-size:1.9rem;font-weight:800;margin:2px 0}
.meta{color:var(--mu);font-size:.92rem}
.pb{margin:10px 0 2px}
.pbt{position:relative;height:8px;border-radius:99px;background:color-mix(in srgb,var(--tx) 16%,transparent)}
.pbt span{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--pc);width:0}
.pbt i{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--pc),0 2px 8px rgba(0,0,0,.4);left:0}
.pbt b{position:absolute;top:-3px;bottom:-3px;width:2px;background:color-mix(in srgb,var(--tx) 35%,transparent);left:var(--x)}
.pb.end .pbt span{background:var(--lv)}.pb.end .pbt i{box-shadow:0 0 0 3px var(--lv),0 2px 8px rgba(0,0,0,.4)}
.pbl{display:flex;justify-content:space-between;margin-top:8px;font:600 .85rem Cairo,sans-serif;color:var(--mu)}
.pbl em{font-style:normal;color:var(--tx);font-weight:700}
.pb.end .pbl em{color:var(--lv)}
.srv{display:flex;flex-direction:column;gap:8px}
.srv button{padding:4px 16px;border-radius:12px;border:1px solid var(--sb);font-weight:600;white-space:nowrap}
.srv button.on{background:var(--ac);border-color:var(--ac);color:var(--acx)}

.chat{border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-height:480px}
.chat h3{padding:12px 16px;font-size:1.1rem;border-bottom:1px solid var(--sb)}
.chat iframe{flex:1;border:0;width:100%;background:#fff}
.chat p{margin:auto;color:var(--mu)}

.sec h2{font-size:1.45rem;font-weight:800}.sub{color:var(--mu);margin:0 0 12px}
.row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px}
.card{--pc:hsl(var(--h) 82% var(--pl));flex:none;width:224px;padding:8px 8px 12px;border-radius:16px;text-align:start;display:flex;flex-direction:column;gap:2px;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.cth{position:relative;aspect-ratio:16/9;border-radius:10px;display:grid;place-items:center;margin-bottom:6px;background:linear-gradient(135deg,hsl(var(--h) 55% var(--ga)),hsl(var(--h) 75% var(--gb)));color:#fff;font:800 2rem "Baloo Bhaijaan 2",sans-serif}
.cth img{height:78%;object-fit:contain}
.cth time{position:absolute;bottom:5px;inset-inline-end:6px;padding:0 7px;border-radius:6px;background:#000a;font:700 .8rem Cairo,sans-serif}
.cth u{position:absolute;top:4px;inset-inline-start:8px;color:var(--ac);text-decoration:none}
.card b{font:700 1.02rem/1.25 "Baloo Bhaijaan 2",Cairo,sans-serif;padding:0 4px}
.card small{color:var(--mu);padding:0 4px}.card .in{color:var(--pc);font-weight:600}

.gdw{border-radius:20px;padding:16px 0 8px 0}
.gdw .sec{padding:0 20px}
.gs{overflow-x:auto;padding:0 20px 12px}
.gd{position:relative;height:118px;direction:ltr}
.tk{position:absolute;top:0;height:22px;border-inline-start:1px solid var(--sb);padding-left:6px;font-size:.78rem;color:var(--mu);white-space:nowrap}
.bk{--pc:hsl(var(--h) 82% var(--pl));position:absolute;top:30px;height:80px;padding:8px 10px;border-radius:12px;overflow:hidden;text-align:start;display:flex;flex-direction:column;justify-content:space-between;background:color-mix(in srgb,var(--pc) 18%,var(--sf));border:1px solid var(--sb);border-top:4px solid var(--pc);unicode-bidi:plaintext}
.bk:hover{background:color-mix(in srgb,var(--pc) 30%,var(--sf))}
.bk b{font:700 .98rem/1.2 "Baloo Bhaijaan 2",Cairo,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk small{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk.fav{box-shadow:0 0 0 2px var(--pc)}
.bk .st{position:absolute;top:4px;right:8px;color:var(--ac)}
#nl{position:absolute;top:0;bottom:0;width:2px;background:var(--lv);z-index:4;pointer-events:none}
#nl::before{content:attr(data-l);position:absolute;top:-1px;left:4px;padding:0 6px;border-radius:5px;background:var(--lv);color:#fff;font:700 .72rem Cairo,sans-serif}

.planets{display:flex;flex-wrap:wrap;gap:14px}
.pl{--pc:hsl(var(--h) 82% var(--pl));width:88px;text-align:center;font-size:.85rem;font-weight:600}
.pl span{display:grid;place-items:center;width:66px;height:66px;margin:0 auto 4px;border-radius:50%;border:3px solid var(--sb);background:var(--sf);font:800 1.5rem "Baloo Bhaijaan 2",sans-serif;color:var(--pc)}
.pl img{width:46px;height:46px;object-fit:contain}
.pl.on span{border-color:var(--pc);box-shadow:0 0 18px -2px var(--pc)}
.toast{position:fixed;bottom:22px;inset-inline-start:22px;padding:10px 20px;border-radius:12px;background:var(--ac);color:var(--acx);font-weight:600;z-index:50}
footer{text-align:center;color:var(--mu);padding:0 0 26px;font-size:.85rem}

@media(max-width:1000px){
 .wrap{grid-template-columns:1fr;grid-template-areas:"stage" "now" "chat" "fy" "gd" "pn";padding:14px}
 .now{grid-template-columns:auto 1fr}.srv{grid-column:1/-1;flex-direction:row}
 .bar{padding:8px 12px;gap:8px}.clock,.bar h1{display:none}.chat{min-height:440px}
}
</style>
</head>
<body>

  ],
  OFFSET: "+01:00" // UTC offset of the stream PC / فرق توقيت جهاز البث
};
const G = "https://github.com/Mastergive/randompngtosave/blob/main/";
const P = {
  action:{h:8,ar:"أكشن",en:"Action",img:G+"Action_planet-Photoroom.png?raw=true"},
  adventure:{h:172,ar:"مغامرات",en:"Adventure",img:G+"Adventure-Photoroom.png?raw=true"},
  sports:{h:210,ar:"رياضة",en:"Sports",img:G+"Sports-Photoroom.png?raw=true"},
  bonbon:{h:325,ar:"بون بون",en:"Bon Bon",img:G+"Planet_Bon_Bon_New.png?raw=true"},
  comedy:{h:38,ar:"كوميديا",en:"Comedy",img:G+"%D9%83%D9%88%D9%83%D8%A8_%D9%83%D9%88%D9%82%D9%8A%D8%AF%D9%8A%D8%A7-Photoroom.png?raw=true"},
  zomoroda:{h:145,ar:"زمردة",en:"Zomoroda",img:G+"%D9%83%D9%88%D9%83%D8%A8_%D8%B2%D9%85%D8%B1%D8%AF%D8%A9-Photoroom.png?raw=true"},
  science:{h:255,ar:"علوم",en:"Science"},abjad:{h:20,ar:"أبجد",en:"Abjad"},movies:{h:230,ar:"أفلام",en:"Movies"}
};
const L = {
 ar:{onair:"على الهواء",unmute:"تشغيل الصوت",offT:"البث متوقف حالياً",offS:"تتم إعادة المحاولة تلقائياً، أو جرّب السيرفر 2",s1:"السيرفر 1",s2:"السيرفر 2",chat:"الدردشة المباشرة",
  fyT:"مختارات لك",fyS:"مرتبة حسب كواكبك المفضلة وما حفظته وقرب الموعد. اضغط للحفظ.",gdT:"دليل البث",gdS:"الأوقات بتوقيت جهازك. اضغط على أي فقرة لحفظها.",pnT:"تابع الكواكب",pnS:"اختر كواكبك المفضلة وسنظهر فقراتها أولاً.",
  glass:"زجاجي",classic:"عادي",live:"مباشر",conn:"جاري الاتصال",stop:"متوقف",now:"الآن",ep:"الحلقة ",movie:"فيلم",min:" دقيقة",next:"التالي: ",at:" الساعة ",in:"بعد ",m:" د",h:" س",
  p:"كوكب ",saved:"تم حفظ الفقرة",fol:"تتابع الآن كوكب ",load:"جاري تحميل الجدول",err:"تعذر تحميل الجدول",none:"لا توجد فقرات قادمة",
  s0:"بدأت للتو",s1p:"في بدايتها",s2p:"في المنتصف",s3p:"في النصف الثاني",s4p:"تقترب من النهاية",s5p:"انتهت، فقرة جديدة قريباً"},
 en:{onair:"On air",unmute:"Unmute",offT:"Stream is offline",offS:"Retrying automatically. You can also try Server 2.",s1:"Server 1",s2:"Server 2",chat:"Live chat",
  fyT:"Picked for you",fyS:"Ranked by your followed planets, saved shows and start time. Tap to save.",gdT:"Guide",gdS:"Times are in your local time. Tap any show to save it.",pnT:"Follow planets",pnS:"Pick your favorite planets and their shows come first.",
  glass:"Glass",classic:"Classic",live:"Live",conn:"Connecting",stop:"Offline",now:"NOW",ep:"Episode ",movie:"Movie",min:" min",next:"Up next: ",at:" at ",in:"in ",m:" min",h:" h",
  p:"",saved:"Saved",fol:"Now following ",load:"Loading schedule",err:"Could not load the schedule",none:"No upcoming shows",
  s0:"Just started",s1p:"Early on",s2p:"Halfway through",s3p:"In the second half",s4p:"Almost over",s5p:"Finished, next show soon"}
};
const $ = s => document.querySelector(s);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let lang = store.get("lang", (navigator.language || "en").startsWith("ar") ? "ar" : "en");
let th = store.get("th", matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
let ui = store.get("ui", "glass"), tf;
const t = k => L[lang][k];
const pl = k => P[k] || { h: 230, ar: k, en: k };
const pn = k => pl(k)[lang];
const hm = d => tf.format(d);
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const away = ms => { const m = Math.max(1, Math.round(ms / 6e4)); return t("in") + (m < 60 ? m + t("m") : Math.round(m / 60) + t("h")); };
const toast = x => { const d = document.createElement("div"); d.className = "toast"; d.textContent = x; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); };

function prefs() {
  const d = document.documentElement;
  d.lang = lang; d.dir = lang === "ar" ? "rtl" : "ltr"; d.dataset.th = th; d.dataset.ui = ui;
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  $("#bL").textContent = lang === "ar" ? "EN" : "ع";
  $("#bT").textContent = th === "dark" ? "☀" : "☾";
  $("#bU").textContent = ui === "glass" ? t("classic") : t("glass");
  document.title = "StoonOld - " + t("live");
  tf = new Intl.DateTimeFormat(lang === "ar" ? "ar-u-nu-latn" : "en-US", { hour: "numeric", minute: "2-digit" });
  setState(state);
}
$("#bL").onclick = () => { lang = lang === "ar" ? "en" : "ar"; store.set("lang", lang); prefs(); render(); };
$("#bT").onclick = () => { th = th === "dark" ? "light" : "dark"; store.set("th", th); prefs(); };
$("#bU").onclick = () => { ui = ui === "glass" ? "classic" : "glass"; store.set("ui", ui); prefs(); };

/* Chat */
const chat = $("#chat");
if (CFG.CHAT_URL) { const f = document.createElement("iframe"); f.src = CFG.CHAT_URL; f.title = "Chat"; chat.appendChild(f); }

/* Schedule */
let SCH = [], ENT = [], NOWITEM = null, follow = store.get("follow", {}), saved = store.get("saved", {}), okUrl = null, W0 = 0;
const PX = 4;
function clean(e) {
  const planet = (e.planet || "").toLowerCase();
  const name = planet === "movies" ? e.title : (e.series || e.title).replace(/\s*\((?:S\d+\s*)?\d+p\)\s*$/i, "");
  const m = /EP\s*(\d+(?:\s*&\s*\d+)?)/i.exec(e.path || "");
  const start = new Date(e.start.replace(" ", "T") + ":00" + CFG.OFFSET);
  return { id: e.start, planet, name, ep: m ? m[1] : "", mins: e.slot_minutes, dur: e.duration_sec, start, end: new Date(+start + e.slot_minutes * 6e4) };
}
async function getJ(u, step) {
  const r = await fetch(u + "?t=" + Math.floor(Date.now() / step), { cache: "no-store" });
  if (!r.ok) throw 0;
  return r.json();
}
const sib = u => u.replace(/schedule\.json$/, "stoon_state.json");
/* stoon_state.json = what the stream PC is really playing; it overrides the schedule for that time span */
function merge() {
  const n = NOWITEM;
  ENT = SCH.filter(x => !(n && x.start < n.end && x.end > n.start));
  if (n) ENT.push(n);
  ENT.sort((a, b) => a.start - b.start);
}
const getCur = now => (NOWITEM && NOWITEM.start <= now && now < NOWITEM.end) ? NOWITEM : ENT.find(x => x.start <= now && now < x.end);
async function load() {
  for (const u of okUrl ? [okUrl] : CFG.SCHEDULE_URLS) {
    try { SCH = ((await getJ(u, 3e5)).entries || []).map(clean); okUrl = u; break; } catch (e) {}
  }
  await loadState();
}
async function loadState() {
  for (const u of okUrl ? [okUrl] : CFG.SCHEDULE_URLS) {
    try { const s = await getJ(sib(u), 2e4); NOWITEM = s.current_item ? clean(s.current_item) : null; break; } catch (e) {}
  }
  merge(); render();
}
const kind = x => x.ep ? t("ep") + x.ep : t("movie");
const art = (k, big) => { const p = pl(k); return p.img ? '<img src="' + p.img + '" alt="">' : pn(k)[0]; };
const score = x => (follow[x.planet] ? 3 : 0) + (saved[x.id] ? 2 : 0) + 8 / (1 + Math.max(0, (x.start - Date.now()) / 36e5));

function render() {
  const now = Date.now(), cur = getCur(now), up = ENT.filter(x => +x.start > now);
  $("#clock").textContent = hm(new Date());
  if (!ENT.length) { $("#nTitle").textContent = okUrl === null ? t("load") : t("err"); return; }
  if (cur) {
    $("#now").style.setProperty("--h", pl(cur.planet).h);
    $("#nArt").innerHTML = art(cur.planet);
    $("#nPl").textContent = t("p") + pn(cur.planet);
    $("#nTitle").innerHTML = "<bdi>" + cur.name + "</bdi>";
    $("#nMeta").textContent = kind(cur) + " · " + cur.mins + t("min");
  } else { $("#nTitle").textContent = "StoonOld"; $("#nMeta").textContent = ""; $("#nPl").textContent = ""; }
  const nx = up[0];
  $("#nNext").innerHTML = nx ? t("next") + "<bdi>" + nx.name + "</bdi>" + t("at") + hm(nx.start) + " · " + away(nx.start - now) : "";

  const card = x => { const p = pl(x.planet); return '<button class="card gl" data-id="' + x.id + '" style="--h:' + p.h + '"><div class="cth">' + (saved[x.id] ? "<u>★</u>" : "") + art(x.planet) + "<time>" + hm(x.start) + "</time></div><b><bdi>" + x.name + "</bdi></b><small>" + t("p") + pn(x.planet) + " · " + kind(x) + '</small><small class="in">' + away(x.start - now) + "</small></button>"; };
  const picks = up.filter(x => x.start - now < 12 * 36e5).map(x => ({ x, s: score(x) })).sort((a, b) => b.s - a.s).slice(0, 8).map(o => o.x);
  $("#fy").innerHTML = picks.length ? picks.map(card).join("") : "<p class='sub'>" + t("none") + "</p>";

  W0 = +(cur || nx || { start: now }).start;
  let g = "";
  for (let i = 0; i < 12; i++) g += '<span class="tk" style="left:' + i * 30 * PX + 'px">' + hm(new Date(W0 + i * 18e5)) + "</span>";
  ENT.filter(x => x.end > W0 && +x.start < W0 + 6 * 36e5).forEach(x => {
    const p = pl(x.planet), w = x.mins * PX - 4;
    g += '<button class="bk' + (follow[x.planet] ? " fav" : "") + '" data-id="' + x.id + '" style="--h:' + p.h + ";left:" + (x.start - W0) / 6e4 * PX + "px;width:" + w + 'px">' + (saved[x.id] ? '<span class="st">★</span>' : "") + "<small>" + hm(x.start) + " · " + pn(x.planet) + "</small><b>" + x.name + "</b><small>" + kind(x) + "</small></button>";
  });
  $("#gd").innerHTML = g + '<div id="nl" data-l="' + t("now") + '"></div>';
  $("#gd").style.width = 12 * 30 * PX + "px";

  $("#pls").innerHTML = [...new Set(ENT.map(x => x.planet))].map(k => '<button class="pl' + (follow[k] ? " on" : "") + '" data-k="' + k + '" style="--h:' + pl(k).h + '"><span>' + art(k) + "</span>" + pn(k) + "</button>").join("");
  tick();
}
function tick() {
  const now = Date.now(), cur = getCur(now);
  const nl = $("#nl"); if (nl) nl.style.left = (now - W0) / 6e4 * PX + "px";
  $("#clock").textContent = hm(new Date());
  if (!cur) return;
  const el = Math.min(cur.dur, (now - cur.start) / 1e3), pct = el / cur.dur * 100;
  $("#pbf").style.width = pct + "%"; $("#pbk").style.left = pct + "%";
  $("#pe").textContent = mmss(el); $("#pr").textContent = "-" + mmss(cur.dur - el);
  $("#pb").classList.toggle("end", pct >= 88);
  const done = (now - cur.start) / 1e3 >= cur.dur;
  $("#pst").textContent = t(done ? "s5p" : pct < 8 ? "s0" : pct < 38 ? "s1p" : pct < 62 ? "s2p" : pct < 88 ? "s3p" : "s4p");
}
const sv = id => { saved[id] ? delete saved[id] : (saved[id] = 1, toast(t("saved"))); store.set("saved", saved); render(); };
["#fy", "#gd"].forEach(s => $(s).onclick = e => { const b = e.target.closest("[data-id]"); if (b) sv(b.dataset.id); });
$("#pls").onclick = e => { const b = e.target.closest(".pl"); if (!b) return; const k = b.dataset.k; follow[k] ? delete follow[k] : (follow[k] = 1, toast(t("fol") + pn(k))); store.set("follow", follow); render(); };

/* Stream */
const video = $("#v"), od = $("#od");
let hls = null, timer = null, state = "c";
const srcUrl = () => new URLSearchParams(location.search).get("src") || CFG.STREAM_URL;
function setState(s) { state = s; const g = $("#tag"); g.dataset.s = s; g.textContent = t({ c: "conn", live: "live", off: "stop" }[s]); $("#off").hidden = s !== "off"; }
function stopHls() { if (hls) { hls.destroy(); hls = null; } clearTimeout(timer); }
function retry() { stopHls(); setState("off"); timer = setTimeout(startHls, 5000); }
function startHls() {
  stopHls(); setState("c");
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode: true, liveSyncDurationCount: 3, backBufferLength: 30 });
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (e, d) => { if (!d.fatal) return; if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; } retry(); });
    hls.loadSource(srcUrl()); hls.attachMedia(video);
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) { video.src = srcUrl(); video.onerror = retry; video.play().catch(() => {}); }
  else setState("off");
}
video.addEventListener("playing", () => setState("live"));
video.addEventListener("volumechange", () => { $("#unm").hidden = !video.muted; });
$("#unm").onclick = () => { video.muted = false; video.volume = 1; video.play().catch(() => {}); };
document.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
  const own = b.dataset.n === "0";
  document.querySelectorAll("[data-n]").forEach(x => x.classList.toggle("on", x === b));
  video.hidden = !own; od.hidden = own; $("#tag").hidden = !own; $("#unm").hidden = !own || !video.muted;
  if (own) startHls(); else { stopHls(); video.pause(); $("#off").hidden = true; if (!od.getAttribute("src")) od.src = CFG.ODYSEE_URL; }
});

prefs(); startHls(); load();
setInterval(load, 3e5); setInterval(loadState, 2e4); setInterval(render, 3e4); setInterval(tick, 1000);
</script>
</body>
