<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<style>
:root {
    --primary-gradient: linear-gradient(180deg, #3a7bd5 0%, #1a4675 49%, #0f2d52 50%, #081b33 100%);
    --badge-gradient: linear-gradient(180deg, #4a8cd6, #0f3057);
    --border-color: #e2efff;
    --text-yellow: #fff200;
}

body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    width: 100vw;
}

/* خطوط مسح تلفزيونية ناعمة جداً للحفاظ على الطابع القديم بدون تشويه النقاء */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.02;
    background-image: repeating-linear-gradient(to bottom, #fff 0px, #fff 1px, transparent 1px, transparent 3px);
    z-index: 9999;
}

/* الحاضن الرئيسي مع أنميشن الظهور التدريجي */
.wrapper {
    margin-top: 40px;
    position: relative;
    width: 100%;
    height: 160px; /* زيادة الطول لاستيعاب الحجم الجديد */
    display: flex;
    align-items: center;
    opacity: 0;
    animation: fadeInWrapper 0.4s ease forwards;
}

@keyframes fadeInWrapper {
    to { opacity: 1; }
}

/* ================= شريط البث الرئيسي (تم تكبيره لـ 64px) ================= */
.scroll-container {
    display: flex;
    align-items: center;
    height: 64px; /* الحجم الجديد الأكبر */
    width: 92%;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    z-index: 10;
    background: var(--primary-gradient);
    border-top: 3px solid var(--border-color); /* زيادة سمك الخطوط قليلاً لتتناسب مع الحجم */
    border-bottom: 3px solid var(--border-color);
    box-shadow: inset 0 2px 5px rgba(255,255,255,0.25), 0 5px 20px rgba(0,0,0,0.6);
    
    /* أنميشن تمدد الشريط عند بدء التشغيل */
    transform: scaleX(0);
    transform-origin: center;
    animation: expandBar 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
}

@keyframes expandBar {
    to { transform: scaleX(1); }
}

/* ================= الصناديق الجانبية (تم ضبطها لتناسب الارتفاع الجديد) ================= */
.left-badge, .emoji-area {
    position: absolute;
    width: 105px; /* تكبير العرض */
    height: 82px; /* تكبير الارتفاع ليغطي الشريط بامتياز */
    background: var(--badge-gradient);
    border: 3px solid var(--border-color);
    clip-path: polygon(12% 0%, 100% 0%, 88% 100%, 0% 100%);
    display: flex;
    z-index: 100;
    box-shadow: 0 5px 15px rgba(0,0,0,0.6);
    
    /* تأثير الدخول القفزي الصغير (Pop-in) */
    transform: scale(0);
    animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.left-badge { 
    left: 1.5%; 
    align-items: center;
    justify-content: center;
    animation-delay: 0.9s;
}

.emoji-area {
    right: 1.5%;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    padding: 4px 0;
    animation-delay: 1s;
}

@keyframes popIn {
    to { transform: scale(1); }
}

/* محتوى الفليبر */
.flipper-content {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1), transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}

#qrImg { 
    width: 52px; /* تكبير الـ QR */
    height: 52px; 
    background: white; 
    padding: 3px; 
    border-radius: 6px;
}

#logoImg { 
    width: 78px; /* تكبير اللوجو الثابت */
}

.hidden { 
    opacity: 0; 
    visibility: hidden; 
    transform: rotateY(90deg); 
}

/* محتوى الرموز التعبيرية المعاصر بحجم ضخم */
#emojiVal {
    font-size: 36px; /* تكبير الإيموجي */
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    transition: opacity 0.4s, transform 0.4s;
    height: 40px;
    line-height: 40px;
}

#emojiNum {
    font-size: 15px; /* تكبير الرقم */
    color: #ffffff;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    transition: opacity 0.4s;
}

/* ================= تحسين حارة النصوص والشعار المتحرك ================= */
.scroll-wrapper {
    width: 100%;
    overflow: hidden;
    display: flex;
    opacity: 0;
    animation: fadeInText 0.4s ease 1.1s forwards; 
}

@keyframes fadeInText {
    to { opacity: 1; }
}

.scroll-content {
    display: flex;
    align-items: center;
    white-space: nowrap;
    height: 100%;
    animation: scroll-loop 30s linear infinite;
}

@keyframes scroll-loop {
    0% { transform: translateX(0); }
    100% { transform: translateX(100%); }
}

.item {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%; /* لضمان التوسط العمودي المطلق */
    padding-left: 160px; /* مسافة أوسع ومريحة بين الرسائل الكبيرة */
}

.text {
    font-size: 32px; /* خط كبير وضخم وجاهز للبث */
    color: var(--text-yellow);
    font-weight: bold;
    text-shadow: 2px 2px 3px rgba(0, 21, 47, 0.95);
    display: inline-block;
}

.username {
    color: #ffffff;
    font-weight: 900;
    font-size: 33px; /* خط اليوزر نيم متناسق مع حجم النص */
    margin-left: 15px;
    text-shadow: 2px 2px 3px rgba(0, 21, 47, 0.95);
    display: inline-block;
}

/* اللوجو المتحرك موسط تماماً بالمليمتر مع النص */
.scroll-logo {
    height: 42px; /* تكبير اللوجو المتحرك ليتماشى بامتياز مع النص الكبير */
    margin: 0 30px; /* مسافة جانبية متناسقة لعدم تداخل النص مع اللوجو */
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5));
    align-self: center; /* إجبار اللوجو على البقاء في السنتر عمودياً */
}
</style>
</head>

<body>

<div class="wrapper">
    <div class="left-badge">
        <div class="flipper-content" id="qrContainer">
            <img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://spacetoonold.netlify.app/message">
        </div>
        <div class="flipper-content hidden" id="logoContainer">
            <img id="logoImg" src="https://raw.githubusercontent.com/Mastergive/randompngtosave/refs/heads/main/Stoon2013.png">
        </div>
    </div>

    <div class="scroll-container">
        <div class="scroll-wrapper">
            <div class="scroll-content" id="content">
                <div class="item">
                    <span class="text">أرسل رسالتك الآن لتظهر على الشاشة</span>
                    <img class="scroll-logo" src="https://raw.githubusercontent.com/Mastergive/randompngtosave/refs/heads/main/Stoon2013.png">
                </div>
            </div>
            <div class="scroll-content" id="copy"></div>
        </div>
    </div>

    <div class="emoji-area">
        <div id="emojiNum">(1)</div>
        <div id="emojiVal">😀</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<script>
const content = document.getElementById('content');
const copy = document.getElementById('copy');

function updateTickerSpeed(){
    const width = content.offsetWidth;
    // بما أن النص أصبح أكبر، قمنا بضبط المعادلة للحفاظ على حركة سلسة ومريحة جداً للعين دون تسرع
    const duration = width / 80;  
    content.style.animationDuration = duration + "s";
    copy.style.animationDuration = duration + "s";
}

/* ================= حلقة الرموز التعبيرية مع أنميشن البوب الناعم ================= */
const eNum = document.getElementById('emojiNum');
const eVal = document.getElementById('emojiVal');

let count = 1;
let code = 128512;

async function runEmojiCycle(){
    while(true){
        // المرحلة 1: التركيز على الرقم
        eVal.style.opacity = "0.3";
        eVal.style.transform = "scale(0.85)";
        eNum.innerText = `(${count})`;
        eNum.style.opacity = "1";
        await new Promise(r => setTimeout(r, 1200));

        // المرحلة 2: التركيز على الإيموجي
        eNum.style.opacity = "0.5";
        eVal.innerText = String.fromCodePoint(code);
        eVal.style.opacity = "1";
        eVal.style.transform = "scale(1)";
        await new Promise(r => setTimeout(r, 2500));

        count++;
        code++;
        if(code > 128800){
            code = 128512;
            count = 1;
        }
    }
}
setTimeout(runEmojiCycle, 1500);

/* ================= تبديل اللوجو و الـ QR ثلاثي الأبعاد ================= */
const qrC = document.getElementById('qrContainer');
const logoC = document.getElementById('logoContainer');
setInterval(() => {
    qrC.classList.toggle('hidden');
    logoC.classList.toggle('hidden');
}, 6000);

/* ================= إعدادات FIREBASE وطريقة التحديث السلس ================= */
const firebaseConfig = {
    apiKey: "AIzaSyAtO7mz0ZptyJKCBo1ouV420ej5bWC5VYY",
    databaseURL: "https://spacetoonold-aaac4-default-rtdb.firebaseio.com",
    projectId: "spacetoonold-aaac4",
    appId: "1:511855750136:web:d353fa9309ac5e54a9040d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function addNewMessage(user, messageText){
    const newItem = document.createElement('div');
    newItem.className = 'item';
    newItem.innerHTML = `
        <span class="username">${user}:</span>
        <span class="text">${messageText}</span>
        <img class="scroll-logo" src="https://raw.githubusercontent.com/Mastergive/randompngtosave/refs/heads/main/Stoon2013.png">
    `;
    content.appendChild(newItem);
    copy.innerHTML = content.innerHTML;
    updateTickerSpeed();
}

db.ref('latestMessage').on('value', (snapshot) => {
    const data = snapshot.val();
    if(data && data.text){
        addNewMessage(data.username, data.text);
    }
});

window.onload = () => {
    copy.innerHTML = content.innerHTML;
    updateTickerSpeed();
};
</script>
</body>
</html>
