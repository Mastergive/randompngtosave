<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--red:#cc0004;--gloss:#ff4d51;--dark:#730002;--white:#fff;--yellow:#ffeb00}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:transparent;font-family:'Arial Black',Tahoma,'Segoe UI',Arial,sans-serif;width:100vw;height:100vh}

/* ===== position on screen (same 108px glass sphere as the ticker badge) ===== */
.badge{position:absolute;right:calc(3% + 70px);top:70px;width:108px;height:108px;
       display:flex;align-items:center;justify-content:center;perspective:600px;
       opacity:0;transform:scale(.7);animation:badge-in .45s ease-out .3s forwards}
@keyframes badge-in{to{opacity:1;transform:scale(1)}}

/* sphere: copied 1:1 from the original badge */
.badge::before{
    content:'';position:absolute;inset:0;border-radius:50%;border:6px solid transparent;
    background:
        radial-gradient(circle at 50% 35%,var(--gloss),var(--red) 60%,var(--dark)) padding-box,
        linear-gradient(145deg,#fff,var(--yellow) 45%,#b89a00 55%,#fff) border-box;
    box-shadow:0 2px 5px rgba(0,0,0,.55),inset 0 -3px 6px rgba(0,0,0,.35);
}
.badge::after{
    content:'';position:absolute;left:16%;right:16%;top:9%;height:36%;border-radius:50%;z-index:3;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.05));
}

/* ===== faces (swap every 5s with a flip) ===== */
.face{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
      transition:transform .6s cubic-bezier(.5,0,.2,1),opacity .45s ease-in-out;backface-visibility:hidden}
.face.hide{opacity:0;transform:rotateY(90deg) scale(.6);pointer-events:none}
#logoImg{width:72px;height:auto;object-fit:contain}

/* clean 100-subs face */
#cleanImg{width:60px;height:auto;margin-top:2px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.5))}
.count{font-size:31px;line-height:1;color:var(--yellow);font-weight:900;margin-top:1px;
       text-shadow:2px 2px 0 #000,0 0 10px rgba(255,235,0,.6)}
.sub{font-size:13px;line-height:1;color:#fff;font-weight:700;margin-top:2px;text-shadow:1.5px 1.5px 0 #000}
.count.pop{animation:numpop .5s ease-out}
@keyframes numpop{50%{transform:scale(1.3)}}

/* ===== effects (only while the 100 face is showing) ===== */
.ring,.ripple{position:absolute;border-radius:50%;pointer-events:none;opacity:0}
.ring{inset:-9px;z-index:1;
      background:conic-gradient(from 0deg,transparent 0 20%,var(--yellow) 45%,#fff 50%,transparent 70% 100%);
      -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
              mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
      transition:opacity .4s}
.badge.on .ring{opacity:1;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.ripple{inset:0;border:3px solid var(--yellow);z-index:0}
.badge.on .ripple{animation:ripple 1.6s ease-out 1}
.badge.on .ripple.r2{animation-delay:.35s}
@keyframes ripple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}

.glint{position:absolute;inset:6px;border-radius:50%;overflow:hidden;z-index:4;pointer-events:none}
.glint::before{content:'';position:absolute;top:0;bottom:0;width:40px;left:-60px;
               background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0))}
.badge.on .glint::before{animation:glint 1.1s ease-in-out .5s 1}
@keyframes glint{to{transform:translateX(220px)}}

.spark{position:absolute;left:50%;top:50%;font-size:20px;z-index:6;pointer-events:none;
       filter:drop-shadow(1px 1px 0 rgba(0,0,0,.5))}
</style>
</head>
<body>

<div class="badge" id="badge">
    <div class="ripple"></div><div class="ripple r2"></div>
    <div class="ring"></div>

    <!-- normal Spacetoon screenbug (unchanged sphere + logo) -->
    <div class="face" id="logoFace">
        <img id="logoImg" src="https://raw.githubusercontent.com/Mastergive/randompngtosave/refs/heads/main/Stoon2013.png">
    </div>

    <!-- clean version + 100 subscribers -->
    <div class="face hide" id="cleanFace">
        <img id="cleanImg" src="https://raw.githubusercontent.com/Mastergive/randompngtosave/refs/heads/main/StoonNo3D.png">
        <div class="count" id="count">0</div>
        <div class="sub">مشترك</div>
    </div>

    <div class="glint"></div>
</div>

<script>
    const badge = document.getElementById('badge');
    const logoFace = document.getElementById('logoFace');
    const cleanFace = document.getElementById('cleanFace');
    const countEl = document.getElementById('count');
    const EMOJIS = ['⭐','🚀','🌟','🪐','✨','🎉','👽','🎈'];
    let showClean = false;

    function countUp() {
        const t0 = performance.now(), D = 1300;
        (function step(now){
            const p = Math.min((now - t0) / D, 1);
            countEl.textContent = Math.round(100 * (1 - Math.pow(1 - p, 3)));
            if (p < 1) requestAnimationFrame(step);
            else { countEl.classList.remove('pop'); void countEl.offsetWidth; countEl.classList.add('pop'); }
        })(t0);
    }

    function confetti() {
        for (let i = 0; i < 12; i++) {
            const s = document.createElement('span');
            s.className = 'spark';
            s.textContent = EMOJIS[i % EMOJIS.length];
            badge.appendChild(s);
            const a = (i / 12) * Math.PI * 2 + Math.random() * .4;
            const d = 80 + Math.random() * 40;
            const dx = Math.cos(a) * d, dy = Math.sin(a) * d;
            s.animate([
                { transform: 'translate(-50%,-50%) scale(.2)', opacity: 0 },
                { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: .2 },
                { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1.1) rotate(${Math.random()*360}deg)`, opacity: 0 }
            ], { duration: 1500 + Math.random() * 400, delay: 350, easing: 'ease-out', fill: 'both' })
             .onfinish = () => s.remove();
        }
    }

    function swap() {
        showClean = !showClean;
        if (showClean) {
            logoFace.classList.add('hide');
            cleanFace.classList.remove('hide');
            badge.classList.remove('on'); void badge.offsetWidth; badge.classList.add('on');
            countEl.textContent = '0';
            setTimeout(countUp, 350);
            confetti();
        } else {
            cleanFace.classList.add('hide');
            logoFace.classList.remove('hide');
            badge.classList.remove('on');
        }
    }
    setInterval(swap, 5000);
</script>
</body>
</html>
