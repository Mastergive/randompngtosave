<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<style>

body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:transparent;
    font-family:Tahoma, Arial, sans-serif;
    width:100vw;

    filter:contrast(1.05) saturate(1.1);
}

/* ================= TV NOISE ================= */

.noise{

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:0.05;

    background-image:
    repeating-radial-gradient(
        circle at 0 0,
        rgba(255,255,255,0.4),
        rgba(255,255,255,0.4) 1px,
        transparent 1px,
        transparent 4px
    );

    z-index:9999;
}

/* ================= WRAPPER ================= */

.wrapper{

    margin-top:60px;

    position:relative;

    width:100%;

    height:140px;

    display:flex;

    align-items:center;
}

/* ================= MAIN BAR ================= */

.scroll-container{

    display:flex;

    align-items:center;

    height:58px;

    width:92%;

    margin:0 auto;

    background:
    linear-gradient(
        to bottom,
        #2f67a3 0%,
        #2f67a3 12%,
        #0f3970 13%,
        #0f3970 55%,
        #08254a 56%,
        #08254a 100%
    );

    border-top:4px solid #ffffff;

    border-bottom:4px solid #ffffff;

    position:relative;

    overflow:hidden;

    z-index:10;

    box-shadow:
    inset 0 3px 8px rgba(255,255,255,0.25),
    0 0 12px rgba(0,0,0,0.5);
}

/* glossy effect */

.scroll-container::before{

    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:50%;

    background:
    linear-gradient(
        to bottom,
        rgba(255,255,255,0.35),
        transparent
    );

    pointer-events:none;
}

/* ================= YELLOW SIDE ================= */

.yellow-strip{

    position:absolute;

    right:0;
    top:0;

    width:190px;
    height:100%;

    background:
    linear-gradient(
        to bottom,
        #ffe600 0%,
        #ffd000 45%,
        #e0a800 46%,
        #c98b00 100%
    );

    clip-path:polygon(12% 0,100% 0,100% 100%,0% 100%);

    z-index:1;
}

/* ================= LEFT BOX ================= */

.left-badge{

    position:absolute;

    left:1.5%;

    width:115px;
    height:85px;

    background:
    linear-gradient(
        to bottom,
        #3c6fb0,
        #0a2952
    );

    border:4px solid white;

    border-radius:12px;

    transform:skewX(-8deg);

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:100;

    box-shadow:
    0 4px 10px rgba(0,0,0,0.6);
}

.flipper-content{

    position:absolute;

    width:100%;
    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:opacity 0.5s ease-in-out;
}

#qrImg{

    width:60px;

    height:60px;

    background:white;

    padding:4px;

    border-radius:5px;

    transform:skewX(8deg);
}

#logoImg{

    width:80px;

    height:auto;

    object-fit:contain;

    transform:skewX(8deg);

    filter:blur(0.3px);
}

.hidden{

    opacity:0;

    visibility:hidden;
}

/* ================= RIGHT BOX ================= */

.emoji-area{

    position:absolute;

    right:1.5%;

    width:115px;
    height:85px;

    background:
    linear-gradient(
        to bottom,
        #3c6fb0,
        #0a2952
    );

    border:4px solid white;

    border-radius:12px;

    transform:skewX(-8deg);

    z-index:100;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    box-shadow:
    0 4px 10px rgba(0,0,0,0.6);

    color:white;

    font-weight:bold;
}

#emojiVal{

    font-size:42px;

    transform:skewX(8deg);

    text-shadow:
    2px 2px 0 #000;
}

#emojiNum{

    font-size:17px;

    margin-bottom:-5px;

    transform:skewX(8deg);

    text-shadow:
    2px 2px 0 #000;
}

/* ================= CONTINUOUS TV TICKER ================= */

.scroll-wrapper{

    width:100%;

    overflow:hidden;

    position:relative;

    margin:0 130px;

    z-index:2;

    height:100%;

    display:flex;

    align-items:center;
}

.ticker-track{

    display:flex;

    align-items:center;

    width:max-content;

    white-space:nowrap;

    animation:tickerMove 35s linear infinite;
}

@keyframes tickerMove{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }
}

.item{

    display:flex;

    align-items:center;

    padding-left:120px;
}

/* ================= TEXT ================= */

.text{

    font-size:30px;

    color:#ffe100;

    font-weight:bold;

    letter-spacing:-1px;

    text-shadow:
    3px 3px 0 #00142f;
}

.username{

    color:#ffffff;

    font-weight:900;

    font-size:31px;

    margin-left:12px;

    text-shadow:
    3px 3px 0 #00142f;
}

/* ================= LOGO ================= */

.scroll-logo{

    height:38px;

    margin:0 18px;

    opacity:0.95;

    filter:
    blur(0.3px)
    drop-shadow(2px 2px 2px rgba(0,0,0,0.7));
}

</style>
</head>

<body>

<div class="noise"></div>

<div class="wrapper">

    <!-- LEFT BOX -->

    <div class="left-badge">

        <div class="flipper-content" id="qrContainer">

            <img
            id="qrImg"
            src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://spacetoonold.netlify.app/message">

        </div>

        <div class="flipper-content hidden" id="logoContainer">

            <img
            id="logoImg"
            src="https://raw.githubusercontent.com/Mastergive/randompngtosave/refs/heads/main/Stoon2013.png">

        </div>

    </div>

    <!-- MAIN BAR -->

    <div class="scroll-container">

        <div class="yellow-strip"></div>

        <div class="scroll-wrapper">

            <div class="ticker-track" id="tickerTrack">

                <div class="item">

                    <span class="text">
                        أرسل رسالتك الآن لتظهر على الشاشة
                    </span>

                    <img
                    class="scroll-logo"
                    src="https://raw.githubusercontent.com/Mastergive/randompngtosave/refs/heads/main/Stoon2013.png">

                </div>

            </div>

        </div>

    </div>

    <!-- RIGHT BOX -->

    <div class="emoji-area">

        <div id="emojiNum">(1)</div>

        <div id="emojiVal">😀</div>

    </div>

</div>

<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<script>

/* ================= TICKER ================= */

const tickerTrack = document.getElementById('tickerTrack');

/* duplicate starter content many times */

function fillTicker(){

    const original = tickerTrack.innerHTML;

    tickerTrack.innerHTML = "";

    for(let i = 0; i < 12; i++){

        tickerTrack.innerHTML += original;
    }
}

fillTicker();

/* ================= EMOJI CYCLE ================= */

const eNum = document.getElementById('emojiNum');
const eVal = document.getElementById('emojiVal');

let count = 1;
let code = 128512;

async function runEmojiCycle(){

    while(true){

        eVal.style.opacity = "0";

        eNum.innerText = `(${count})`;

        eNum.style.opacity = "1";

        await new Promise(r => setTimeout(r,1000));

        eNum.style.opacity = "0.3";

        eVal.innerText = String.fromCodePoint(code);

        eVal.style.opacity = "1";

        await new Promise(r => setTimeout(r,2000));

        count++;
        code++;

        if(code > 128800){

            code = 128512;

            count = 1;
        }
    }
}

runEmojiCycle();

/* ================= LEFT BOX FLIP ================= */

const qrC = document.getElementById('qrContainer');
const logoC = document.getElementById('logoContainer');

setInterval(() => {

    qrC.classList.toggle('hidden');
    logoC.classList.toggle('hidden');

},5000);

/* ================= FIREBASE ================= */

const firebaseConfig = {

    apiKey:"AIzaSyAtO7mz0ZptyJKCBo1ouV420ej5bWC5VYY",

    databaseURL:"https://spacetoonold-aaac4-default-rtdb.firebaseio.com",

    projectId:"spacetoonold-aaac4",

    appId:"1:511855750136:web:d353fa9309ac5e54a9040d"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* ================= ADD MESSAGE ================= */

function addNewMessage(user,messageText){

    const newItem = document.createElement('div');

    newItem.className = 'item';

    newItem.innerHTML = `

        <span class="username">${user}:</span>

        <span class="text">${messageText}</span>

        <img
        class="scroll-logo"
        src="https://raw.githubusercontent.com/Mastergive/randompngtosave/refs/heads/main/Stoon2013.png">
    `;

    tickerTrack.appendChild(newItem);
}

/* ================= FIREBASE LISTENER ================= */

db.ref('latestMessage').on('value',(snapshot) => {

    const data = snapshot.val();

    if(data && data.text){

        addNewMessage(data.username,data.text);
    }
});

</script>

</body>
</html>
