<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<style>
:root {
    /* 2010 Era: Highly saturated, flat-cut glossy crimson style */
    --primary-bg: #cc0004;
    --gloss-top: #ff4d51;
    --dark-bottom: #730002;
    --border-color: #ffffff;
    --accent-yellow: #ffff00;
}

body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
    /* Using classic chunky system fonts for that old broadcast look */
    font-family: 'Arial Black', Tahoma, Arial, sans-serif;
    width: 100vw;
}

/* Obvious analog TV scanlines + composite color blur effect */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.12;
    background-image: repeating-linear-gradient(to bottom, #000 0px, #000 1px, transparent 1px, transparent 2px);
    z-index: 9999;
}

/* Main Wrapper */
.wrapper {
    margin-top: 40px;
    position: relative;
    width: 100%;
    height: 160px; 
    display: flex;
    align-items: center;
    opacity: 0;
    animation: fadeInWrapper 0.2s ease forwards;
}

@keyframes fadeInWrapper {
    to { opacity: 1; }
}

/* ================= 2010 HIGH-SATURATION TICKER BAR ================= */
.scroll-container {
    display: flex;
    align-items: center;
    height: 52px; 
    width: 96%;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    z-index: 10;
    
    /* 2010 sharp glossy split effect instead of modern smooth gradients */
    background: linear-gradient(to bottom, var(--gloss-top) 0%, var(--primary-bg) 45%, var(--dark-bottom) 50%, var(--primary-bg) 100%);
    
    /* Chunky borders with slight glow mimicking analog signal bleed */
    border-top: 4px solid var(--border-color); 
    border-bottom: 5px solid var(--accent-yellow);
    box-shadow: 0 4px 10px rgba(0,0,0,0.7), inset 0 3px 2px rgba(255,255,255,0.6);
    
    transform: scaleX(0);
    transform-origin: center;
    animation: expandBar 0.5s ease-out 0.2s forwards;
}

@keyframes expandBar {
    to { transform: scaleX(1); }
}

/* ================= LOW-RES CIRCULAR LEFT BADGE ================= */
.left-badge {
    position: absolute;
    left: 2%;
    width: 86px;
    height: 86px;
    
    background: linear-gradient(135deg, var(--gloss-top) 0%, var(--dark-bottom) 100%);
    
    /* Thick, heavy analog style borders */
    border: 4px solid var(--border-color);
    box-shadow: 0 4px 8px rgba(0,0,0,0.8), inset 0 0 8px rgba(0,0,0,0.6);
    border-radius: 50%;
    
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    
    transform: scale(0);
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.6s forwards;
}

/* ================= RIGHT SIDE EMOJI BOX ================= */
.emoji-area {
    position: absolute;
    right: 2%;
    width: 76px; 
    height: 76px; 
    background: linear-gradient(to bottom, var(--primary-bg) 0%, var(--dark-bottom) 100%);
    border: 4px solid var(--border-color);
    border-radius: 12px; 
    
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
    z-index: 100;
    box-shadow: 0 4px 8px rgba(0,0,0,0.8);
    
    transform: scale(0);
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.7s forwards;
}

@keyframes popIn {
    to { transform: scale(1); }
}

/* Flipper Content (QR / Static Logo) */
.flipper-content {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.4s ease, transform 0.4s ease;
}

#qrImg { 
    width: 50px; 
    height: 50px; 
    background: white; 
    padding: 2px; 
    border-radius: 4px;
}

#logoImg { 
    width: 60px; 
    object-fit: contain;
}

.hidden { 
    opacity: 0; 
    visibility: hidden; 
    transform: rotateY(90deg); 
}

/* Old school pixelated/aliased text-shadows for emojis and text */
#emojiVal {
    font-size: 30px; 
    filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.7));
    transition: opacity 0.3s, transform 0.3s;
    height: 34px;
    line-height: 34px;
}

#emojiNum {
    font-size: 14px; 
    color: #ffffff;
    font-weight: bold;
    text-shadow: 2px 2px 0px #000;
    transition: opacity 0.3s;
}

/* ================= TICKER TEXT & CHROMATIC BLEED EFFECT ================= */
.scroll-wrapper {
    width: 100%;
    overflow: hidden;
    display: flex;
    opacity: 0;
    animation: fadeInText 0.3s ease 0.8s forwards; 
}

@keyframes fadeInText {
    to { opacity: 1; }
}

.scroll-content {
    display: flex;
    align-items: center;
    white-space: nowrap;
    height: 100%;
    animation: scroll-loop 25s linear infinite;
}

@keyframes scroll-loop {
    0% { transform: translateX(0); }
    100% { transform: translateX(100%); }
}

.item {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%; 
    padding-left: 130px; 
}

/* text shadows mimic analog video color bleeding (red/black artifacting) */
.text {
    font-size: 25px; 
    color: #ffffff; 
    font-weight: bold;
    text-shadow: 2px 2px 0px #000, -1px -1px 1px rgba(255,0,0,0.5);
    display: inline-block;
    letter-spacing: -0.5px;
}

.username {
    color: var(--accent-yellow); 
    font-weight: 900;
    font-size: 26px; 
    margin-left: 10px;
    text-shadow: 2px 2px 0px #000, -1px -1px 1px rgba(255,0,0,0.5);
    display: inline-block;
    letter-spacing: -0.5px;
}

/* 2010 Scaled Inline Logo with standard drop shadow */
.scroll-logo {
    height: 24px; /* Scaled perfectly to match the 25px text height */
    width: auto;
    margin: 0 20px; 
    filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.6));
    align-self: center; 
}
</style>
</head>

<body>

<div class="wrapper">
    <div class="left-badge">
        <div class="flipper-content" id="qrContainer">
            <img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://spacetoonold.netlify.app/message">
        </div>
        <div class="flipper-content hidden" id="logoContainer">
            <img id="logoImg" src="https://raw.githubusercontent.com/Mastergive/randompngtosave/refs/heads/main/Stoon2013.png">
        </div>
    </div>

    <div class="scroll-container">
        <div class="scroll-wrapper">
            <div class="scroll-content" id="content">
                <div class="item">
                    <span class="text">أرسل رسالتك الآن لتظهر على الشاشة</span>
                    <img class="scroll-logo" src="https://raw.githubusercontent.com/Mastergive/randompngtosave/refs/heads/main/Stoon2013.png">
                </div>
            </div>
            <div class="scroll-content" id="copy"></div>
        </div>
    </div>

    <div class="emoji-area">
        <div id="emojiNum">(1)</div>
        <div id="emojiVal">😀</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<script>
const content = document.getElementById('content');
const copy = document.getElementById('copy');

function updateTickerSpeed(){
    const width = content.offsetWidth;
    const duration = width / 85;  
    content.style.animationDuration = duration + "s";
    copy.style.animationDuration = duration + "s";
}

/* ================= Emoji Loop System ================= */
const eNum = document.getElementById('emojiNum');
const eVal = document.getElementById('emojiVal');

let count = 1;
let code = 128512;

async function runEmojiCycle(){
    while(true){
        eVal.style.opacity = "0.4";
        eVal.style.transform = "scale(0.9)";
        eNum.innerText = `(${count})`;
        eNum.style.opacity = "1";
        await new Promise(r => setTimeout(r, 1200));

        eNum.style.opacity = "0.6";
        eVal.innerText = String.fromCodePoint(code);
        eVal.style.opacity = "1";
        eVal.style.transform = "scale(1)";
        await new Promise(r => setTimeout(r, 2500));

        count++;
        code++;
        if(code > 128800){
            code = 128512;
            count = 1;
        }
    }
}
setTimeout(runEmojiCycle, 1500);

/* ================= Left Badge Toggle (QR / Logo) ================= */
const qrC = document.getElementById('qrContainer');
const logoC = document.getElementById('logoContainer');
setInterval(() => {
    qrC.classList.toggle('hidden');
    logoC.classList.toggle('hidden');
}, 6000);

/* ================= Firebase Dynamic Message Integration ================= */
const firebaseConfig = {
    apiKey: "AIzaSyAtO7mz0ZptyJKCBo1ouV420ej5bWC5VYY",
    databaseURL: "https://spacetoonold-aaac4-default-rtdb.firebaseio.com",
    projectId: "spacetoonold-aaac4",
    appId: "1:511855750136:web:d353fa9309ac5e54a9040d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function addNewMessage(user, messageText){
    const newItem = document.createElement('div');
    newItem.className = 'item';
    newItem.innerHTML = `
        <span class="username">${user}:</span>
        <span class="text">${messageText}</span>
        <img class="scroll-logo" src="https://raw.githubusercontent.com/Mastergive/randompngtosave/refs/heads/main/Stoon2013.png">
    `;
    content.appendChild(newItem);
    copy.innerHTML = content.innerHTML;
    updateTickerSpeed();
}

db.ref('latestMessage').on('value', (snapshot) => {
    const data = snapshot.val();
    if(data && data.text){
        addNewMessage(data.username, data.text);
    }
});

window.onload = () => {
    copy.innerHTML = content.innerHTML;
    updateTickerSpeed();
};
</script>
</body>
</html>
