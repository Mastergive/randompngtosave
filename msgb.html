<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; padding: 0; 
            overflow: hidden; 
            background-color: transparent; 
            font-family: 'Segoe UI', Arial, sans-serif;
            width: 100vw;
            box-sizing: border-box;
        }
        
        .wrapper {
            margin-top: 60px; 
            position: relative;
            width: 100%;
            height: 160px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- أنيميشن ظهور حاوية الشريط السفلية (نمط مسطرة مدرسية) --- */
        .scroll-container {
            display: flex;
            align-items: center;
            height: 60px; 
            width: 92%;
            margin: 0 auto;
            background: #fff3b0; /* أصفر مدرسي دافئ */
            border-top: 6px dashed #1d3557; /* كحلي مدرسي */
            border-bottom: 6px dashed #1d3557;
            position: relative;
            z-index: 10;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            
            /* أنيميشن الدخول */
            animation: container-entrance 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scaleX(0);
            opacity: 0;
        }

        /* خطوط تدريج المسطرة أعلى الشريط */
        .scroll-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 8px;
            background: repeating-linear-gradient(
                90deg,
                #1d3557,
                #1d3557 2px,
                transparent 2px,
                transparent 12px
            );
            opacity: 0.4;
        }

        @keyframes container-entrance {
            100% {
                transform: scaleX(1);
                opacity: 1;
            }
        }

        /* --- LEFT BADGE --- */
        .left-badge {
            position: absolute;
            left: 2%;
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #fff3b0 60%, #e63946 100%);
            border: 4px solid #1d3557;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            perspective: 1000px;

            animation: left-badge-entrance 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s forwards;
            transform: translateX(-200px) rotate(-360deg);
            opacity: 0;
        }

        @keyframes left-badge-entrance {
            100% {
                transform: translateX(0) rotate(0deg);
                opacity: 1;
            }
        }

        .flipper-content {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease-in-out;
            backface-visibility: hidden;
        }
        
        #qrImg { width: 70px; height: 70px; background: white; padding: 4px; border-radius: 5px; border: 2px solid #1d3557; }
        #logoImg { width: 85px; height: auto; object-fit: contain; }
        
        .hidden { opacity: 0; visibility: hidden; transform: rotateY(180deg); }
        .visible { opacity: 1; visibility: visible; transform: rotateY(0deg); }

        /* --- RIGHT BADGE --- */
        .emoji-area {
            position: absolute;
            right: 2%;
            width: 105px;
            height: 105px;
            background: #1d3557;
            border: 4px solid #ffd500;
            border-radius: 50%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            color: #fff3b0;
            font-weight: bold;

            animation: right-badge-entrance 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s forwards;
            transform: translateX(200px) scale(0.5);
            opacity: 0;
        }

        @keyframes right-badge-entrance {
            100% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        #emojiVal, #emojiNum {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #emojiVal { font-size: 45px; }
        #emojiNum { font-size: 18px; margin-bottom: -5px; color: #ffd500; }

        /* --- TICKER --- */
        .scroll-wrapper {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            display: flex;
            margin: 0 120px; 
            position: relative;
        }

        /* المسار المتحرك (يتحرك عبر JS لضمان تكرار سلس بدون قفزات) */
        .ticker-track {
            display: flex;
            width: max-content;
            direction: ltr;
            will-change: transform;
        }

        .scroll-content {
            display: flex;
            flex: none;
            direction: rtl;
            align-items: center;
            white-space: nowrap;
        }

        .item { 
            display: flex; 
            align-items: center; 
            padding-left: 100px; 
        }
        .text { font-size: 26px; color: #1d3557; font-weight: bold; } 
        .username { color: #e63946; font-weight: 900; font-size: 26px; margin-left: 10px; }
        .scroll-logo { height: 35px; margin: 0 20px; }

        /* --- SCHOOL DECORATIONS (قلم ورقية ودفتر) --- */
        
        /* 1. تصميم القلم الرصاص (Pencil) */
        .school-pencil {
            position: absolute;
            z-index: 110;
            width: 18px;
            height: 70px;
            background: #ffd500;
            border: 2px solid #1d3557;
            border-radius: 2px;
            animation: school-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.5) forwards;
            opacity: 0;
        }
        /* ممحاة القلم من الأعلى */
        .school-pencil::before {
            content: '';
            position: absolute;
            top: -12px; left: -2px;
            width: 18px; height: 10px;
            background: #ffb703;
            border: 2px solid #1d3557;
            border-bottom: 2px solid #8d99ae;
            border-radius: 4px 4px 0 0;
        }
        /* سن القلم من الأسفل */
        .school-pencil::after {
            content: '';
            position: absolute;
            bottom: -15px; left: -2px;
            width: 0; height: 0;
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-top: 15px solid #d4a373;
        }

        /* 2. تصميم كتاب/دفتر مدرسي (Book) */
        .school-book {
            position: absolute;
            z-index: 110;
            width: 45px;
            height: 35px;
            background: #e63946;
            border: 3px solid #1d3557;
            border-radius: 4px;
            box-shadow: 2px 2px 0px #1d3557;
            animation: school-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.5) forwards;
            opacity: 0;
        }
        /* صفحات الكتاب */
        .school-book::before {
            content: '';
            position: absolute;
            right: 3px; top: 3px; bottom: 3px;
            width: 8px;
            background: #fff;
            border-left: 2px solid #1d3557;
        }
        /* شريط علامة الصفحة */
        .school-book::after {
            content: '';
            position: absolute;
            top: 0; left: 10px;
            width: 6px; height: 18px;
            background: #ffd500;
            border: 1px solid #1d3557;
        }

        @keyframes school-pop {
            100% {
                opacity: 1;
            }
        }

        /* تموضعات عناصر الزينة المدرسة */
        .pop-left { left: 22%; bottom: -10px; animation-delay: 0.8s; transform: rotate(-25deg); }
        .pop-mid { left: 50%; top: 30px; animation-delay: 0.6s; transform: translateX(-50%) rotate(10deg); }
        .pop-right { right: 12%; bottom: -12px; animation-delay: 1s; transform: rotate(20deg); }

    </style>
</head>
<body>

<div class="wrapper">
    <div class="left-badge">
        <div class="flipper-content visible" id="qrContainer">
            <img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://spacetoonold.netlify.app/message">
        </div>
        <div class="flipper-content hidden" id="logoContainer">
            <img id="logoImg" src="https://raw.githubusercontent.com/Mastergive/randompngtosave/refs/heads/main/StoonNo3D.png">
        </div>
    </div>

    <div class="scroll-container">
        <div class="scroll-wrapper" id="tickerWrap">
            <div class="ticker-track" id="track">
                <div class="scroll-content" id="content"></div>
                <div class="scroll-content" id="copy"></div>
            </div>
        </div>
    </div>

    <div class="emoji-area">
        <div id="emojiNum">(1)</div>
        <div id="emojiVal">✏️</div>
    </div>

    <!-- زينة الكتاب (خارج الشريط حتى لا تُقص) + قلم رصاص وكتاب على الجانبين -->
    <div class="school-book pop-mid"></div>
    <div class="school-pencil pop-left"></div>
    <div class="school-book pop-right" style="background: #457b9d;"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<script>
    const LOGO = "https://raw.githubusercontent.com/Mastergive/randompngtosave/refs/heads/main/StoonNo3D.png";
    const SPEED = 80;       // px / second (نفس السرعة الأصلية)
    const MAX_MSGS = 10;

    const tickerWrap = document.getElementById('tickerWrap');
    const track = document.getElementById('track');
    const content = document.getElementById('content');
    const copy = document.getElementById('copy');

    let msgs = [{ u: '', t: 'أهلاً بكم في الموسم الدراسي الجديد! أرسل رسالتك الآن' }];

    function makeItem(m) {
        const item = document.createElement('div');
        item.className = 'item';
        if (m.u) {
            const u = document.createElement('span');
            u.className = 'username';
            u.textContent = m.u + ':';
            item.appendChild(u);
        }
        const t = document.createElement('span');
        t.className = 'text';
        t.textContent = m.t;          // textContent: آمن من حقن الأكواد
        item.appendChild(t);
        const img = document.createElement('img');
        img.className = 'scroll-logo';
        img.src = LOGO;
        item.appendChild(img);
        return item;
    }

    function fill(group, reps) {
        group.replaceChildren();
        for (let i = 0; i < reps; i++) msgs.forEach(m => group.appendChild(makeItem(m)));
    }

    // يكرر الرسائل حتى يملأ الشريط بالكامل فلا تظهر فراغات
    function renderTicker() {
        let reps = 1;
        fill(content, reps);
        while (content.offsetWidth < tickerWrap.offsetWidth + 200 && reps < 12) {
            reps++;
            fill(content, reps);
        }
        fill(copy, reps);
    }

    // حركة سلسة ثابتة السرعة (لا تُعاد عند وصول رسالة جديدة)
    let x = 0, lastT = performance.now();
    function tick(now) {
        const dt = Math.min((now - lastT) / 1000, 0.1);
        lastT = now;
        const w = content.offsetWidth;
        if (w) {
            x = (x + SPEED * dt) % w;
            track.style.transform = `translateX(${x - w}px)`;
        }
        requestAnimationFrame(tick);
    }

    function addNewMessage(user, messageText) {
        msgs.unshift({ u: String(user || '').slice(0, 40), t: String(messageText).slice(0, 250) });
        msgs = msgs.slice(0, MAX_MSGS);
        renderTicker();
    }

    // --- أنيميشن الإيموجي الذكي ---
    const eNum = document.getElementById('emojiNum');
    const eVal = document.getElementById('emojiVal');
    const emojis = ['📚', '✏️', '🎒', '📝'];
    let count = 1;
    let idx = 0;

    async function runEmojiCycle() {
        while (true) {
            eVal.style.opacity = "0";
            eVal.style.transform = "scale(0.5)";
            eNum.innerText = `(${count})`;
            eNum.style.opacity = "1";
            eNum.style.transform = "scale(1)";
            
            await new Promise(r => setTimeout(r, 1000));
            
            eNum.style.opacity = "0.3"; 
            eNum.style.transform = "scale(0.8)";
            eVal.innerText = emojis[idx];
            eVal.style.opacity = "1";
            eVal.style.transform = "scale(1)";
            
            await new Promise(r => setTimeout(r, 2000));
            
            count++;
            idx = (idx + 1) % emojis.length;
            if (count > emojis.length) { count = 1; }
        }
    }
    setTimeout(runEmojiCycle, 1200);

    // --- أنيميشن البادج الأيسر ---
    const qrC = document.getElementById('qrContainer');
    const logoC = document.getElementById('logoContainer');
    setInterval(() => {
        if(qrC.classList.contains('visible')) {
            qrC.classList.replace('visible', 'hidden');
            logoC.classList.replace('hidden', 'visible');
        } else {
            logoC.classList.replace('visible', 'hidden');
            qrC.classList.replace('hidden', 'visible');
        }
    }, 5000);

    // --- إعدادات الفايربيس (Firebase) ---
    // داخل try/catch: لو فشل التحميل يستمر الشريط بالعمل
    try {
        const firebaseConfig = {
            apiKey: "AIzaSyAtO7mz0ZptyJKCBo1ouV420ej5bWC5VYY",
            databaseURL: "https://spacetoonold-aaac4-default-rtdb.firebaseio.com", 
            projectId: "spacetoonold-aaac4",
            appId: "1:511855750136:web:d353fa9309ac5e54a9040d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('latestMessage').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.text) {
                addNewMessage(data.username, data.text);
            }
        });
    } catch (err) {
        console.error('Firebase error:', err);
    }

    window.addEventListener('load', () => {
        renderTicker();
        requestAnimationFrame(tick);
    });
    window.addEventListener('resize', renderTicker);
</script>

</body>
</html>
