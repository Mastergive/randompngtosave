<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Spacetoon - 24/7 Live Stream</title>
  <style>
    :root {
      --primary-color: #1a1a2e;
      --accent-color: #ff9900;
      --card-bg: #16213e;
      --text-color: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--primary-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .player-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .album-art-container {
      width: 130px;
      height: 130px;
      margin: 0 auto 1rem auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .album-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.5s ease-in-out;
    }

    .visualizer-container {
      width: 100%;
      height: 60px;
      background-color: #080c14;
      border-radius: 8px;
      margin-bottom: 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .status-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 1rem;
      background-color: #444;
      transition: background-color 0.3s ease;
    }

    .status-badge.live {
      background-color: #e50914;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
      animation: pulse 2s infinite;
    }

    .station-title {
      font-size: 1.5rem;
      margin: 0 0 0.5rem 0;
    }

    .track-info {
      font-size: 0.95rem;
      color: #b3b3b3;
      margin-bottom: 1.2rem;
      min-height: 2.8em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
      transition: opacity 0.4s ease-in-out;
    }

    .track-title-text {
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 2px;
    }

    .track-artist-text {
      color: var(--accent-color);
      font-size: 0.85rem;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      align-items: center;
    }

    .play-btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background-color 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.05);
      background-color: #ffaa22;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 80%;
    }

    .volume-slider {
      width: 100%;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(229, 9, 20, 0); }
      100% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); }
    }

    .fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div id="statusBadge" class="status-badge">Offline</div>
    
    <div class="album-art-container">
      <img id="albumArt" class="album-art" src="https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/88/9d/ff/889dff3f-1cf7-8f1e-80f2-2ab7c874905e/859765481186_cover.jpg/100x100bb.jpg" alt="Album Cover">
    </div>

    <div class="visualizer-container">
      <canvas id="visualizer" width="300" height="60"></canvas>
    </div>

    <h2 class="station-title">Radio Spacetoon</h2>
    
    <div id="trackInfo" class="track-info">
      <div id="songTitle" class="track-title-text">Radio Spacetoon</div>
      <div id="songArtist" class="track-artist-text">24/7 Live Stream</div>
    </div>

    <div class="controls">
      <button id="playBtn" class="play-btn" aria-label="Play Stream">▶</button>
      
      <div class="volume-container">
        <span>🔈</span>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
        <span>🔊</span>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://eu8.fastcast4u.com/external/rpc.php?m=streaminfo.get&username=radiospacetoon&charset=utf-8';

    // Standard Audio instance without setting crossOrigin attributes
    const audio = new Audio();

    const playBtn = document.getElementById('playBtn');
    const statusBadge = document.getElementById('statusBadge');
    const trackInfo = document.getElementById('trackInfo');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const albumArt = document.getElementById('albumArt');
    const volumeSlider = document.getElementById('volumeSlider');
    
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    let animationId;
    let isPlaying = false;
    let currentTrackName = "";

    const numBars = 24;
    const barHeights = new Array(numBars).fill(0);

    audio.volume = volumeSlider.value;

    function drawVisualizer() {
      animationId = requestAnimationFrame(drawVisualizer);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const barWidth = canvas.width / numBars;

      for (let i = 0; i < numBars; i++) {
        const targetHeight = Math.random() * canvas.height * 0.85;
        barHeights[i] += (targetHeight - barHeights[i]) * 0.25;

        const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
        gradient.addColorStop(0, '#00ffcc');
        gradient.addColorStop(0.6, '#ffcc00');
        gradient.addColorStop(1, '#ff0055');

        ctx.fillStyle = gradient;
        ctx.fillRect(i * barWidth, canvas.height - barHeights[i], barWidth - 3, barHeights[i]);
      }
    }

    async function updateNowPlaying() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (data && data.data && data.data[0] && data.data[0].track) {
          const track = data.data[0].track;
          const fullTrackName = `${track.artist} - ${track.title}`;

          if (fullTrackName !== currentTrackName) {
            currentTrackName = fullTrackName;

            trackInfo.classList.add('fade-out');
            albumArt.classList.add('fade-out');

            setTimeout(() => {
              songTitle.textContent = track.title || "Radio Spacetoon";
              songArtist.textContent = track.artist || "Live Stream";

              if (track.imageurl) {
                albumArt.src = track.imageurl;
              }

              trackInfo.classList.remove('fade-out');
              albumArt.classList.remove('fade-out');
            }, 400);
          }
        }
      } catch (err) {
        console.error("Metadata error:", err);
      }
    }

    updateNowPlaying();
    setInterval(updateNowPlaying, 5000);

    playBtn.addEventListener('click', () => {
      if (!isPlaying) {
        // Appending parameters forces Centova/Icecast to output raw audio stream chunks
        audio.src = 'https://eu8.fastcast4u.com/radiospacetoon?type=http&nocache=' + Date.now();

        audio.play().then(() => {
          isPlaying = true;
          playBtn.textContent = '❚❚';
          statusBadge.textContent = 'ON AIR';
          statusBadge.classList.add('live');
          drawVisualizer();
        }).catch(err => {
          console.error("Playback Error:", err);
          songTitle.textContent = "Unable to connect";
          songArtist.textContent = "Check network connection";
        });
      } else {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        isPlaying = false;
        playBtn.textContent = '▶';
        statusBadge.textContent = 'OFFLINE';
        statusBadge.classList.remove('live');
        cancelAnimationFrame(animationId);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });
  </script>

</body>
</html>
