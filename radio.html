<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Spacetoon - 24/7 Live Stream</title>
  <style>
    :root {
      --primary-color: #1a1a2e;
      --accent-color: #ff9900;
      --card-bg: #16213e;
      --text-color: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--primary-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .player-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .status-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 1rem;
      background-color: #444;
    }

    .status-badge.live {
      background-color: #e50914;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
    }

    .station-title {
      font-size: 1.5rem;
      margin: 0 0 0.5rem 0;
    }

    .track-info {
      font-size: 0.95rem;
      color: #b3b3b3;
      margin-bottom: 1.5rem;
      min-height: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      align-items: center;
    }

    .play-btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background-color 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.05);
      background-color: #ffaa22;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 80%;
    }

    .volume-slider {
      width: 100%;
      accent-color: var(--accent-color);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div id="statusBadge" class="status-badge">Offline</div>
    <h2 class="station-title">Radio Spacetoon</h2>
    <div id="trackTitle" class="track-info">Loading stream info...</div>

    <div class="controls">
      <button id="playBtn" class="play-btn" aria-label="Play Stream">▶</button>
      
      <div class="volume-container">
        <span>🔈</span>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
        <span>🔊</span>
      </div>
    </div>
  </div>

  <script>
    // Replace with your active Cloudflare HTTPS Tunnel URL and mount point
    const STREAM_BASE_URL = 'https://xxxx.trycloudflare.com';
    const MOUNT_POINT = '/spacetoon_live';
    const STREAM_URL = STREAM_BASE_URL + MOUNT_POINT;
    const STATS_URL = STREAM_BASE_URL + '/status-json.xsl';

    const audio = new Audio();
    const playBtn = document.getElementById('playBtn');
    const statusBadge = document.getElementById('statusBadge');
    const trackTitle = document.getElementById('trackTitle');
    const volumeSlider = document.getElementById('volumeSlider');

    let isPlaying = false;

    // Set initial volume
    audio.volume = volumeSlider.value;

    // Toggle Play/Pause (Handles live stream buffer clearance)
    playBtn.addEventListener('click', () => {
      if (!isPlaying) {
        // Append timestamp to bypass browser cache and force direct live stream connection
        audio.src = STREAM_URL + '?nocache=' + Date.now();
        audio.play().then(() => {
          isPlaying = true;
          playBtn.textContent = '❚❚';
          statusBadge.textContent = 'ON AIR';
          statusBadge.classList.add('live');
        }).catch(err => {
          console.error("Playback error:", err);
          trackTitle.textContent = "Unable to connect to stream.";
        });
      } else {
        audio.pause();
        audio.src = ''; // Detach stream to save user bandwidth
        isPlaying = false;
        playBtn.textContent = '▶';
        statusBadge.textContent = 'OFFLINE';
        statusBadge.classList.remove('live');
      }
    });

    // Volume Slider
    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });

    // Fetch Icecast Now-Playing Metadata
    async function updateMetadata() {
      try {
        const response = await fetch(STATS_URL);
        if (!response.ok) throw new Error("Stats unreachable");
        
        const data = await response.json();
        let sources = data.icestats.source;
        
        // Handle single source vs array of sources
        if (!Array.isArray(sources)) {
          sources = [sources];
        }

        const currentSource = sources.find(s => s.listenurl && s.listenurl.includes(MOUNT_POINT));

        if (currentSource && currentSource.title) {
          trackTitle.textContent = currentSource.title;
        } else {
          trackTitle.textContent = "Radio Spacetoon - Live Stream";
        }
      } catch (err) {
        // Fallback title if status-json isn't reachable
        if (trackTitle.textContent === "Loading stream info...") {
          trackTitle.textContent = "Radio Spacetoon - 24/7 Channel";
        }
      }
    }

    // Poll metadata every 10 seconds
    updateMetadata();
    setInterval(updateMetadata, 10000);
  </script>

</body>
</html>
