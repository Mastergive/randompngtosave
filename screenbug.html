<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Screenbug (10s Loop)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top-Right corner positioning */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 220px;
            height: auto;
            opacity: 0;
            transform-origin: center;
            will-change: transform, opacity;
            transform: translateZ(0);
        }

        /* --- Master 10-Second Loop --- */
        .looping-active {
            animation: spacetoonMasterLoop 10s ease-in-out infinite;
        }

        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: inline-block;
            overflow: hidden;
        }

        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- Shine strictly inside the Logo Pixels --- */
        .bug-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0; 
            width: 100%;
            height: 100%;
            
            background: linear-gradient(
                115deg,
                transparent 30%,
                rgba(255, 255, 255, 0.75) 50%,
                transparent 70%
            );
            background-size: 200% 100%;
            background-position: var(--shine-pos, 150%) 0;

            -webkit-mask-image: url('Stoon3D.png');
            mask-image: url('Stoon3D.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
        }

        /* --- Perfectly Timed 10s Keyframes --- */
        @keyframes spacetoonMasterLoop {
            0% { /* Arrives instantly on start */
                opacity: 0;
                transform: scale(0) rotate(25deg) translateX(50px) translateZ(0);
            }
            6% {
                transform: scale(1.08) rotate(-5deg) translateX(-5px) translateZ(0);
            }
            10% { /* Fully locked in by 1 second */
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateX(0) translateZ(0);
            }
            80% { /* Stays completely still on screen until 8 seconds */
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateX(0) translateZ(0);
            }
            84% {
                opacity: 0.7;
                transform: scale(0.9, 1.05) rotate(-3deg) translateX(-15px) translateZ(0);
            }
            90%, 100% { /* Disappears completely for the last 1 second before restarting */
                opacity: 0;
                transform: scale(0) rotate(15deg) translateX(40px) translateZ(0);
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper" id="wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const wrapper = document.getElementById('wrapper');
        
        let shineInterval;
        let masterLoopInterval;
        const targetFPS = 25; 
        const frameDuration = 1000 / targetFPS; 

        function triggerSingleShine() {
            let currentPos = 150;
            const endPos = -50;
            const shineDuration = 1200; // Shine lasts 1.2 seconds
            const totalFrames = shineDuration / frameDuration; 
            const stepIncrement = (endPos - currentPos) / totalFrames;

            if (shineInterval) clearInterval(shineInterval);

            shineInterval = setInterval(() => {
                currentPos += stepIncrement;
                if (currentPos <= endPos) {
                    clearInterval(shineInterval); // Stop once it sweeps across completely
                } else {
                    wrapper.style.setProperty('--shine-pos', `${currentPos}%`);
                }
            }, frameDuration);
        }

        function startScreenbug() {
            stopScreenbug(); // Clear any existing timelines

            // 1. Start the CSS animation loop
            container.classList.add('looping-active');

            // 2. Trigger the first shine right after it pops into view (at 1 second)
            setTimeout(triggerSingleShine, 1000);

            // 3. Keep triggering a single shine every 10 seconds perfectly synchronized
            masterLoopInterval = setInterval(() => {
                setTimeout(triggerSingleShine, 1000); 
            }, 10000);
        }

        function stopScreenbug() {
            container.classList.remove('looping-active');
            if (shineInterval) clearInterval(shineInterval);
            if (masterLoopInterval) clearInterval(masterLoopInterval);
            wrapper.style.setProperty('--shine-pos', '150%');
        }

        // Run instantly when loaded
        window.addEventListener('DOMContentLoaded', () => {
            startScreenbug();
        });

        // OBS Source Visibility Handling
        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                startScreenbug();
            } else {
                stopScreenbug();
            }
        });
    </script>
</body>
</html>
