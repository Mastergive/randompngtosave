<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Vintage Screenbug - Fall 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* تموضع البث العربي القياسي: الزاوية العليا اليمنى */
        #screenbug-wrapper {
            position: absolute;
            top: 35px;
            right: 45px;
            width: 220px;
            height: auto;
            filter: blur(0.3px) contrast(1.05) saturate(1.1) drop-shadow(0 3px 8px rgba(0, 0, 0, 0.3));
        }

        /* غلاف الشعار الأصلي */
        #logo-container {
            position: relative;
            width: 100%;
            height: auto;
            z-index: 2;
            transform: translate3d(0, 0, 0);
            will-change: transform, opacity;
        }

        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* طبقة تأثير اللمعان الأصلي دون تغيير */
        .shine-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-mask-image: url('Stoon3D.png');
            mask-image: url('Stoon3D.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        .shine-layer::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0; 
            width: 100%;
            height: 100%;
            background: linear-gradient(
                -90deg,
                transparent 0%,
                rgba(15, 35, 120, 0) 40%,
                rgba(25, 60, 180, 0.4) 47%,
                rgba(70, 120, 255, 0.6) 50%,
                rgba(25, 60, 180, 0.4) 53%,
                rgba(15, 35, 120, 0) 60%,
                transparent 100%
            );
            transform: skewX(25deg) translate3d(-120%, 0, 0);
            mix-blend-mode: color-dodge;
            opacity: 0.85;
            will-change: transform;
            animation: logoShineFastRTL 1.0s linear infinite;
        }

        /* عنصر أشجار الخريف المصمم للالتصاق بالجانب الأيسر للشعار */
        .fall-tree-badge {
            position: absolute;
            left: -48px;
            bottom: 4px;
            width: 95px;
            height: 80px;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transform-origin: bottom right;
            transform: translate3d(40px, 0, 0) scale(0.4);
            will-change: transform, opacity;
            filter: drop-shadow(-2px 2px 4px rgba(0,0,0,0.35));
        }

        /* حركات الرياح والأوراق المتساقطة */
        .tree-sway {
            transform-origin: bottom center;
            animation: fallWindSway 2.0s ease-in-out infinite alternate;
        }

        .blowing-leaf {
            will-change: transform, opacity;
            animation: leafFly 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
        }
        .blowing-leaf-2 {
            animation-delay: 0.8s;
            animation-duration: 1.9s;
        }

        /* --- Master Timeline (8.5s Cycle) --- */
        .active-sequence #screenbug-wrapper {
            animation: masterBugFade 8.5s ease-in-out infinite;
        }

        .active-sequence .fall-tree-badge {
            animation: fallTreeSlideOut 8.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
        }

        /* ظهور الشعار والدورة الكاملة */
        @keyframes masterBugFade {
            0% { opacity: 0; }
            5% { opacity: 0.98; }
            94% { opacity: 0.98; }
            100% { opacity: 0; }
        }

        /* خروج الأشجار من خلف الشعار بعد 5 ثوانٍ، والبقاء لمدة 3 ثوانٍ */
        @keyframes fallTreeSlideOut {
            0%, 58.8% { /* 0s - 5.0s (مختفي خلف الشعار) */
                opacity: 0;
                transform: translate3d(40px, 0, 0) scale(0.4);
            }
            64.7% { /* 5.5s (ظهور وانزلاق سلس للخارج) */
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
            }
            94.1% { /* 8.0s (بقاء طوال الـ 3 ثواني) */
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
            }
            100% { /* 8.5s (اختفاء واسترجاع للشعار) */
                opacity: 0;
                transform: translate3d(30px, 0, 0) scale(0.5);
            }
        }

        /* اهتزاز الأشجار مع حركة الهواء */
        @keyframes fallWindSway {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-4deg) translateY(-1px); }
        }

        /* تطاير الأوراق الخريفية فوق الشعار */
        @keyframes leafFly {
            0% {
                transform: translate3d(20px, 0, 0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% {
                transform: translate3d(-45px, -25px, 0) rotate(-180deg) scale(0.4);
                opacity: 0;
            }
        }

        /* حركة اللمعان الأصلي */
        @keyframes logoShineFastRTL {
            0% { 
                transform: skewX(25deg) translate3d(-120%, 0, 0); 
            }
            100% { 
                transform: skewX(25deg) translate3d(120%, 0, 0); 
            }
        }
    </style>
</head>
<body>

    <div id="screenbug-wrapper">
        <!-- الأشجار الخريفية المصغرة المثبتة خلف الجانب الأيسر للشعار -->
        <svg class="fall-tree-badge" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="trunkGrad" x1="0" y1="0" x2="0" y2="100%">
                    <stop offset="0%" stop-color="#4A2511"/>
                    <stop offset="100%" stop-color="#261106"/>
                </linearGradient>
                <radialGradient id="leafRed" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#FF4500"/>
                    <stop offset="70%" stop-color="#C71585"/>
                    <stop offset="100%" stop-color="#4A0010"/>
                </radialGradient>
                <radialGradient id="leafOrange" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#FF8C00"/>
                    <stop offset="80%" stop-color="#D2691E"/>
                    <stop offset="100%" stop-color="#8B0000"/>
                </radialGradient>
                <radialGradient id="leafGold" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#FFD700"/>
                    <stop offset="80%" stop-color="#FF8C00"/>
                </radialGradient>
            </defs>

            <!-- التلة والأرضية الخريفية -->
            <ellipse cx="50" cy="82" rx="42" ry="7" fill="#8B2500" opacity="0.85"/>
            <path d="M15 82C30 78 70 78 85 82Z" fill="#D2691E"/>

            <!-- مجسم الأشجار -->
            <g class="tree-sway">
                <!-- الشجرة الخلفية الصغيرة -->
                <path d="M30 82L30 55 M30 65L22 58" stroke="url(#trunkGrad)" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="28" cy="48" r="14" fill="url(#leafGold)"/>
                <circle cx="20" cy="52" r="10" fill="url(#leafOrange)"/>

                <!-- الشجرة الرئيسية الملتصقة بالشعار -->
                <path d="M62 83C62 68 64 60 62 44 M62 62L50 52 M62 55L72 46" stroke="url(#trunkGrad)" stroke-width="4" stroke-linecap="round"/>
                <circle cx="62" cy="38" r="20" fill="url(#leafRed)"/>
                <circle cx="48" cy="44" r="15" fill="url(#leafOrange)"/>
                <circle cx="74" cy="46" r="13" fill="url(#leafGold)"/>
                <circle cx="62" cy="26" r="13" fill="url(#leafGold)"/>
            </g>

            <!-- أوراق متطايرة مع الريح -->
            <g class="blowing-leaf">
                <path d="M60 30C56 26 50 28 48 22 C54 24 56 18 60 20Z" fill="#FF4500" transform="scale(0.5)"/>
            </g>
            <g class="blowing-leaf blowing-leaf-2">
                <path d="M72 40C68 36 62 38 60 32 C66 34 68 28 72 30Z" fill="#FFD700" transform="scale(0.4)"/>
            </g>
        </svg>

        <!-- طبقة الشعار واللمعان 3D -->
        <div id="logo-container">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
            <div class="shine-layer" id="shine-element"></div>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('screenbug-wrapper');

        function triggerBroadcastSequence() {
            document.body.classList.remove('active-sequence');
            void wrapper.offsetWidth; // Force Reflow لإعادة الأنميشن
            document.body.classList.add('active-sequence');
        }

        window.addEventListener('DOMContentLoaded', () => {
            triggerBroadcastSequence();
        });

        /* توافق كامل مع مصادر OBS Studio */
        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                triggerBroadcastSequence();
            } else {
                document.body.classList.remove('active-sequence');
            }
        });
    </script>
</body>
</html>
