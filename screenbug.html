<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Vintage Screenbug - Back to School Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Standard Arabic broadcast positioning: Top-Right corner */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 230px;
            height: auto;
            opacity: 0;
            transform-origin: center;
            
            /* SIMULATED 576p CRT ANALOG LOW-QUALITY FEED */
            filter: blur(0.4px) contrast(1.05) saturate(1.1);
        }

        /* Screenbug fade in */
        .animate-entrance {
            animation: spacetoonFadeIntro 0.5s ease-out forwards;
        }

        /* --- THE SHINE CONTAINER --- */
        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: inline-block;
        }

        /* The transparent 3D logo asset layer */
        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- BACK TO SCHOOL ACCENTS --- */
        
        /* Mini School Pencil attached to the side of logo */
        .school-pencil-badge {
            position: absolute;
            bottom: -5px;
            left: -15px;
            width: 14px;
            height: 48px;
            background: #ffd500;
            border: 2px solid #1d3557;
            border-radius: 2px;
            transform: rotate(-25deg);
            z-index: 5;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        /* Eraser */
        .school-pencil-badge::before {
            content: '';
            position: absolute;
            top: -9px; left: -2px;
            width: 14px; height: 8px;
            background: #ff8fa3;
            border: 2px solid #1d3557;
            border-bottom: 2px solid #8d99ae;
            border-radius: 3px 3px 0 0;
        }
        /* Pencil Lead Tip */
        .school-pencil-badge::after {
            content: '';
            position: absolute;
            bottom: -12px; left: -2px;
            width: 0; height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 12px solid #d4a373;
        }

        /* Small yellow sparkle/star near top right of bug */
        .school-star {
            position: absolute;
            top: -8px;
            right: 10px;
            font-size: 16px;
            color: #ffd500;
            text-shadow: 0 0 4px #1d3557;
            animation: starPulse 2s ease-in-out infinite alternate;
        }

        @keyframes starPulse {
            0% { transform: scale(0.8) rotate(0deg); opacity: 0.7; }
            100% { transform: scale(1.2) rotate(15deg); opacity: 1; }
        }

        /* --- THE SHINE EFFECT LAYER --- */
        .shine-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            -webkit-mask-image: url('Stoon3D.png');
            mask-image: url('Stoon3D.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        .shine-layer::after {
            content: '';
            position: absolute;
            top: 0;
            right: -150%; 
            width: 100%;
            height: 100%;
            
            background: linear-gradient(
                -90deg,
                transparent 0%,
                rgba(15, 35, 120, 0) 40%,
                rgba(25, 60, 180, 0.4) 47%,
                rgba(70, 120, 255, 0.6) 50%,
                rgba(25, 60, 180, 0.4) 53%,
                rgba(15, 35, 120, 0) 60%,
                transparent 100%
            );
            transform: skewX(25deg);
            mix-blend-mode: color-dodge;
            opacity: 0.85; 
        }

        /* LOCKED TO 1.0 SECOND LOOP */
        .shine-active::after {
            animation: logoShineFastRTL 1.0s linear infinite;
        }

        /* --- KEYFRAMES --- */
        @keyframes spacetoonFadeIntro {
            0% { opacity: 0; }
            100% { opacity: 0.95; }
        }

        @keyframes logoShineFastRTL {
            0% { right: -120%; }
            100% { right: 120%; }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
            
            <!-- School Pencil & Accent Badge -->
            <div class="school-pencil-badge"></div>
            <div class="school-star">✏️</div>

            <div class="shine-layer" id="shine-element"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const shineElement = document.getElementById('shine-element');

        function triggerBroadcastSequence() {
            container.classList.remove('animate-entrance');
            shineElement.classList.remove('shine-active');
            
            void container.offsetWidth;
            
            container.classList.add('animate-entrance');
            
            setTimeout(() => {
                shineElement.classList.add('shine-active');
            }, 500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            triggerBroadcastSequence();
        });

        /* OBS Browser Source Live State Tracking Hooks */
        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                triggerBroadcastSequence();
            } else {
                container.classList.remove('animate-entrance');
                shineElement.classList.remove('shine-active');
            }
        });
    </script>
</body>
</html>
