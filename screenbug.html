<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Vintage Screenbug (2nd Anniversary Loop)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Standard Arabic broadcast positioning: Top-Right corner */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 220px;
            height: auto;
            opacity: 0;
            transform-origin: center;
            perspective: 1000px; /* Crucial for clean 3D rotation */
            
            /* SIMULATED 576p CRT ANALOG LOW-QUALITY FEED */
            filter: blur(0.4px) contrast(1.05) saturate(1.1);
        }

        /* Screenbug just fades in smoothly */
        .animate-entrance {
            animation: spacetoonFadeIntro 0.5s ease-out forwards;
        }

        /* --- THE SHINE CONTAINER & 3D FLIP SYSTEM --- */
        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: inline-block;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), filter 0.6s ease;
            transform-style: preserve-3d;
        }

        /* The transition flash/flip triggers */
        .bug-wrapper.flip-transition {
            transform: rotateY(90deg);
            filter: brightness(2.5) contrast(1.2); /* Retro broadcast flash effect */
        }

        /* The transparent 3D logo asset layer */
        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- THE SHINE EFFECT LAYER --- */
        .shine-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* INITIAL MASK FOR DEFAULT LOGO */
            -webkit-mask-image: url('Stoon3D.png');
            mask-image: url('Stoon3D.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        /* Creates the custom right-to-left sheen strip over the transparent mask base */
        .shine-layer::after {
            content: '';
            position: absolute;
            top: 0;
            right: -150%; 
            width: 100%;
            height: 100%;
            
            /* --- FIXED: SMALLER, NARROWER BLUE SHINE --- */
            background: linear-gradient(
                -90deg,
                transparent 0%,
                rgba(15, 35, 120, 0) 40%,
                rgba(25, 60, 180, 0.4) 47%,
                rgba(70, 120, 255, 0.6) 50%, /* Sharp center core */
                rgba(25, 60, 180, 0.4) 53%,
                rgba(15, 35, 120, 0) 60%,
                transparent 100%
            );
            transform: skewX(25deg);
            
            /* color-dodge lights up base pixels dynamically without flattening dark image values */
            mix-blend-mode: color-dodge;
            opacity: 0.85; 
        }

        /* LOCKED TO EXACTLY 1.0 SECOND LOOP */
        .shine-active::after {
            animation: logoShineFastRTL 1.0s linear infinite;
        }

        /* --- KEYFRAMES --- */

        /* Clean and classic fade-in opacity transition */
        @keyframes spacetoonFadeIntro {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 0.95; 
            }
        }

        /* Right-to-left sweeping motion */
        @keyframes logoShineFastRTL {
            0% {
                right: -120%;
            }
            100% {
                right: 120%;
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper" id="bug-wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image" id="logo-img">
            <div class="shine-layer" id="shine-element"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const wrapper = document.getElementById('bug-wrapper');
        const logoImg = document.getElementById('logo-img');
        const shineElement = document.getElementById('shine-element');

        let loopTimer = null;

        function triggerBroadcastSequence() {
            // Reset everything completely
            clearTimeout(loopTimer);
            container.classList.remove('animate-entrance');
            shineElement.classList.remove('shine-active');
            wrapper.classList.remove('flip-transition');
            
            // Reset to default configuration
            logoImg.src = "Stoon3D.png";
            shineElement.style.maskImage = "url('Stoon3D.png')";
            shineElement.style.webkitMaskImage = "url('Stoon3D.png')";
            
            void container.offsetWidth; // Force DOM reflow
            
            // Introduce bug
            container.classList.add('animate-entrance');
            
            // Start the shine trail shortly after entering
            setTimeout(() => {
                shineElement.classList.add('shine-active');
                // Initiate the persistent loop pattern (10s Default -> 5s Anniversary)
                startLogoAlternationLoop();
            }, 500);
        }

        function startLogoAlternationLoop() {
            // Step 1: Wait 10 seconds on the standard logo, then transition to anniversary
            loopTimer = setTimeout(() => {
                switchLogoAsset("Stoon3DA.png", () => {
                    // Step 2: Once anniversary is live, wait 5 seconds, then transition back
                    loopTimer = setTimeout(() => {
                        switchLogoAsset("Stoon3D.png", () => {
                            // Step 3: Recurse back into the state machine
                            startLogoAlternationLoop();
                        });
                    }, 5000);
                });
            }, 10000);
        }

        function switchLogoAsset(targetSrc, callback) {
            // Trigger 3D rotation out & flash
            wrapper.classList.add('flip-transition');
            
            // Swap asset parameters dead-center inside the 90-degree twist
            setTimeout(() => {
                logoImg.src = targetSrc;
                shineElement.style.maskImage = `url('${targetSrc}')`;
                shineElement.style.webkitMaskImage = `url('${targetSrc}')`;
                
                // Return to normal rotation angles
                wrapper.classList.remove('flip-transition');
                
                if(callback) callback();
            }, 300); // Perfectly mid-way through the 0.6s CSS transition curve
        }

        window.addEventListener('DOMContentLoaded', () => {
            triggerBroadcastSequence();
        });

        /* OBS Browser Source Live State Tracking Hooks */
        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                triggerBroadcastSequence();
            } else {
                clearTimeout(loopTimer);
                container.classList.remove('animate-entrance');
                shineElement.classList.remove('shine-active');
                wrapper.classList.remove('flip-transition');
            }
        });
    </script>
</body>
</html>
