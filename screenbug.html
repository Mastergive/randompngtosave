<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spacetoon Screenbug - Autumn 2026 (Pro)</title>
<style>
/* Design stage is a fixed 1920x1080 canvas, scaled to any OBS resolution (720p..4K) */
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden;width:100%;height:100%}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}

/* Title-safe: 5% margin (96px / 54px) from top-right */
#bug{position:absolute;top:54px;right:96px;width:300px;height:170px;
  display:flex;align-items:center;justify-content:center;opacity:0;
  --ease-out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1)}

/* Logo: crisp (no blur), soft grounded shadow only */
#logo{position:relative;width:230px;z-index:3;
  transform:translateZ(0);filter:drop-shadow(0 6px 10px rgba(0,0,0,.45)) drop-shadow(0 0 1px rgba(0,0,0,.6))}
#logo img{width:100%;display:block}

/* Specular sweep: soft, short, with a long pause between passes */
.shine{position:absolute;inset:0;
  -webkit-mask:url('Stoon3D.png') center/contain no-repeat;mask:url('Stoon3D.png') center/contain no-repeat}
.shine::after{content:'';position:absolute;inset:-10% 0;width:45%;
  background:linear-gradient(100deg,transparent 0%,rgba(255,236,200,.0) 20%,rgba(255,244,225,.75) 50%,rgba(255,236,200,0) 80%,transparent 100%);
  transform:translateX(-130%) skewX(-18deg);mix-blend-mode:screen}
.run .shine::after{animation:sweep 4.2s cubic-bezier(.45,.05,.25,1) .9s infinite}
@keyframes sweep{0%{transform:translateX(-130%) skewX(-18deg)}38%,100%{transform:translateX(330%) skewX(-18deg)}}

/* Warm backlight (rim light) behind logo, breathing slowly */
#glow{position:absolute;inset:-30px -40px;z-index:1;opacity:0;
  background:radial-gradient(ellipse at 50% 55%,rgba(255,140,40,.55) 0%,rgba(220,70,20,.22) 45%,transparent 72%);
  transition:opacity 1.2s ease;mix-blend-mode:screen}
.autumn #glow{opacity:1;animation:breathe 3s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(.96)}to{transform:scale(1.05)}}

/* Leaves */
.leaf-layer{position:absolute;inset:0;pointer-events:none}
#back{z-index:2}#front{z-index:4}
.leaf{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity;
  transform:translate(var(--x),var(--y)) scale(0) rotate(calc(var(--r) - 120deg));
  transition:transform .9s var(--spring) var(--d),opacity .35s ease var(--d)}
.autumn .leaf{opacity:1;transform:translate(var(--x),var(--y)) scale(1) rotate(var(--r))}
.leaving .leaf{transition:transform .5s ease-in var(--o),opacity .45s ease-in var(--o);
  opacity:0;transform:translate(var(--x),calc(var(--y) + 14px)) scale(.6) rotate(calc(var(--r) + 40deg))}
.leaf svg{display:block;width:var(--s);height:var(--s);margin:calc(var(--s) / -2);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));
  animation:sway var(--t) ease-in-out var(--d) infinite alternate;transform-origin:50% 90%}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

/* Drifting leaves with real 3D flip, only while autumn is active */
.drift{position:absolute;left:0;top:0;opacity:0}
.autumn .drift{animation:drift var(--t) linear var(--d) infinite}
.drift svg{display:block;width:var(--s);height:var(--s);margin:calc(var(--s) / -2);
  animation:flip calc(var(--t) / 2.2) ease-in-out infinite alternate;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
@keyframes drift{
  0%{transform:translate(var(--x0),var(--y0));opacity:0}
  15%{opacity:1}85%{opacity:.9}
  100%{transform:translate(var(--x1),var(--y1));opacity:0}}
@keyframes flip{from{transform:perspective(200px) rotate3d(1,.6,0,-60deg) rotate(0)}
  to{transform:perspective(200px) rotate3d(1,.6,0,60deg) rotate(160deg)}}

@media (prefers-reduced-motion:reduce){.leaf svg,.drift,.drift svg{animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="bug">
    <div id="glow"></div>
    <div class="leaf-layer" id="back"></div>
    <div id="logo"><img src="Stoon3D.png" alt="Spacetoon"><div class="shine"></div></div>
    <div class="leaf-layer" id="front"></div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a1f"/><stop offset="1" stop-color="#8e1410"/></linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa01c"/><stop offset="1" stop-color="#c24a0a"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#d98a0b"/></linearGradient>
    <linearGradient id="gBrown" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8742a"/><stop offset="1" stop-color="#6b3410"/></linearGradient>
    <symbol id="maple" viewBox="0 0 100 100">
      <path id="mp" d="M50 3 58 22 73 15 69 35 92 30 79 49 97 57 72 63 74 73 56 69 56 97 50 97 44 97 44 69 26 73 28 63 3 57 21 49 8 30 31 35 27 15 42 22Z"/>
      <path d="M50 94V30M50 70 22 56M50 70 78 56M50 52 28 34M50 52 72 34" stroke="rgba(60,10,0,.35)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M50 3 58 22 73 15 69 35 50 40 31 35 27 15 42 22Z" fill="rgba(255,255,255,.16)"/>
    </symbol>
  </defs>
</svg>

<script>
const stage = document.getElementById('stage');
const bug = document.getElementById('bug');
const back = document.getElementById('back');
const front = document.getElementById('front');
const FILLS = ['gRed','gOrange','gGold','gOrange','gBrown','gRed','gGold'];
const rnd = (a,b)=>a+Math.random()*(b-a);

/* Scale the 1920x1080 stage to whatever resolution OBS gives us */
function fit(){stage.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}
addEventListener('resize',fit);fit();

function leafSVG(fill){
  return '<svg viewBox="0 0 100 100"><use href="#maple" fill="url(#'+fill+')"/></svg>';
}

/* Garland: leaves hug an ellipse around the logo, heavier at top-left and bottom edge */
function build(){
  back.innerHTML = front.innerHTML = '';
  const cx = 150, cy = 85, N = 15;
  for(let i=0;i<N;i++){
    const a = (i/N)*Math.PI*2 + rnd(-.18,.18);
    const rx = 128 + rnd(-8,14), ry = 62 + rnd(-6,10);
    const x = cx + Math.cos(a)*rx, y = cy + Math.sin(a)*ry;
    const size = rnd(24, 40) * (Math.sin(a) > .5 ? .85 : 1);
    const el = document.createElement('div');
    el.className = 'leaf';
    el.style.cssText = '--x:'+x+'px;--y:'+y+'px;--r:'+rnd(0,360)+'deg;--s:'+size+'px;'
      + '--d:'+(i*.045)+'s;--o:'+(i*.02)+'s;--t:'+rnd(1.6,2.6)+'s';
    el.innerHTML = leafSVG(FILLS[i % FILLS.length]);
    (i % 3 === 0 ? front : back).appendChild(el);
  }
  /* a few drifting leaves crossing the logo */
  for(let i=0;i<6;i++){
    const el = document.createElement('div');
    el.className = 'drift';
    el.style.cssText = '--s:'+rnd(12,20)+'px;--x0:'+rnd(220,320)+'px;--y0:'+rnd(-20,30)+'px;'
      + '--x1:'+rnd(-40,40)+'px;--y1:'+rnd(150,200)+'px;--t:'+rnd(3,4.2)+'s;--d:'+(i*.5)+'s';
    el.innerHTML = leafSVG(FILLS[(i+2) % FILLS.length]);
    front.appendChild(el);
  }
}

/* Master timeline: 0s logo in -> 5s foliage blooms -> 8s foliage out -> 8.6s logo out -> loop */
let timers = [];
const at = (ms, fn)=>timers.push(setTimeout(fn, ms));
function stop(){
  timers.forEach(clearTimeout); timers = [];
  document.body.classList.remove('run');
  bug.classList.remove('autumn','leaving');
  bug.style.transition = 'none'; bug.style.opacity = 0;
}
function play(){
  stop(); build(); void bug.offsetWidth;
  document.body.classList.add('run');
  bug.style.transition = 'opacity .8s ease, transform .8s cubic-bezier(.16,1,.3,1)';
  bug.style.transform = 'translateY(-8px)'; void bug.offsetWidth;
  bug.style.opacity = 1; bug.style.transform = 'translateY(0)';
  at(5000, ()=>bug.classList.add('autumn'));
  at(8000, ()=>bug.classList.add('leaving'));
  at(8700, ()=>{bug.classList.remove('autumn','leaving'); bug.style.opacity = 0; bug.style.transform = 'translateY(6px)';});
  at(9700, play);
}
addEventListener('DOMContentLoaded', play);
/* OBS Studio: restart when the source becomes visible, stop when hidden */
addEventListener('obsSourceVisibleChanged', e => e.detail.visible ? play() : stop());
</script>
</body>
</html>
