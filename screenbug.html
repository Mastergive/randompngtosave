<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Vintage Screenbug (Exact Broadcast Loop)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Standard Arabic broadcast positioning: Top-Right corner */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 220px;
            height: auto;
            opacity: 0;
            transform-origin: center;
        }

        /* --- CHANGED: SCREENBUG JUST FADES IN SMOOTHLY --- */
        .animate-entrance {
            animation: spacetoonFadeIntro 0.5s ease-out forwards;
        }

        /* --- THE SHINE CONTAINER --- */
        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: inline-block;
        }

        /* The transparent 3D logo asset layer */
        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- THE SHINE EFFECT LAYER --- */
        .shine-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* --- FIXED: MASK KEEPS THE SHINE ONLY ON EXISTENT PIXELS --- */
            -webkit-mask-image: url('Stoon3D.png');
            mask-image: url('Stoon3D.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        /* Creates the custom right-to-left sheen strip over the transparent mask base */
        .shine-layer::after {
            content: '';
            position: absolute;
            top: 0;
            right: -150%; 
            width: 100%;
            height: 100%;
            background: linear-gradient(
                -90deg,
                transparent 0%,
                rgba(255, 255, 255, 0) 25%,
                rgba(255, 255, 255, 0.85) 50%, /* Bright vintage shine look */
                rgba(255, 255, 255, 0) 75%,
                transparent 100%
            );
            transform: skewX(25deg);
            
            /* Clips the sheen mask layer strictly inside the parent background boundaries */
            mix-blend-mode: overlay;
        }

        /* --- CHANGED: LOCKED TO EXACTLY 1.0 SECOND LOOP --- */
        .shine-active::after {
            animation: logoShineFastRTL 1.0s linear infinite;
        }

        /* --- KEYFRAMES --- */

        /* Clean and classic fade-in opacity transition */
        @keyframes spacetoonFadeIntro {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 0.95; /* Clean, clear semi-translucent broadcast look */
            }
        }

        /* Right-to-left sweeping motion */
        @keyframes logoShineFastRTL {
            0% {
                right: -120%;
            }
            100% {
                right: 120%;
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
            
            <div class="shine-layer" id="shine-element"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const shineElement = document.getElementById('shine-element');

        function triggerBroadcastSequence() {
            // Remove animation classes to reset tracking states completely
            container.classList.remove('animate-entrance');
            shineElement.classList.remove('shine-active');
            
            // Force browser engine layout calculation reset before triggering intro
            void container.offsetWidth;
            
            // 1. Kickoff the fade-in entrance sequence immediately
            container.classList.add('animate-entrance');
            
            // 2. Start the continuous rapid shine loop right after it finishes fading in
            setTimeout(() => {
                shineElement.classList.add('shine-active');
            }, 500);
        }

        // Run when page loads or gets refreshed
        window.addEventListener('DOMContentLoaded', () => {
            triggerBroadcastSequence();
        });

        /* OBS Browser Source Live State Tracking Hooks */
        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                triggerBroadcastSequence();
            } else {
                container.classList.remove('animate-entrance');
                shineElement.classList.remove('shine-active');
            }
        });
    </script>
</body>
</html>
