<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Screenbug (Netlify Production 25FPS)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 220px;
            height: auto;
            opacity: 0;
            transform-origin: center;
            will-change: transform, opacity;
            transform: translateZ(0);
        }

        .looping-active {
            animation: spacetoonMasterLoop 12s ease-in-out infinite;
        }

        #bug-canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        @keyframes spacetoonMasterLoop {
            0% { opacity: 0; transform: scale(0) rotate(25deg) translateX(50px) translateZ(0); }
            4.8% { transform: scale(1.08) rotate(-5deg) translateX(-5px) translateZ(0); }
            6.6% { opacity: 0.93; transform: scale(1) rotate(0deg) translateX(0) translateZ(0); }
            83.3% { opacity: 0.93; transform: scale(1) rotate(0deg) translateX(0) translateZ(0); }
            86.5% { opacity: 0.7; transform: scale(0.9, 1.05) rotate(-3deg) translateX(-15px) translateZ(0); }
            91.6% { opacity: 0; transform: scale(0) rotate(15deg) translateX(40px) translateZ(0); }
            100% { opacity: 0; transform: scale(0) rotate(25deg) translateX(50px) translateZ(0); }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <canvas id="bug-canvas"></canvas>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const canvas = document.getElementById('bug-canvas');
        const ctx = canvas.getContext('2d');
        
        const img = new Image();
        
        // --- FIXED: Back to a normal path! Netlify handles the security policies flawlessly ---
        img.crossOrigin = "anonymous";
        img.src = "Stoon3D.png";

        let shineInterval;
        const targetFPS = 25; 
        const frameDuration = 1000 / targetFPS; 
        let currentPos = -1.5; 

        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            startScreenbug();
        };

        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            ctx.globalCompositeOperation = 'source-in';

            const shineWidth = canvas.width * 0.8;
            const startX = canvas.width + (canvas.width * currentPos);
            const gradient = ctx.createLinearGradient(startX, 0, startX - shineWidth, 0);
            
            gradient.addColorStop(0, 'rgba(255,255,255,0)');
            gradient.addColorStop(0.3, 'rgba(255,255,255,0)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.75)'); 
            gradient.addColorStop(0.7, 'rgba(255,255,255,0)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');

            ctx.fillStyle = gradient;
            
            ctx.save();
            ctx.translate(startX, canvas.height / 2);
            ctx.transform(1, 0, 0.46, 1, 0, 0); // Smooth 2D matrix skew transformation
            ctx.fillRect(-shineWidth, -canvas.height, shineWidth * 2, canvas.height * 2);
            ctx.restore();

            ctx.globalCompositeOperation = 'source-over';

            currentPos += 0.1; 
            if (currentPos >= 1.5) {
                currentPos = -1.5;
            }
        }

        function startScreenbug() {
            container.classList.add('looping-active');
            if (shineInterval) clearInterval(shineInterval);
            shineInterval = setInterval(drawFrame, frameDuration);
        }

        function stopScreenbug() {
            container.classList.remove('looping-active');
            if (shineInterval) clearInterval(shineInterval);
        }

        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                startScreenbug();
            } else {
                stopScreenbug();
            }
        });
    </script>
</body>
</html>
