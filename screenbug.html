<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Screenbug - Full Envelope Fall 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* تموضع البث القياسي: أعلى اليمين */
        #screenbug-wrapper {
            position: absolute;
            top: 35px;
            right: 45px;
            width: 240px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: blur(0.2px) contrast(1.08) saturate(1.15) drop-shadow(0 4px 12px rgba(0,0,0,0.35));
        }

        /* غلاف الشعار الرئيسي */
        #logo-container {
            position: relative;
            width: 220px;
            height: auto;
            z-index: 3;
            transform: translate3d(0, 0, 0);
            will-change: transform, opacity;
        }

        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* اللمعان الأصلي بدون أي تعديل */
        .shine-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-mask-image: url('Stoon3D.png');
            mask-image: url('Stoon3D.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        .shine-layer::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0; 
            width: 100%;
            height: 100%;
            background: linear-gradient(
                -90deg,
                transparent 0%,
                rgba(15, 35, 120, 0) 40%,
                rgba(25, 60, 180, 0.4) 47%,
                rgba(70, 120, 255, 0.6) 50%,
                rgba(25, 60, 180, 0.4) 53%,
                rgba(15, 35, 120, 0) 60%,
                transparent 100%
            );
            transform: skewX(25deg) translate3d(-120%, 0, 0);
            mix-blend-mode: color-dodge;
            opacity: 0.85;
            will-change: transform;
            animation: logoShineFastRTL 1.0s linear infinite;
        }

        /* توهج خريفي خلف الشعار بالكامل */
        .fall-aura-glow {
            position: absolute;
            width: 260px;
            height: 120px;
            background: radial-gradient(ellipse at center, rgba(255, 109, 0, 0.45) 0%, rgba(221, 44, 0, 0.2) 50%, rgba(0, 0, 0, 0) 75%);
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            will-change: opacity;
        }

        /* إطار كامل من الأشجار والنباتات المحيطة بالشعار */
        .full-fall-envelope {
            position: absolute;
            width: 270px;
            height: 130px;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.85);
            will-change: transform, opacity;
        }

        /* طبقة الأوراق والجسيمات المتطايرة أمام الشعار */
        .front-leaf-storm {
            position: absolute;
            width: 280px;
            height: 130px;
            z-index: 4;
            opacity: 0;
            pointer-events: none;
            will-change: opacity;
        }

        /* تحريك الرياح على الشجر والأغصان */
        .forest-sway {
            transform-origin: bottom center;
            animation: fallForestWind 2.2s ease-in-out infinite alternate;
        }

        /* تحريك الجسيمات والأوراق المتطايرة */
        .particle-leaf {
            will-change: transform, opacity;
            animation: leafStormDrift 2.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
        }
        .particle-leaf-2 {
            animation-delay: 0.6s;
            animation-duration: 2.1s;
        }
        .particle-leaf-3 {
            animation-delay: 1.2s;
            animation-duration: 2.8s;
        }
        .particle-leaf-4 {
            animation-delay: 1.8s;
            animation-duration: 2.4s;
        }

        /* --- Master Timeline (8.5s Loop) --- */
        .active-sequence #screenbug-wrapper {
            animation: masterBugFade 8.5s ease-in-out infinite;
        }

        .active-sequence .full-fall-envelope {
            animation: envelopeExpand 8.5s cubic-bezier(0.175, 0.885, 0.32, 1.2) infinite;
        }

        .active-sequence .fall-aura-glow,
        .active-sequence .front-leaf-storm {
            animation: glowAndStormTrigger 8.5s ease-in-out infinite;
        }

        /* ظهور الشعار والدورة الكاملة */
        @keyframes masterBugFade {
            0% { opacity: 0; transform: translate3d(0, -3px, 0); }
            5% { opacity: 0.98; transform: translate3d(0, 0, 0); }
            94% { opacity: 0.98; transform: translate3d(0, 0, 0); }
            100% { opacity: 0; transform: translate3d(0, 3px, 0); }
        }

        /* انشباك وإحاطة الغابة بالشعار بعد 5 ثوانٍ */
        @keyframes envelopeExpand {
            0%, 58.8% { /* 0s - 5.0s (مختفي خلف الشعار) */
                opacity: 0;
                transform: scale(0.8);
            }
            64.7% { /* 5.5s (توسع كامل وإحاطة بالشعار) */
                opacity: 1;
                transform: scale(1);
            }
            94.1% { /* 8.0s (بقاء الإحاطة طوال الـ 3 ثواني) */
                opacity: 1;
                transform: scale(1);
            }
            100% { /* 8.5s (انكماش واختفاء) */
                opacity: 0;
                transform: scale(0.85);
            }
        }

        @keyframes glowAndStormTrigger {
            0%, 58.8% { opacity: 0; }
            64.7%, 94.1% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* حركة اهتزاز الرياح للأشجار المحيطة */
        @keyframes fallForestWind {
            0% { transform: rotate(0deg) skewX(0deg); }
            100% { transform: rotate(-3deg) skewX(-1.5deg); }
        }

        /* تطاير الأوراق عبر مساحة الشعار بالكامل */
        @keyframes leafStormDrift {
            0% {
                transform: translate3d(140px, -20px, 0) rotate(0deg) scale(0.9);
                opacity: 0;
            }
            15% { opacity: 1; }
            85% { opacity: 0.8; }
            100% {
                transform: translate3d(-120px, 60px, 0) rotate(-280deg) scale(0.4);
                opacity: 0;
            }
        }

        /* حركة اللمعان الأصلي */
        @keyframes logoShineFastRTL {
            0% { 
                transform: skewX(25deg) translate3d(-120%, 0, 0); 
            }
            100% { 
                transform: skewX(25deg) translate3d(120%, 0, 0); 
            }
        }
    </style>
</head>
<body>

    <div id="screenbug-wrapper">
        <!-- التوهج الدافئ الخريفي -->
        <div class="fall-aura-glow"></div>

        <!-- غابة الخريف المحيطة بالشعار بالكامل (Envelope SVG) -->
        <svg class="full-fall-envelope" viewBox="0 0 270 130" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="barkGrad" x1="0" y1="0" x2="0" y2="100%">
                    <stop offset="0%" stop-color="#3E2723"/>
                    <stop offset="100%" stop-color="#1B0000"/>
                </linearGradient>

                <radialGradient id="redFoliage" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#FF3D00"/>
                    <stop offset="70%" stop-color="#C2185B"/>
                    <stop offset="100%" stop-color="#4A000B"/>
                </radialGradient>

                <radialGradient id="orangeFoliage" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#FF9100"/>
                    <stop offset="70%" stop-color="#E65100"/>
                    <stop offset="100%" stop-color="#8D0000"/>
                </radialGradient>

                <radialGradient id="goldFoliage" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#FFD600"/>
                    <stop offset="70%" stop-color="#FFAB00"/>
                    <stop offset="100%" stop-color="#E65100"/>
                </radialGradient>

                <filter id="softDropShadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
                </filter>
            </defs>

            <!-- الأرضية والتلة الخريفية السفلية الممتدة تحت الشعار -->
            <ellipse cx="135" cy="118" rx="120" ry="10" fill="#3E1C00" opacity="0.8"/>
            <path d="M15 118C50 110 220 110 255 118Z" fill="#BF360C"/>

            <!-- الأشجار والنباتات الملتفة حول كل الزوايا (Forest Sway) -->
            <g class="forest-sway" filter="url(#softDropShadow)">
                
                <!-- 1. شجرة يسار الشعار (الكبيرة) -->
                <path d="M40 120C40 95 38 75 30 50 M30 75L18 62 M30 65L42 55" stroke="url(#barkGrad)" stroke-width="4.5" stroke-linecap="round"/>
                <circle cx="30" cy="40" r="22" fill="url(#redFoliage)"/>
                <circle cx="15" cy="48" r="16" fill="url(#orangeFoliage)"/>
                <circle cx="45" cy="45" r="15" fill="url(#goldFoliage)"/>

                <!-- 2. أشجار أعلى الشعار (الأغصان المظلة) -->
                <path d="M100 35C130 18 170 18 200 32" stroke="url(#barkGrad)" stroke-width="3" stroke-linecap="round"/>
                <circle cx="90" cy="22" r="14" fill="url(#goldFoliage)"/>
                <circle cx="120" cy="16" r="16" fill="url(#orangeFoliage)"/>
                <circle cx="155" cy="14" r="18" fill="url(#redFoliage)"/>
                <circle cx="190" cy="20" r="15" fill="url(#goldFoliage)"/>

                <!-- 3. شجرة يمين الشعار (الجهة الأخرى) -->
                <path d="M235 120C235 95 238 80 245 55 M245 80L232 68 M245 70L255 60" stroke="url(#barkGrad)" stroke-width="4" stroke-linecap="round"/>
                <circle cx="245" cy="46" r="20" fill="url(#orangeFoliage)"/>
                <circle cx="230" cy="52" r="15" fill="url(#redFoliage)"/>
                <circle cx="258" cy="50" r="13" fill="url(#goldFoliage)"/>

                <!-- 4. شجيرات وأغصان سفلية تحت الشعار -->
                <circle cx="75" cy="112" r="12" fill="url(#orangeFoliage)"/>
                <circle cx="105" cy="114" r="10" fill="url(#goldFoliage)"/>
                <circle cx="165" cy="114" r="11" fill="url(#redFoliage)"/>
                <circle cx="195" cy="112" r="13" fill="url(#orangeFoliage)"/>
            </g>
        </svg>

        <!-- طبقة الأوراق المتطايرة أمام الشعار بالكامل -->
        <svg class="front-leaf-storm" viewBox="0 0 280 130" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="particle-leaf">
                <path d="M140 30C135 25 125 27 123 20 C131 22 133 15 140 18Z" fill="#FF3D00" transform="scale(0.6)"/>
            </g>
            <g class="particle-leaf particle-leaf-2">
                <path d="M180 50C175 45 165 47 163 40 C171 42 173 35 180 38Z" fill="#FFEA00" transform="scale(0.45)"/>
            </g>
            <g class="particle-leaf particle-leaf-3">
                <path d="M220 25C215 20 205 22 203 15 C211 17 213 10 220 13Z" fill="#FF6D00" transform="scale(0.55)"/>
            </g>
            <g class="particle-leaf particle-leaf-4">
                <path d="M100 60C95 55 85 57 83 50 C91 52 93 45 100 48Z" fill="#FF1744" transform="scale(0.5)"/>
            </g>
        </svg>

        <!-- طبقة الشعار واللمعان 3D -->
        <div id="logo-container">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
            <div class="shine-layer" id="shine-element"></div>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('screenbug-wrapper');

        function triggerBroadcastSequence() {
            document.body.classList.remove('active-sequence');
            void wrapper.offsetWidth; // Force Reflow لتطبيق الإعادات المزامنة
            document.body.classList.add('active-sequence');
        }

        window.addEventListener('DOMContentLoaded', () => {
            triggerBroadcastSequence();
        });

        /* التوافق التام مع مصادر OBS Studio */
        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                triggerBroadcastSequence();
            } else {
                document.body.classList.remove('active-sequence');
            }
        });
    </script>
</body>
</html>
