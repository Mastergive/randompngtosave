<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Vintage Screenbug (Exact Broadcast Loop)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Standard Arabic broadcast positioning: Top-Right corner */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 220px;
            height: auto;
            opacity: 0;
            transform-origin: center;
            
            /* --- SIMULATED 576p CRT ANALOG LOW-QUALITY FEED --- 
               Slightly softens razor-sharp digital edges to replicate older television displays
            */
            filter: blur(0.4px) contrast(1.05) saturate(1.1);
        }

        /* Screenbug just fades in smoothly */
        .animate-entrance {
            animation: spacetoonFadeIntro 0.5s ease-out forwards;
        }

        /* --- THE SHINE CONTAINER --- */
        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: inline-block;
        }

        /* The transparent 3D logo asset layer */
        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- THE SHINE EFFECT LAYER --- */
        .shine-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* MASK KEEPS THE SHINE ONLY ON EXISTENT PIXELS */
            -webkit-mask-image: url('Stoon3D.png');
            mask-image: url('Stoon3D.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        /* Creates the custom right-to-left sheen strip over the transparent mask base */
        .shine-layer::after {
            content: '';
            position: absolute;
            top: 0;
            right: -150%; 
            width: 100%;
            height: 100%;
            
            /* --- CHANGED: SUBTLE DARK COSMIC BLUE SHINE --- 
               Replaced bright white with deep broadcast sapphires and soft feathered edges
            */
            background: linear-gradient(
                -90deg,
                transparent 0%,
                rgba(15, 35, 120, 0) 25%,
                rgba(25, 60, 180, 0.45) 45%, /* Soft deep blue glow lead edge */
                rgba(60, 110, 255, 0.65) 50%, /* Smooth metallic mid-blue core */
                rgba(25, 60, 180, 0.45) 55%, /* Soft deep blue glow trailing edge */
                rgba(15, 35, 120, 0) 75%,
                transparent 100__% /* Using safe native bounds fallback */
            );
            background: linear-gradient(
                -90deg,
                transparent 0%,
                rgba(15, 35, 120, 0) 25%,
                rgba(25, 60, 180, 0.4) 45%,
                rgba(70, 120, 255, 0.6) 50%, 
                rgba(25, 60, 180, 0.4) 55%,
                rgba(15, 35, 120, 0) 75%,
                transparent 100%
            );
            transform: skewX(25deg);
            
            /* color-dodge lights up base pixels dynamically without flattening dark image values */
            mix-blend-mode: color-dodge;
            opacity: 0.85; /* Dimmed slightly to reduce digital sharpness */
        }

        /* LOCKED TO EXACTLY 1.0 SECOND LOOP */
        .shine-active::after {
            animation: logoShineFastRTL 1.0s linear infinite;
        }

        /* --- KEYFRAMES --- */

        /* Clean and classic fade-in opacity transition */
        @keyframes spacetoonFadeIntro {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 0.95; 
            }
        }

        /* Right-to-left sweeping motion */
        @keyframes logoShineFastRTL {
            0% {
                right: -120%;
            }
            100% {
                right: 120%;
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
            
            <div class="shine-layer" id="shine-element"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const shineElement = document.getElementById('shine-element');

        function triggerBroadcastSequence() {
            container.classList.remove('animate-entrance');
            shineElement.classList.remove('shine-active');
            
            void container.offsetWidth;
            
            container.classList.add('animate-entrance');
            
            setTimeout(() => {
                shineElement.classList.add('shine-active');
            }, 500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            triggerBroadcastSequence();
        });

        /* OBS Browser Source Live State Tracking Hooks */
        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                triggerBroadcastSequence();
            } else {
                container.classList.remove('animate-entrance');
                shineElement.classList.remove('shine-active');
            }
        });
    </script>
</body>
</html>
