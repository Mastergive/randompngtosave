<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spacetoon Screenbug - Birthday Celebration</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;overflow:hidden;width:100vw;height:100vh}

/* Identical to the approved version: top 35px, right 45px, 240x120 box, logo 220px */
#bug{position:absolute;top:35px;right:45px;width:240px;height:120px;
  display:flex;align-items:center;justify-content:center;opacity:0}

#logo{position:relative;width:220px;height:auto;z-index:3;transform:translateZ(0);
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.45)) drop-shadow(0 0 1px rgba(0,0,0,.6))}
#logo img{width:100%;display:block}
.party #logo{animation:logoGlow 1s ease-in-out infinite alternate}
@keyframes logoGlow{
  from{filter:drop-shadow(0 6px 10px rgba(0,0,0,.45)) drop-shadow(0 0 3px rgba(255,200,60,.25))}
  to{filter:drop-shadow(0 6px 10px rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(255,205,70,.95))}}

/* Gold sweep, faster during the party */
.shine{position:absolute;inset:0;-webkit-mask:url('Stoon3D.png') center/contain no-repeat;mask:url('Stoon3D.png') center/contain no-repeat}
.shine::after{content:'';position:absolute;inset:-10% 0;width:45%;
  background:linear-gradient(100deg,transparent 0%,rgba(255,236,200,0) 20%,rgba(255,246,225,.85) 50%,rgba(255,236,200,0) 80%,transparent 100%);
  transform:translateX(-130%) skewX(-18deg);mix-blend-mode:screen}
.run .shine::after{animation:sweep 2.4s cubic-bezier(.45,.05,.25,1) .8s infinite}
@keyframes sweep{0%{transform:translateX(-130%) skewX(-18deg)}45%,100%{transform:translateX(330%) skewX(-18deg)}}

/* Rotating golden sunburst + warm glow behind logo */
.rays,#glow{position:absolute;pointer-events:none;opacity:0;transition:opacity .8s ease}
.rays{z-index:1;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;
  background:repeating-conic-gradient(from 0deg,rgba(255,214,90,.55) 0 7deg,transparent 7deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);mask:radial-gradient(circle,#000 8%,transparent 62%);
  mix-blend-mode:screen}
#glow{z-index:1;inset:-40px -60px;background:radial-gradient(ellipse at 50% 50%,rgba(255,170,40,.6) 0%,rgba(255,90,60,.22) 45%,transparent 72%);mix-blend-mode:screen}
.party .rays{opacity:1;animation:spin 14s linear infinite}
.party #glow{opacity:1;animation:breathe 1s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{from{transform:scale(.94)}to{transform:scale(1.08)}}

.layer{position:absolute;inset:0;pointer-events:none;transition:opacity .6s ease}
#back{z-index:2}#front{z-index:4}
.ending .layer,.ending .rays,.ending #glow{opacity:0}
.p{position:absolute;left:0;top:0}

/* Confetti rain */
.conf{opacity:0}
.party .conf{animation:fall var(--t) linear var(--d) infinite}
.conf span{display:block;width:var(--w);height:var(--h);background:var(--c);border-radius:1px;
  animation:tumble var(--s) linear infinite}
@keyframes fall{0%{transform:translate(var(--x),-50px);opacity:0}8%{opacity:1}
  100%{transform:translate(calc(var(--x) + var(--dx)),250px);opacity:.9}}
@keyframes tumble{to{transform:rotate3d(1,.5,.3,720deg)}}

/* Balloons */
.balloon{opacity:0}
.party .balloon{animation:rise var(--t) ease-in var(--d) infinite}
.balloon svg{display:block;width:var(--s);height:calc(var(--s) * 1.75);transform-origin:50% 100%;
  animation:swing 1.6s ease-in-out infinite alternate;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
@keyframes rise{0%{transform:translate(var(--x),270px);opacity:1}
  100%{transform:translate(calc(var(--x) + var(--dx)),-140px);opacity:1}}
@keyframes swing{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}

/* Sparkle stars */
.star{width:var(--s);height:var(--s);margin:calc(var(--s) / -2);opacity:0;
  background:radial-gradient(#fff 0 30%,#ffe27a 60%,#ffb300);
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.party .star{animation:twinkle var(--t) ease-in-out var(--d) infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:translate(var(--x),var(--y)) scale(0) rotate(0)}
  50%{opacity:1;transform:translate(var(--x),var(--y)) scale(1) rotate(90deg)}}
</style>
</head>
<body>
<div id="bug">
  <div class="rays"></div>
  <div id="glow"></div>
  <div class="layer" id="back"></div>
  <div id="logo"><img src="Stoon3D.png" alt="Spacetoon"><div class="shine"></div></div>
  <div class="layer" id="front"></div>
</div>

<svg width="0" height="0" style="position:absolute"><defs>
  <radialGradient id="b0" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff8a9b"/><stop offset="1" stop-color="#d4102f"/></radialGradient>
  <radialGradient id="b1" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8fe3ff"/><stop offset="1" stop-color="#0a74d6"/></radialGradient>
  <radialGradient id="b2" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff2a0"/><stop offset="1" stop-color="#f0a500"/></radialGradient>
  <radialGradient id="b3" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#c6ff9a"/><stop offset="1" stop-color="#2aa628"/></radialGradient>
  <radialGradient id="b4" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#e0b0ff"/><stop offset="1" stop-color="#7a22c9"/></radialGradient>
</defs></svg>

<script>
const bug=document.getElementById('bug'),back=document.getElementById('back'),front=document.getElementById('front');
const rnd=(a,b)=>a+Math.random()*(b-a);
const COL=['#ff3b6b','#ffd400','#26d0ff','#7cff4d','#b45cff','#ff8a00','#ffffff'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const CX=120,CY=60; /* centre of the 240x120 box */

function add(layer,cls,css,html){const e=document.createElement('div');e.className='p '+cls;e.style.cssText=css||'';if(html)e.innerHTML=html;layer.appendChild(e);return e}

/* Looping ambient layers: confetti rain, balloons, sparkles */
function build(){
  back.innerHTML=front.innerHTML='';
  for(let i=0;i<60;i++){
    const e=add(i%2?back:front,'conf','--x:'+rnd(-170,410)+'px;--dx:'+rnd(-40,40)+'px;--t:'+rnd(2.4,4)+'s;--d:'+rnd(0,3)+'s;--s:'+rnd(.8,1.8)+'s;--c:'+pick(COL)+';--w:'+rnd(5,9)+'px;--h:'+rnd(8,14)+'px','<span></span>');
  }
  for(let i=0;i<8;i++){
    const g='url(#b'+(i%5)+')';
    add(i%2?back:front,'balloon','--x:'+rnd(-130,350)+'px;--dx:'+rnd(-30,30)+'px;--t:'+rnd(3.6,5)+'s;--d:'+(i*.45)+'s;--s:'+rnd(34,48)+'px',
      '<svg viewBox="0 0 40 70"><ellipse cx="20" cy="22" rx="17" ry="21" fill="'+g+'"/><ellipse cx="13" cy="13" rx="4" ry="7" fill="#fff" opacity=".4" transform="rotate(-25 13 13)"/><path d="M16 42 20 47 24 42Z" fill="'+g+'"/><path d="M20 47C14 54 26 60 20 68" stroke="#fff" stroke-opacity=".8" stroke-width=".9" fill="none"/></svg>');
  }
  for(let i=0;i<18;i++){
    const a=rnd(0,Math.PI*2);
    add(front,'star','--x:'+(CX+Math.cos(a)*rnd(95,150))+'px;--y:'+(CY+Math.sin(a)*rnd(45,80))+'px;--s:'+rnd(9,20)+'px;--t:'+rnd(.9,1.7)+'s;--d:'+rnd(0,1.5)+'s');
  }
}

/* One-shot confetti cannon from a corner of the logo */
function cannon(side,n){
  for(let i=0;i<n;i++){
    const w=rnd(5,9),h=rnd(8,14);
    const e=add(front,'',"width:"+w+"px;height:"+h+"px;background:"+pick(COL)+";opacity:0;border-radius:1px");
    const ang=(-90+side*rnd(15,70))*Math.PI/180,d=rnd(110,230);
    const x0=side<0?-5:245,y0=100,px=x0+Math.cos(ang)*d,py=y0+Math.sin(ang)*d;
    e.animate([
      {transform:'translate('+x0+'px,'+y0+'px) rotate(0)',opacity:1},
      {transform:'translate('+px+'px,'+py+'px) rotate('+rnd(200,500)+'deg)',opacity:1,offset:.45,easing:'cubic-bezier(.4,0,.9,.6)'},
      {transform:'translate('+(px+side*rnd(0,40))+'px,'+(py+rnd(140,220))+'px) rotate('+rnd(600,1000)+'deg)',opacity:0}
    ],{duration:rnd(1700,2600),easing:'cubic-bezier(.1,.8,.3,1)',delay:rnd(0,160)}).onfinish=()=>e.remove();
  }
}

/* Firework burst: flash, ring, two rings of sparks with gravity */
function firework(x,y){
  const hue=pick(['#ffd400','#ff3b6b','#26d0ff','#7cff4d','#ff8a00','#b45cff']);
  const f=add(back,'','width:12px;height:12px;margin:-6px;border-radius:50%;background:#fff;box-shadow:0 0 30px 14px '+hue);
  f.animate([{transform:'translate('+x+'px,'+y+'px) scale(.2)',opacity:1},{transform:'translate('+x+'px,'+y+'px) scale(2.4)',opacity:0}],{duration:420,easing:'ease-out'}).onfinish=()=>f.remove();
  [[26,rnd(48,70),hue],[16,rnd(26,40),'#fff']].forEach(([n,R,c])=>{
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2+rnd(-.06,.06),dx=Math.cos(a)*R,dy=Math.sin(a)*R;
      const p=add(back,'','width:4px;height:4px;margin:-2px;border-radius:50%;background:'+c+';box-shadow:0 0 6px 2px '+c);
      p.animate([
        {transform:'translate('+x+'px,'+y+'px) scale(1)',opacity:1},
        {transform:'translate('+(x+dx)+'px,'+(y+dy)+'px) scale(1)',opacity:1,offset:.55,easing:'ease-in'},
        {transform:'translate('+(x+dx*1.08)+'px,'+(y+dy*1.08+34)+'px) scale(.2)',opacity:0}
      ],{duration:rnd(1100,1500),easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>p.remove();
    }
  });
}

/* Timeline: 0s logo in -> 1.4s party starts -> 8s party out -> 8.7s logo out -> loop */
let timers=[];const at=(ms,fn)=>timers.push(setTimeout(fn,ms));
function stop(){
  timers.forEach(clearTimeout);timers=[];
  document.body.classList.remove('run');bug.classList.remove('party','ending');
  bug.style.transition='none';bug.style.opacity=0;back.innerHTML=front.innerHTML='';
}
function play(){
  stop();build();void bug.offsetWidth;
  document.body.classList.add('run');
  bug.style.transition='opacity .8s ease, transform .8s cubic-bezier(.16,1,.3,1)';
  bug.style.transform='translateY(-8px)';void bug.offsetWidth;
  bug.style.opacity=1;bug.style.transform='translateY(0)';
  at(1400,()=>{bug.classList.add('party');cannon(-1,34);cannon(1,34)});
  for(let k=0;k<11;k++)at(1800+k*520,()=>firework(CX+rnd(-190,190),CY+rnd(-70,80)));
  at(4600,()=>{cannon(-1,26);cannon(1,26)});
  at(8000,()=>bug.classList.add('ending'));
  at(8700,()=>{bug.style.opacity=0;bug.style.transform='translateY(6px)'});
  at(9800,play);
}
addEventListener('DOMContentLoaded',play);
addEventListener('obsSourceVisibleChanged',e=>e.detail.visible?play():stop());
</script>
</body>
</html>
