<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Screenbug (Transparent Clipped Loop)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top-Right corner positioning */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 220px;
            height: auto;
            opacity: 0;
            transform-origin: center;
            will-change: transform, opacity;
            transform: translateZ(0);
        }

        /* --- CHANGED: This now triggers a quick intro pop immediately, then stays visible --- */
        .looping-active {
            animation: spacetoonIntro 1.2s ease-out forwards;
        }

        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: inline-block;
            overflow: hidden;
        }

        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- Shine strictly inside the Logo Pixels --- */
        .bug-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0; 
            width: 100%;
            height: 100%;
            
            background: linear-gradient(
                115deg,
                transparent 30%,
                rgba(255, 255, 255, 0.75) 50%,
                transparent 70%
            );
            background-size: 200% 100%;
            background-position: var(--shine-pos, 150%) 0;

            -webkit-mask-image: url('Stoon3D.png');
            mask-image: url('Stoon3D.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
        }

        /* --- NEW: Cleaned-up Intro Keyframes --- */
        /* This handles the scale and rotation instantly on load, then locks it at 100% visible */
        @keyframes spacetoonIntro {
            0% {
                opacity: 0;
                transform: scale(0) rotate(25deg) translateX(50px) translateZ(0);
            }
            60% {
                transform: scale(1.08) rotate(-5deg) translateX(-5px) translateZ(0);
            }
            100% {
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateX(0) translateZ(0);
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper" id="wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const wrapper = document.getElementById('wrapper');
        
        let shineInterval;
        const targetFPS = 20; 
        const frameDuration = 1000 / targetFPS; 

        function runOptimizedShine() {
            if (shineInterval) clearInterval(shineInterval);

            let currentPos = 150;
            const endPos = -50;
            const totalFrames = (1.2 * 1000) / frameDuration; 
            const stepIncrement = (endPos - currentPos) / totalFrames;

            shineInterval = setInterval(() => {
                currentPos += stepIncrement;
                
                if (currentPos <= endPos) {
                    currentPos = 150; // Continuously loop the shine sequence
                }
                
                wrapper.style.setProperty('--shine-pos', `${currentPos}%`);
            }, frameDuration);
        }

        function startScreenbug() {
            // Reset the animation class to force a fresh restart if toggled via OBS
            container.classList.remove('looping-active');
            void container.offsetWidth; // Clever trick to force browser reflow
            
            container.classList.add('looping-active');
            runOptimizedShine();
        }

        function stopScreenbug() {
            container.classList.remove('looping-active');
            if (shineInterval) clearInterval(shineInterval);
        }

        // Triggers instantly when you open the file
        window.addEventListener('DOMContentLoaded', () => {
            startScreenbug();
        });

        // Handles OBS scenes switching properly
        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                startScreenbug();
            } else {
                stopScreenbug();
            }
        });
    </script>
</body>
</html>
