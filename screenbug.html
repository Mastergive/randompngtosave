<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Screenbug (Transparent Clipped Loop)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top-Right corner positioning */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 220px;
            height: auto;
            opacity: 0;
            transform-origin: center;
            will-change: transform, opacity;
            transform: translateZ(0);
        }

        /* Master 12-Second Visibility Loop */
        .looping-active {
            animation: spacetoonMasterLoop 12s ease-in-out infinite;
        }

        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: inline-block;
            overflow: hidden;
        }

        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- FIXED: Shine strictly inside the Logo Pixels --- */
        .bug-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0; /* Kept at 0 so the mask stays aligned with the image */
            width: 100%;
            height: 100%;
            
            /* The shine gradient */
            background: linear-gradient(
                115deg,
                transparent 30%,
                rgba(255, 255, 255, 0.75) 50%,
                transparent 70%
            );
            background-size: 200% 100%;
            /* Control the sweep via background position instead of moving the whole element */
            background-position: var(--shine-pos, 150%) 0;

            /* Alpha Channel Masking */
            -webkit-mask-image: url('Stoon3D.png');
            mask-image: url('Stoon3D.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
        }

        /* --- Master Animation Sequence Keyframes --- */
        @keyframes spacetoonMasterLoop {
            0% {
                opacity: 0;
                transform: scale(0) rotate(25deg) translateX(50px) translateZ(0);
            }
            4.8% {
                transform: scale(1.08) rotate(-5deg) translateX(-5px) translateZ(0);
            }
            6.6% {
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateX(0) translateZ(0);
            }
            83.3% {
                opacity: 0.93;
                transform: scale(1) rotate(0deg) translateX(0) translateZ(0);
            }
            86.5% {
                opacity: 0.7;
                transform: scale(0.9, 1.05) rotate(-3deg) translateX(-15px) translateZ(0);
            }
            91.6% {
                opacity: 0;
                transform: scale(0) rotate(15deg) translateX(40px) translateZ(0);
            }
            100% {
                opacity: 0;
                transform: scale(0) rotate(25deg) translateX(50px) translateZ(0);
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper" id="wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const wrapper = document.getElementById('wrapper');
        
        let shineInterval;
        const targetFPS = 20; 
        const frameDuration = 1000 / targetFPS; 

        function runOptimizedShine() {
            if (shineInterval) clearInterval(shineInterval);

            // Adjusted coordinates to move the background-position smoothly
            let currentPos = 150;
            const endPos = -50;
            const totalFrames = (1.2 * 1000) / frameDuration; 
            const stepIncrement = (endPos - currentPos) / totalFrames;

            shineInterval = setInterval(() => {
                currentPos += stepIncrement;
                
                if (currentPos <= endPos) {
                    currentPos = 150; // Reset loop
                }
                
                wrapper.style.setProperty('--shine-pos', `${currentPos}%`);
            }, frameDuration);
        }

        function startScreenbug() {
            container.classList.add('looping-active');
            runOptimizedShine();
        }

        function stopScreenbug() {
            container.classList.remove('looping-active');
            if (shineInterval) clearInterval(shineInterval);
        }

        window.addEventListener('DOMContentLoaded', () => {
            startScreenbug();
        });

        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                startScreenbug();
            } else {
                stopScreenbug();
            }
        });
    </script>
</body>
</html>
