<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Horizon Premium Screenbug</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fixed Top-Right Broadcast Placement */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 220px;
            height: auto;
            opacity: 0;
            transform-origin: center;
            will-change: transform, opacity, filter;
        }

        /* --- THE COSMIC ORBIT OVERDRIVE ENTRANCE --- */
        .animate-entrance {
            animation: spacetoonCosmicIntro 1.4s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: inline-block;
        }

        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- THE METALLIC SHINE OVERLAY LAYER --- */
        .shine-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('Stoon3D.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-blend-mode: source-over;
        }

        /* Glowing sheen strip styling */
        .shine-layer::after {
            content: '';
            position: absolute;
            top: 0;
            right: -150%; 
            width: 120%;
            height: 100%;
            background: linear-gradient(
                -110deg,
                transparent 0%,
                rgba(255, 255, 255, 0) 30%,
                rgba(255, 255, 255, 0.9) 50%, /* Vivid, high-end reflection sheen */
                rgba(255, 255, 255, 0) 70%,
                transparent 100__%
            );
            transform: skewX(30deg); /* Aggressive, clean modern slope angle */
            mix-blend-mode: overlay;
        }

        /* --- LOCKED 1-SECOND SHINE LOOP --- */
        .shine-active::after {
            animation: logoShinePremiumRTL 1.0s linear infinite;
        }

        /* --- UNEXPECTED PEAK NOSTALGIA KEYFRAMES --- */
        @keyframes spacetoonCosmicIntro {
            0% {
                opacity: 0;
                /* Starts deeply shrunk, highly rotated, and heavily blurred like a distant nebula */
                transform: scale(0) rotate(-180deg) translateZ(0);
                filter: blur(20px) brightness(3);
            }
            40% {
                opacity: 1;
                filter: blur(4px) brightness(1.8);
            }
            70% {
                /* Dramatic cosmic overshoot: expands past normal scale with an astronomical tilt */
                transform: scale(1.12) rotate(10deg) translateZ(0);
                filter: blur(0px) brightness(1.2);
            }
            85% {
                /* Tiny sub-bounce settle mirroring gravity capture */
                transform: scale(0.96) rotate(-2deg) translateZ(0);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg) translateZ(0);
                filter: blur(0px) brightness(1);
            }
        }

        /* Buttery smooth 1-second right-to-left sweep loop */
        @keyframes logoShinePremiumRTL {
            0% {
                right: -150%;
            }
            100% {
                right: 150%;
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
            
            <div class="shine-layer" id="shine-element"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const shineElement = document.getElementById('shine-element');

        function cookPeakSequence() {
            container.classList.remove('animate-entrance');
            shineElement.classList.remove('shine-active');
            
            // Force hardware layout recalculation
            void container.offsetWidth;
            
            // 1. Unleash the customized cosmic rotation entry
            container.classList.add('animate-entrance');
            
            // 2. Safely lock the 1.0s shine loop right as the space bounce finishes settling
            setTimeout(() => {
                shineElement.classList.add('shine-active');
            }, 1400);
        }

        // Trigger on initial page render/refresh
        window.addEventListener('DOMContentLoaded', () => {
            cookPeakSequence();
        });

        /* OBS Browser Link Visibility Management Hooks */
        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                cookPeakSequence();
            } else {
                container.classList.remove('animate-entrance');
                shineElement.classList.remove('shine-active');
            }
        });
    </script>
</body>
</html>
