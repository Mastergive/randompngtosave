<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Vintage Screenbug (60 FPS Exact Loop)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* تموضع البث العربي القياسي: الزاوية العليا اليمنى */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px;
            width: 220px;
            height: auto;
            opacity: 0;
            transform-origin: center;
            /* تفعيل تسريع كرت الشاشة للشعار بالكامل لمنع الـ Lag */
            transform: translate3d(0, 0, 0);
            will-change: opacity;
            filter: blur(0.4px) contrast(1.05) saturate(1.1);
        }

        /* حركة ظهور الشعار بسلاسة */
        .animate-entrance {
            animation: spacetoonFadeIntro 0.5s ease-out forwards;
        }

        /* غلاف الشعار */
        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: inline-block;
        }

        /* صورة الشعار ثلاثي الأبعاد */
        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* طبقة تأثير اللمعان (Shine) */
        .shine-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* قناع لحصر اللمعان داخل حدود الشعار فقط */
            -webkit-mask-image: url('Stoon3D.png');
            mask-image: url('Stoon3D.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        /* شريط اللمعان المائل من اليمين إلى اليسار */
        .shine-layer::after {
            content: '';
            position: absolute;
            top: 0;
            /* تثبيت العنصر في أقصى اليمين والتحريك يعتمد كلياً على الـ transform المسرع بالـ GPU */
            right: 0; 
            width: 100%;
            height: 100%;
            /* لمعان أزرق نحيف وحاد في المنتصف لمحاكاة الانعكاس الكريستالي الأصلي */
            background: linear-gradient(
                -90deg,
                transparent 0%,
                rgba(15, 35, 120, 0) 40%,
                rgba(25, 60, 180, 0.4) 47%,
                rgba(70, 120, 255, 0.6) 50%, /* النواة المضيئة */
                rgba(25, 60, 180, 0.4) 53%,
                rgba(15, 35, 120, 0) 60%,
                transparent 100%
            );
            /* البداية من خارج حدود الشعار يميناً */
            transform: skewX(25deg) translate3d(-120%, 0, 0);
            mix-blend-mode: color-dodge;
            opacity: 0.85;
            will-change: transform;
        }

        /* تكرار اللمعان اللانهائي كل 1.0 ثانية تماماً مثل كودك القديم */
        .shine-active::after {
            animation: logoShineFastRTL 1.0s linear infinite;
        }

        /* --- الإطارات المفتاحية المحسنة للـ 60 إطار (Keyframes) --- */
        @keyframes spacetoonFadeIntro {
            0% { opacity: 0; }
            100% { opacity: 0.95; }
        }

        /* التحريك باستخدام translate3d يضمن معالجة الأنميشن بواسطة الـ GPU بـ 60 إطاراً ناعماً */
        @keyframes logoShineFastRTL {
            0% { 
                transform: skewX(25deg) translate3d(-120%, 0, 0); 
            }
            100% { 
                transform: skewX(25deg) translate3d(120%, 0, 0); 
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
            <div class="shine-layer" id="shine-element"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const shineElement = document.getElementById('shine-element');

        function triggerBroadcastSequence() {
            container.classList.remove('animate-entrance');
            shineElement.classList.remove('shine-active');
            void container.offsetWidth; // Force Reflow لإعادة تشغيل الأنميشن من البداية
            
            container.classList.add('animate-entrance');
            
            // يبدأ اللمعان المستمر فوراً بعد نصف ثانية من ظهور الشعار
            setTimeout(() => {
                shineElement.classList.add('shine-active');
            }, 500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            triggerBroadcastSequence();
        });

        /* التوافق مع برمجيات OBS لضمان إعادة تشغيل التأثير عند إظهار المصدر */
        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                triggerBroadcastSequence();
            } else {
                container.classList.remove('animate-entrance');
                shineElement.classList.remove('shine-active');
            }
        });
    </script>
</body>
</html>
