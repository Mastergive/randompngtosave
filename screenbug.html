<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Vintage Screenbug (Exact Video Clone)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top-Right broadcast position */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 220px;
            height: auto;
            transform-origin: center;
        }

        /* --- THE EXACT ENTRANCE ANIMATION --- 
           Clones the dynamic pop, rotation twist, and elastic settle from the video
        */
        .animate-entrance {
            animation: spacetoonBroadcastPop 0.9s cubic-bezier(0.25, 1.3, 0.4, 1) forwards;
        }

        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: inline-block;
        }

        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- THE PERFECT SHINE OVERLAY --- */
        .bug-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            right: -150%; 
            width: 100%;
            height: 100%;
            background: linear-gradient(
                -90deg,
                transparent 0%,
                rgba(255, 255, 255, 0) 25%,
                rgba(255, 255, 255, 0.8) 50%, 
                rgba(255, 255, 255, 0) 75%,
                transparent 100%
            );
            transform: skewX(25deg);
            
            /* Clips the shine so it only shows inside the logo boundaries */
            -webkit-mask-image: url('Stoon3D.png');
            mask-image: url('Stoon3D.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        /* --- 1-SECOND SHINE LOOP --- */
        .shine-active::after {
            animation: logoShineExactRTL 1.0s linear infinite;
        }

        /* --- KEYFRAMES --- */

        /* Replicating the distinct fast scale up and bounce back from the clip */
        @keyframes spacetoonBroadcastPop {
            0% {
                opacity: 0;
                transform: scale(0.1) rotate(20deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.15) rotate(-5deg); /* Bouncy over-scale */
            }
            75% {
                transform: scale(0.95) rotate(2deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg); /* Settles perfectly straight */
            }
        }

        /* Sweeps across the logo right-to-left over 1 full second */
        @keyframes logoShineExactRTL {
            0% {
                right: -150%;
            }
            100% {
                right: 150%;
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper" id="bug-element">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const bugElement = document.getElementById('bug-element');

        function startSequence() {
            // Clear any lingering animation states
            container.classList.remove('animate-entrance');
            bugElement.classList.remove('shine-active');
            
            // Force dynamic layout re-flow calculation
            void container.offsetWidth;
            
            // 1. Fire entrance animation instantly on load or source toggle
            container.classList.add('animate-entrance');
            
            // 2. Start the steady 1-second right-to-left shine right as the logo settles
            setTimeout(() => {
                bugElement.classList.add('shine-active');
            }, 900);
        }

        // Initialize when page mounts or refreshes
        window.addEventListener('DOMContentLoaded', () => {
            startSequence();
        });

        /* OBS Toggle Hooks */
        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                startSequence();
            } else {
                container.classList.remove('animate-entrance');
                bugElement.classList.remove('shine-active');
            }
        });
    </script>
</body>
</html>
