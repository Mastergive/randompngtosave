<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spacetoon Screenbug</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;overflow:hidden;width:100vw;height:100vh}

#bug{
  position: absolute;
  top: 35px;
  right: 45px;
  width: 240px;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1);
}

#logo {
  width: 220px;
  height: auto;
}

#logo svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}

/* Shine animation strictly bounded by the SVG mask */
.shine-rect {
  animation: sweep 1.8s cubic-bezier(.25, .46, .45, .94) infinite;
}

@keyframes sweep {
  0% { transform: translateX(-60%); }
  60% { transform: translateX(60%); }
  100% { transform: translateX(60%); }
}

/* Entrance animation */
#bug.show { opacity: 1; transform: translateY(0); }
#bug { transform: translateY(-10px); }
</style>
</head>
<body>
<div id="bug">
  <div id="logo">
    <svg viewBox="0 0 500 250">
      <defs>
        <!-- Linear gradient for the light glint/shine -->
        <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
          <stop offset="35%" stop-color="#ffffff" stop-opacity="0" />
          <stop offset="48%" stop-color="#ffffff" stop-opacity="0.85" />
          <stop offset="52%" stop-color="#ffffff" stop-opacity="0.85" />
          <stop offset="65%" stop-color="#ffffff" stop-opacity="0" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>

        <!-- SVG Mask using the exact alpha channel of Stoon3D.png -->
        <mask id="logoMask">
          <image href="Stoon3D.png" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" />
        </mask>
      </defs>

      <!-- 1. The base logo image -->
      <image href="Stoon3D.png" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" />

      <!-- 2. The moving shine rectangle, masked precisely to the logo's opaque pixels -->
      <g mask="url(#logoMask)">
        <rect class="shine-rect" x="-100%" y="0" width="300%" height="100%" fill="url(#shineGrad)" mix-blend-mode="screen" />
      </g>
    </svg>
  </div>
</div>

<script>
const bug = document.getElementById('bug');

function show(){
  bug.style.transition = 'opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1)';
  bug.classList.add('show');
}

function hide(){
  bug.classList.remove('show');
  bug.style.transition = 'opacity .5s ease, transform .5s ease-in';
}

document.addEventListener('DOMContentLoaded', show);

/* OBS Studio: restart when the source becomes visible, stop when hidden */
addEventListener('obsSourceVisibleChanged', e => e.detail.visible ? show() : hide());
</script>
</body>
</html>
