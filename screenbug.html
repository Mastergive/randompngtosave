<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spacetoon Screenbug - Birthday (Lite)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;overflow:hidden;width:100vw;height:100vh}

/* Identical to approved version: top 35px, right 45px, 240x120 box, logo 220px */
#bug{position:absolute;top:35px;right:45px;width:240px;height:120px;
  display:flex;align-items:center;justify-content:center;opacity:0}

#logo{position:relative;width:220px;height:auto;z-index:3;transform:translateZ(0);
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.45)) drop-shadow(0 0 1px rgba(0,0,0,.6))}
#logo img{width:100%;display:block}

/* Gold sweep (GPU transform only) */
.shine{position:absolute;inset:0;-webkit-mask:url('Stoon3D.png') center/contain no-repeat;mask:url('Stoon3D.png') center/contain no-repeat}
.shine::after{content:'';position:absolute;inset:-10% 0;width:45%;
  background:linear-gradient(100deg,transparent 0%,rgba(255,236,200,0) 20%,rgba(255,246,225,.8) 50%,rgba(255,236,200,0) 80%,transparent 100%);
  transform:translateX(-130%) skewX(-18deg)}
.run .shine::after{animation:sweep 3s cubic-bezier(.45,.05,.25,1) .8s infinite}
@keyframes sweep{0%{transform:translateX(-130%) skewX(-18deg)}42%,100%{transform:translateX(330%) skewX(-18deg)}}

/* Soft warm glow: static gradient, only opacity changes */
#glow{position:absolute;z-index:1;inset:-30px -50px;pointer-events:none;opacity:0;transition:opacity 1.2s ease;
  background:radial-gradient(ellipse at 50% 50%,rgba(255,176,60,.5) 0%,rgba(255,110,50,.16) 50%,transparent 74%)}
.party #glow{opacity:1}
.ending #glow{opacity:0;transition-duration:.8s}

/* One small canvas behind the logo: left edge = bug left - 300px, top = screen top */
#fx{position:absolute;z-index:2;left:-300px;top:-35px;width:585px;height:380px;pointer-events:none}
</style>
</head>
<body>
<div id="bug">
  <div id="glow"></div>
  <canvas id="fx" width="585" height="380"></canvas>
  <div id="logo"><img src="Stoon3D.png" alt="Spacetoon"><div class="shine"></div></div>
</div>

<script>
const bug=document.getElementById('bug'),cv=document.getElementById('fx'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const OX=300,OY=35;                 /* logo box top-left inside the canvas */
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const CONF=[[245,197,66],[230,57,70],[42,157,244],[245,245,245],[255,122,182],[106,211,106],[255,150,40]];
const SPARK=['255,205,90','255,110,110','120,200,255','255,255,255','190,150,255','140,255,170'];
const parts=[];let raf=0,last=0;

/* ---------- spawners ---------- */
function confetti(x,y,ang,speed){
  const a=ang*Math.PI/180,s=speed*rnd(.6,1);
  parts.push({k:0,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:rnd(5,9),h:rnd(8,13),rot:rnd(0,6.28),vr:rnd(-7,7),
    ph:rnd(0,6.28),fs:rnd(5,10),c:pick(CONF),age:0,life:rnd(4,6)});
}
function cannon(side,n){            /* side -1 = left corner, +1 = right corner */
  const x=OX+(side<0?8:232),y=OY+112;
  for(let i=0;i<n;i++)confetti(x,y,side<0?rnd(-125,-80):rnd(-100,-55),rnd(380,640));
  ensure();
}
function rain(){confetti(rnd(OX-100,OX+260),-8,rnd(75,105),rnd(10,40));ensure()}
function rocket(x,ty){parts.push({k:1,x,y:Math.min(H-10,ty+150),px:x,py:ty+150,ty,v:420});ensure()}
function burst(x,y){
  const col=pick(SPARK),n=40;
  for(let i=0;i<n;i++){
    const a=i/n*6.283+rnd(-.08,.08),s=rnd(55,125);
    parts.push({k:2,x,y,px:x,py:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,life:rnd(1.1,1.7),c:i%5?col:'255,255,255'});
  }
}

/* ---------- simulation (small canvas, plain 2D, no blur/shadow) ---------- */
function step(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  ctx.clearRect(0,0,W,H);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    if(p.k===0){                                     /* paper confetti: drag + flutter + 3D flip */
      p.age+=dt;p.vx-=p.vx*3.2*dt;p.vy+=(300-p.vy*3.3)*dt;
      p.ph+=p.fs*dt;p.x+=(p.vx+Math.sin(p.ph*.7)*26)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
      if(p.y>H+20||p.age>p.life){parts.splice(i,1);continue}
      const f=Math.cos(p.ph),sh=.62+.38*Math.abs(f),c=p.c;
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=p.age>p.life-.6?(p.life-p.age)/.6:1;
      ctx.fillStyle='rgb('+(c[0]*sh|0)+','+(c[1]*sh|0)+','+(c[2]*sh|0)+')';
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,f);
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    }else if(p.k===1){                               /* firework shell rising */
      p.px=p.x;p.py=p.y;p.v=Math.max(120,p.v-380*dt);p.y-=p.v*dt;
      ctx.globalAlpha=.9;ctx.globalCompositeOperation='lighter';
      ctx.strokeStyle='rgba(255,220,150,.9)';ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(p.x,p.y+14);ctx.lineTo(p.x,p.y);ctx.stroke();
      if(p.y<=p.ty){burst(p.x,p.y);parts.splice(i,1)}
    }else{                                           /* spark with short trail */
      p.age+=dt;if(p.age>p.life){parts.splice(i,1);continue}
      p.px=p.x;p.py=p.y;p.vx-=p.vx*1.9*dt;p.vy+=(75-p.vy*1.9)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      const u=p.age/p.life;let a=1-u*u;if(u>.7)a*=.55+.45*Math.random();
      ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;
      ctx.strokeStyle='rgb('+p.c+')';ctx.lineWidth=1.7;
      ctx.beginPath();ctx.moveTo(p.px-(p.x-p.px)*1.5,p.py-(p.y-p.py)*1.5);ctx.lineTo(p.x,p.y);ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  raf=parts.length?requestAnimationFrame(step):0;      /* idle = zero CPU */
  if(!raf)ctx.clearRect(0,0,W,H);
}
function ensure(){if(!raf){last=performance.now();raf=requestAnimationFrame(step)}}

/* ---------- timeline: 0s logo in -> 1.2s party -> 7.8s party out -> 8.7s logo out -> loop ---------- */
let timers=[],amb=0;const at=(ms,fn)=>timers.push(setTimeout(fn,ms));
function stop(){
  timers.forEach(clearTimeout);timers=[];clearInterval(amb);
  cancelAnimationFrame(raf);raf=0;parts.length=0;ctx.clearRect(0,0,W,H);
  document.body.classList.remove('run');bug.classList.remove('party','ending');
  bug.style.transition='none';bug.style.opacity=0;
}
function play(){
  stop();void bug.offsetWidth;
  document.body.classList.add('run');
  bug.style.transition='opacity .8s ease, transform .8s cubic-bezier(.16,1,.3,1)';
  bug.style.transform='translateY(-8px)';void bug.offsetWidth;
  bug.style.opacity=1;bug.style.transform='translateY(0)';
  at(1200,()=>{bug.classList.add('party');cannon(-1,24);cannon(1,24);amb=setInterval(rain,150)});
  [[1900,160,110],[2900,330,215],[3900,495,95],[4900,225,50],[5900,455,215]]
    .forEach(([ms,x,y])=>at(ms,()=>rocket(x,y)));
  at(4100,()=>{cannon(-1,14);cannon(1,14)});
  at(7000,()=>clearInterval(amb));
  at(7800,()=>bug.classList.add('ending'));
  at(8700,()=>{bug.style.opacity=0;bug.style.transform='translateY(6px)'});
  at(9800,play);
}
addEventListener('DOMContentLoaded',play);
addEventListener('obsSourceVisibleChanged',e=>e.detail.visible?play():stop());
</script>
</body>
</html>
