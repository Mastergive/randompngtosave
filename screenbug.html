<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Vintage Screenbug (Exact Broadcast Loop)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Standard Arabic broadcast positioning: Top-Right corner */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 220px;
            height: auto;
            opacity: 0;
            transform-origin: center;
        }

        /* --- ENTRANCE ANIMATION (Happens on load/refresh) --- 
           Flies in fast from the right side, scaling up with a slight rotation bounce
        */
        .animate-entrance {
            animation: spacetoonBroadcastIntro 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
        }

        /* --- THE SHINE CONTAINER --- */
        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: inline-block;
        }

        /* The transparent 3D logo asset layer */
        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- THE SHINE EFFECT LAYER --- */
        .shine-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* --- TARGET IMAGE PLACEMENT --- */
            /* This clips the shine gradient to the exact transparent pixels of your logo file */
            background-image: url('Stoon3D.png');
            background-size: contain;
            background-repeat: no-repeat;
            
            /* High-performance blend mode overlaying the bright sheen across the asset colors */
            background-blend-mode: source-over;
        }

        /* Creates the custom right-to-left sheen strip over the transparent mask base */
        .shine-layer::after {
            content: '';
            position: absolute;
            top: 0;
            right: -150%; 
            width: 100%;
            height: 100%;
            background: linear-gradient(
                -90deg,
                transparent 0%,
                rgba(255, 255, 255, 0) 25%,
                rgba(255, 255, 255, 0.85) 50%, /* Bright vintage shine look */
                rgba(255, 255, 255, 0) 75%,
                transparent 100%
            );
            transform: skewX(25deg);
            
            /* Clips the sheen mask layer strictly inside the parent background boundaries */
            mix-blend-mode: overlay;
        }

        /* --- CONTINUOUS FAST SHINE LOOP (Every 0.5 Seconds) --- */
        .shine-active::after {
            animation: logoShineFastRTL 0.5s linear infinite;
        }

        /* --- KEYFRAMES --- */

        /* Exact entry style from the video reference */
        @keyframes spacetoonBroadcastIntro {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(35deg) translateX(250px);
            }
            75% {
                transform: scale(1.06) rotate(-3deg) translateX(-5px);
            }
            100% {
                opacity: 0.95; /* Clean, clear semi-translucent broadcast look */
                transform: scale(1) rotate(0deg) translateX(0);
            }
        }

        /* Right-to-left fast sweeping motion */
        @keyframes logoShineFastRTL {
            0% {
                right: -120%;
            }
            100% {
                right: 120%;
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
            
            <div class="shine-layer" id="shine-element"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const shineElement = document.getElementById('shine-element');

        function triggerBroadcastSequence() {
            // Remove animation classes to reset tracking states completely
            container.classList.remove('animate-entrance');
            shineElement.classList.remove('shine-active');
            
            // Force browser engine layout calculation reset before triggering intro
            void container.offsetWidth;
            
            // 1. Kickoff the fly-in entrance sequence immediately
            container.classList.add('animate-entrance');
            
            // 2. Start the continuous rapid 0.5s right-to-left shine loop right after it drops in
            setTimeout(() => {
                shineElement.classList.add('shine-active');
            }, 800);
        }

        // Run when page loads or gets refreshed
        window.addEventListener('DOMContentLoaded', () => {
            triggerBroadcastSequence();
        });

        /* OBS Browser Source Live State Tracking Hooks */
        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                triggerBroadcastSequence();
            } else {
                container.classList.remove('animate-entrance');
                shineElement.classList.remove('shine-active');
            }
        });
    </script>
</body>
</html>
