<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetoon Vintage Screenbug (Exact Broadcast Loop)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Standard Arabic broadcast positioning: Top-Right corner */
        #logo-container {
            position: absolute;
            top: 35px;
            right: 45px; 
            width: 220px;
            height: auto;
            opacity: 0;
            transform-origin: center;
        }

        /* The screenbug just fades in smoothly */
        .animate-entrance {
            animation: spacetoonFadeIntro 0.5s ease-out forwards;
        }

        /* --- THE SHINE CONTAINER --- */
        .bug-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: inline-block;
        }

        /* The transparent 3D logo asset layer */
        .bug-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- THE SHINE EFFECT LAYER --- */
        .shine-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* FORCE SHINE ONLY ON EXISTENT PIXELS */
            -webkit-mask-image: url('Stoon3D.png');
            mask-image: url('Stoon3D.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        /* Creates the custom right-to-left sheen strip over the clipped mask base */
        .shine-layer::after {
            content: '';
            position: absolute;
            top: 0;
            right: -150%; 
            width: 130%;
            height: 100%;
            
            /* --- REWORKED VINTAGE BROADCAST GRADIENT ---
               Uses warm tones and feathered edges to replicate old analog tape reflections
            */
            background: linear-gradient(
                -90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0) 30%,
                rgba(255, 245, 200, 0.3) 45%,  /* Soft golden glow edge */
                rgba(255, 255, 255, 0.75) 50%, #* Smooth, non-blinding center core */
                rgba(255, 245, 200, 0.3) 55%,  /* Soft golden glow trailing edge */
                rgba(255, 255, 255, 0) 70%,
                transparent 100%
            );
            transform: skewX(28deg);
            
            /* Color-dodge creates a vivid luminous reflection without flattening the 3D texture */
            mix-blend-mode: color-dodge;
        }

        /* --- CONTINUOUS SHINE LOOP (LOCKED TO EXACTLY 1.0 SECOND) --- */
        .shine-active::after {
            animation: logoShineExactRTL 1.0s linear infinite;
        }

        /* --- KEYFRAMES --- */

        /* Clean and classic fade-in opacity transition */
        @keyframes spacetoonFadeIntro {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 0.95; 
            }
        }

        /* Clean right-to-left sweep loop running continuously over 1.0s */
        @keyframes logoShineExactRTL {
            0% {
                right: -140%;
            }
            100% {
                right: 140%;
            }
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <div class="bug-wrapper">
            <img src="Stoon3D.png" alt="Spacetoon Logo" class="bug-image">
            
            <div class="shine-layer" id="shine-element"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('logo-container');
        const shineElement = document.getElementById('shine-element');

        function triggerBroadcastSequence() {
            container.classList.remove('animate-entrance');
            shineElement.classList.remove('shine-active');
            
            void container.offsetWidth;
            
            container.classList.add('animate-entrance');
            
            // Starts the shine loop quickly right as the fade completes (500ms)
            setTimeout(() => {
                shineElement.classList.add('shine-active');
            }, 500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            triggerBroadcastSequence();
        });

        window.addEventListener('obsSourceVisibleChanged', function(event) {
            if (event.detail.visible) {
                triggerBroadcastSequence();
            } else {
                container.classList.remove('animate-entrance');
                shineElement.classList.remove('shine-active');
            }
        });
    </script>
</body>
</html>
