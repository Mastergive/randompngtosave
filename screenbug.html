<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spacetoon Screenbug</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;overflow:hidden;width:100vw;height:100vh}

#bug{position:absolute;top:35px;right:45px;width:240px;height:120px;
  display:flex;align-items:center;justify-content:center;opacity:0;
  transition:opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1)}

/* Logo wrapper takes exact size of the image */
#logo{
  position: relative;
  width: 220px;
  display: inline-block;
}

#logo img{
  width: 100%;
  height: auto;
  display: block;
}

/* Shine overlay masked precisely to the image's non-transparent pixels */
.shine{
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(100deg,
    transparent 0%,
    rgba(255,255,255,0) 15%,
    rgba(255,255,255,.3) 40%,
    rgba(255,255,255,.85) 50%,
    rgba(255,255,255,.3) 60%,
    rgba(255,255,255,0) 85%,
    transparent 100%);
  
  /* Standard & Webkit Mask rules */
  -webkit-mask-image: url("Stoon3D.png");
  mask-image: url("Stoon3D.png");
  -webkit-mask-size: 100% 100%;
  mask-size: 100% 100%;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;

  mix-blend-mode: screen;
  animation: sweep 1.8s cubic-bezier(.25,.46,.45,.94) infinite;
}

@keyframes sweep{
  0%{transform:translateX(-140%) skewX(-15deg);opacity:0}
  15%{opacity:1}
  60%{transform:translateX(140%) skewX(-15deg);opacity:1}
  100%{transform:translateX(180%) skewX(-15deg);opacity:0}
}

/* Entrance animation */
#bug.show{opacity:1;transform:translateY(0)}
#bug{transform:translateY(-10px)}
</style>
</head>
<body>
<div id="bug">
  <div id="logo">
    <img src="Stoon3D.png" alt="Spacetoon">
    <div class="shine"></div>
  </div>
</div>
<script>
const bug = document.getElementById('bug');

function show(){
  bug.style.transition = 'opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1)';
  bug.classList.add('show');
}

function hide(){
  bug.classList.remove('show');
  bug.style.transition = 'opacity .5s ease, transform .5s ease-in';
}

document.addEventListener('DOMContentLoaded', show);

/* OBS Studio: restart when the source becomes visible, stop when hidden */
addEventListener('obsSourceVisibleChanged', e => e.detail.visible ? show() : hide());
</script>
</body>
</html>
